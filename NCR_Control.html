      faixa: faixa(diasMov),
      faixaStatus: faixa(diasStatus),
      etapa: Flow.etapa(rec.ordem),
      retornos: (rec.mov && rec.mov.retornos) || 0,
      movimentos: (rec.mov && rec.mov.total) || 0
    };
  }
  function resumo(list){
    const r = {total:list.length, abertas:0, fechadas:0, semMov:0, comRetorno:0, criticas:0,
               novas7:0, fechadas30:0, movimentos:0, retornos:0, avancos:0, laterais:0, reaberturas:0,
               somaStatus:0, nStatus:0, somaIdade:0, nIdade:0};
    const limiteSemMov = DB.cfg().semMovimentacaoDias || 30;
    const cfg = DB.cfg();
    list.forEach(n => {
      const m = derive(n);
      if(n.fechada) r.fechadas++; else r.abertas++;
      if(m.diasMov != null && m.diasMov >= limiteSemMov && !n.fechada) r.semMov++;
      if(m.retornos > 0) r.comRetorno++;
      const crit = buscaCampo(n, ['critico','criticidade']);
      if(crit && /^(sim|yes|s|1|true)$/i.test(String(crit))) r.criticas++;
      if(m.idade != null && m.idade <= 7) r.novas7++;
      if(n.fechada && m.diasMov != null && m.diasMov <= 30) r.fechadas30++;
      r.movimentos += m.movimentos;
      r.retornos += m.retornos;
      r.avancos += (n.mov && n.mov.avancos) || 0;
      r.laterais += (n.mov && n.mov.laterais) || 0;
      r.reaberturas += (n.mov && n.mov.reaberturas) || 0;
      if(m.diasStatus != null && !n.fechada){ r.somaStatus += m.diasStatus; r.nStatus++; }
      if(m.idade != null){ r.somaIdade += m.idade; r.nIdade++; }
    });
    r.mediaStatus = r.nStatus ? r.somaStatus/r.nStatus : null;
    r.mediaIdade = r.nIdade ? r.somaIdade/r.nIdade : null;
    r.pctFechadas = r.total ? Math.round(r.fechadas/r.total*100) : 0;
    return r;
  }
  /* procura um valor em campos usando aliases normalizados */
  function buscaCampo(rec, aliases){
    const c = rec.campos || {};
    for(const k in c){
      const n = Util.norm(k);
      for(const a of aliases) if(n === Util.norm(a) || n.indexOf(Util.norm(a)) === 0) return c[k];
    }
    return null;
  }
  function contar(list, getter, limite){
    const m = new Map();
    list.forEach(n => {
      let v = getter(n);
      if(v === undefined || v === null || v === '') v = '(vazio)';
      const arr = Array.isArray(v) ? v : [v];
      arr.forEach(x => { const s = Util.strVal(x) || '(vazio)'; m.set(s, (m.get(s)||0)+1); });
    });
    let out = Array.from(m.entries()).map(([label,value]) => ({label, value, key:label}));
    out.sort((a,b) => b.value-a.value || Util.cmp(a.label,b.label));
    if(limite) out = out.slice(0,limite);
    return out;
  }
  function serieMensal(list, getIso, meses){
    meses = meses || 12;
    const buckets = new Map(), hoje = new Date();
    const keys = [];
    for(let i = meses-1; i >= 0; i--){
      const d = new Date(hoje.getFullYear(), hoje.getMonth()-i, 1);
      const k = d.getFullYear()+'-'+(d.getMonth()+1 < 10 ? '0' : '')+(d.getMonth()+1);
      keys.push(k); buckets.set(k, 0);
    }
    list.forEach(n => {
      const iso = getIso(n);
      if(!iso) return;
      const d = new Date(iso);
      if(isNaN(d.getTime())) return;
      const k = d.getFullYear()+'-'+(d.getMonth()+1 < 10 ? '0' : '')+(d.getMonth()+1);
      if(buckets.has(k)) buckets.set(k, buckets.get(k)+1);
    });
    const MES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
    return {categories: keys.map(k => { const p = k.split('-'); return MES[+p[1]-1]+'/'+p[0].slice(2); }),
            values: keys.map(k => buckets.get(k)), keys};
  }
  /* tempo por status a partir do historico + estado atual */
  function temposPorStatus(list){
    const acc = new Map();
    const add = (st, ms, fechado) => {
      if(!st) return;
      if(!acc.has(st)) acc.set(st, {status:st, ms:0, n:0, emAberto:0, msAberto:0});
      const a = acc.get(st);
      if(fechado){ a.ms += ms; a.n++; } else { a.emAberto++; a.msAberto += ms; }
    };
    list.forEach(n => {
      const ev = DB.eventos(n.key).filter(Flow.isFluxoEvt);
      for(let i = 0; i < ev.length; i++){
        const e = ev[i], next = ev[i+1];
        const st = e.para;
        if(!next) continue;
        const dur = new Date(next.data) - new Date(e.data);
        /* quando o export datou so a SAIDA da etapa, a chegada entra na mesma
           data e o intervalo fica zerado: isso nao e permanencia de zero dia,
           e ausencia de informacao — nao pode entrar na media */
        if(e.estimado && dur <= 0) continue;
        add(st, dur, true);
      }
      const atual = n.statusDesde ? (Date.now()-new Date(n.statusDesde)) : null;
      if(atual != null) add(n.status, atual, false);
    });
    return Array.from(acc.values()).map(a => ({
      status:a.status, ordem:Flow.ordemDe(a.status),
      mediaDias: a.n ? (a.ms/a.n/Util.DAY) : null,
      amostras:a.n, emAberto:a.emAberto,
      mediaAbertoDias: a.emAberto ? (a.msAberto/a.emAberto/Util.DAY) : null
    })).sort((a,b) => (b.mediaDias||0)-(a.mediaDias||0));
  }
  function tempoAteFechamento(list){
    const durs = [];
    list.forEach(n => {
      if(!n.fechada) return;
      const ev = DB.eventos(n.key);
      const fech = ev.filter(e => e.cls === 'FECHAMENTO').pop();
      const ini = n.criadoEm || n.primeiraVez;
      const fim = fech ? fech.data : n.ultimaAlteracao;
      const d = Util.days(ini, fim);
      if(d != null && d >= 0) durs.push(d);
    });
    if(!durs.length) return null;
    durs.sort((a,b) => a-b);
    return {media: durs.reduce((s,x) => s+x,0)/durs.length, mediana: durs[Math.floor(durs.length/2)],
            min: durs[0], max: durs[durs.length-1], n: durs.length};
  }
  function repeticoes(list){
    const out = [];
    list.forEach(n => {
      const v = n.visitas || {};
      let maxN = 0, statusRep = null, totalRep = 0;
      for(const s in v){ if(v[s].n > 1){ totalRep += v[s].n-1; if(v[s].n > maxN){ maxN = v[s].n; statusRep = s; } } }
      if(totalRep > 0) out.push({ncr:n, status:statusRep, vezes:maxN, repeticoes:totalRep});
    });
    return out.sort((a,b) => b.repeticoes-a.repeticoes || b.vezes-a.vezes);
  }
  return {derive, resumo, contar, serieMensal, temposPorStatus, tempoAteFechamento, repeticoes, faixa, buscaCampo};
})();

/* ============================ Dimensões ============================
   Recortes de alto nível do parque (SBR, SBY, sistemas/bigramas). A faceta
   genérica já filtra qualquer coluna, mas tropeça em três coisas que estes
   recortes exigem:
   - o cabeçalho muda de export para export, então a coluna é achada por
     alias e pode ser apontada à mão em Configurações;
   - uma célula pode trazer vários valores ("ES, FP, ER, DP"), e cada um
     precisa virar um filtro próprio, senão a combinação inteira vira um
     valor só e some da lista;
   - "SBR 2", "sbr-02" e "2" são o mesmo item e têm que cair no mesmo balde,
     sem que os valores originais deixem de aparecer em Configurações.     */
const Dim = (() => {
  let cache = null;
  const SEP = /\s*[;,]+\s*/;

  function defs(){
    const d = DB.cfg().dimensoes;
    return Array.isArray(d) && d.length ? d : Cfg.PADRAO.dimensoes;
  }
  /* coluna escolhida a mao vence o alias; alias vence a ausencia */
  function acharColuna(d, cols){
    const manual = (DB.cfg().dimensoesCol || {})[d.id];
    if(manual && cols.indexOf(manual) >= 0) return manual;
    const al = (d.alias || []).map(Util.norm);
    for(const c of cols) if(al.indexOf(Util.norm(c)) >= 0) return c;
    return null;
  }
  function grupoSbr(v){
    const n = Util.norm(v);
    if(!n) return null;
    if(/\b(all|todos|todas|geral|comum|common)\b/.test(n)) return 'SBRall';
    let c = /\b53\s*-?\s*([a-z])\b/.exec(n) || /\b53([a-z])\b/.exec(n);
    if(c) return '53' + c[1].toUpperCase();
    let m = /\bsbr\s*-?\s*0*(\d{1,2})\b/.exec(n);
    if(!m) m = /^0*(\d{1,2})$/.exec(n);
    return m ? 'SBR' + (+m[1]) : null;
  }
  const NORM = {sbr: grupoSbr};
  /* valores de uma celula, ja separados e agrupados */
  function tokens(valor, d){
    const bruto = Util.strVal(valor).trim();
    if(!bruto) return [];
    const partes = d.multi ? bruto.split(SEP) : [bruto];
    const fn = NORM[d.normalizar] || null;
    const out = [];
    for(let i = 0; i < partes.length; i++){
      const t = partes[i].trim();
      if(!t) continue;
      const v = (fn && fn(t)) || t;
      if(out.indexOf(v) < 0) out.push(v);
    }
    return out;
  }
  function build(){
    if(cache) return cache;
    const list = DB.listaNcrs();
    const cols = DB.campos();
    cache = defs().map(d => {
      const col = acharColuna(d, cols);
      const cont = new Map(), brutos = new Map();
      let preenchidas = 0;
      if(col) for(const n of list){
        const cru = Util.strVal(n.campos[col]).trim();
        if(cru) brutos.set(cru, (brutos.get(cru) || 0) + 1);
        const ts = tokens(n.campos[col], d);
        if(ts.length) preenchidas++;
        ts.forEach(t => cont.set(t, (cont.get(t) || 0) + 1));
      }
      const fixos = d.fixos || [];
      const encontrados = Array.from(cont.entries())
        .filter(([v]) => fixos.indexOf(v) < 0)
        .map(([v,n]) => ({v, n, fixo:false}))
        .sort((a,b) => b.n - a.n || Util.cmp(a.v, b.v));
      /* 53A..53D ficam sempre na lista, mesmo zerados: o recorte existe
         ainda que este export nao traga nenhuma NCR deles, e esconder a
         opcao faria parecer que o filtro esta quebrado */
      const valores = fixos.map(f => ({v:f, n:cont.get(f) || 0, fixo:true})).concat(encontrados);
      return {id:d.id, rot:d.rot, ajuda:d.ajuda || '', multi:!!d.multi, normalizar:d.normalizar || null,
              alias:(d.alias || []).slice(), fixos, col, valores, preenchidas,
              distintos: cont.size, usados: valores.filter(x => x.n > 0).length,
              brutos: Array.from(brutos.entries()).map(([v,n]) => ({v,n})).sort((a,b) => b.n - a.n || Util.cmp(a.v,b.v))};
    });
    return cache;
  }
  function invalidate(){ cache = null; }
  const lista = () => build();
  const get = id => build().filter(d => d.id === id)[0] || null;
  /* dimensoes que valem uma caixa de filtro: coluna achada e algo dentro */
  const disponiveis = () => build().filter(d => d.col && (d.usados > 0 || d.fixos.length));
  const colunasUsadas = () => build().filter(d => d.col).map(d => d.col);
  function tokensDe(rec, d){
    if(!d || !d.col) return [];
    return tokens((rec.campos || {})[d.col], d);
  }
  return {lista, get, disponiveis, colunasUsadas, tokensDe, tokens, invalidate, grupoSbr};
})();

/* ============================ FilterManager ============================ */
const Filters = (() => {
  const state = {texto:'', campos:{}, dims:{}, situacao:'todas', etapas:[], aging:[], dataDe:'', dataAte:'',
                 produto:'', semMovDias:null, comRetorno:false, statusRapido:null};
  let cache = null, facetsCache = null;

  function invalidate(){ cache = null; }
  function reset(){
    state.texto = ''; state.campos = {}; state.dims = {}; state.situacao = 'todas'; state.etapas = []; state.aging = [];
    state.dataDe = ''; state.dataAte = ''; state.produto = ''; state.semMovDias = null;
    state.comRetorno = false; state.statusRapido = null;
    invalidate();
  }
  function ativos(){
    const out = [];
    if(state.texto) out.push({tipo:'texto', label:'Texto: "'+state.texto+'"'});
    for(const id in state.dims){
      const v = state.dims[id];
      if(!v || !v.length) continue;
      const d = Dim.get(id);
      out.push({tipo:'dim', dim:id, label:((d && d.rot) || id)+': '+(v.length > 3 ? v.length+' selecionados' : v.join(', '))});
    }
    for(const c in state.campos){
      const v = state.campos[c];
      if(v && v.length) out.push({tipo:'campo', campo:c, label:c+': '+(v.length > 2 ? v.length+' selecionados' : v.join(', '))});
    }
    if(state.situacao !== 'todas') out.push({tipo:'situacao', label:'Situação: '+Util.titleCase(state.situacao)});
    if(state.etapas.length) out.push({tipo:'etapas', label:'Etapa: '+state.etapas.join(', ')});
    if(state.aging.length) out.push({tipo:'aging', label:'Aging: '+state.aging.join(', ')});
    if(state.dataDe) out.push({tipo:'dataDe', label:'Criada a partir de '+Util.fDate(state.dataDe)});
    if(state.dataAte) out.push({tipo:'dataAte', label:'Criada até '+Util.fDate(state.dataAte)});
    if(state.produto) out.push({tipo:'produto', label:'Produto: '+state.produto});
    if(state.semMovDias) out.push({tipo:'semMovDias', label:'Sem movimento ≥ '+state.semMovDias+' dias'});
    if(state.comRetorno) out.push({tipo:'comRetorno', label:'Somente com retorno'});
    return out;
  }
  function limparUm(f){
    if(f.tipo === 'dim') delete state.dims[f.dim];
    else if(f.tipo === 'campo') delete state.campos[f.campo];
    else if(f.tipo === 'texto') state.texto = '';
    else if(f.tipo === 'situacao') state.situacao = 'todas';
    else if(f.tipo === 'etapas') state.etapas = [];
    else if(f.tipo === 'aging') state.aging = [];
    else if(f.tipo === 'dataDe') state.dataDe = '';
    else if(f.tipo === 'dataAte') state.dataAte = '';
    else if(f.tipo === 'produto') state.produto = '';
    else if(f.tipo === 'semMovDias') state.semMovDias = null;
    else if(f.tipo === 'comRetorno') state.comRetorno = false;
    invalidate();
  }
  /* facetas dinamicas: qualquer coluna com poucos valores distintos vira filtro */
  function facets(){
    if(facetsCache) return facetsCache;
    const list = DB.listaNcrs();
    /* colunas promovidas a dimensao saem da lista generica: a mesma coluna
       em duas caixas de filtro daria dois resultados diferentes (a faceta
       casa a celula inteira, a dimensao casa cada valor) */
    const usadas = new Set(Dim.colunasUsadas());
    const cols = DB.campos().filter(c => !usadas.has(c));
    const out = [];
    const prior = ['status','disciplina','tipo de produto','tipo de anomalia','nivel','critico','sbr',
                   'retrabalho','regressao','autor','especialista 2.1','especialista ta','responsavel 7.2 ta','bigramas'];
    cols.forEach(c => {
      const m = new Map();
      let fill = 0;
      for(const n of list){
        const v = n.campos[c];
        if(v === undefined || v === '') continue;
        fill++;
        const s = Util.strVal(v);
        if(s.length > 70) { m.set('__long__', 1); break; }
        m.set(s, (m.get(s)||0)+1);
      }
      if(m.has('__long__')) return;
      const dist = m.size;
      if(dist < 1 || dist > 90) return;
      if(!fill) return;
      const p = prior.indexOf(Util.norm(c));
      out.push({campo:c, distintos:dist, fill,
                valores: Array.from(m.entries()).map(([v,n]) => ({v,n})).sort((a,b) => b.n-a.n || Util.cmp(a.v,b.v)),
                prioridade: p < 0 ? 99 : p});
    });
    out.sort((a,b) => a.prioridade-b.prioridade || b.fill-a.fill || Util.cmp(a.campo,b.campo));
    facetsCache = out;
    return out;
  }
  function invalidateFacets(){ facetsCache = null; cache = null; Dim.invalidate(); }
  /* telas que nao passam pelo recorte: o aviso de filtro precisa dizer isso */
  const AFETA = {dashboard:true, ncrs:true, produtos:true, aging:true, fluxo:true, fluxos:true, historico:true};
  const afeta = view => !!AFETA[view];

  function textoMatch(n, q){
    if(n.id.toLowerCase().indexOf(q) >= 0) return true;
    const c = n.campos;
    for(const k in c){ if(Util.strVal(c[k]).toLowerCase().indexOf(q) >= 0) return true; }
    const prods = DB.produtosDe(n.key);
    for(const p of prods) if(p.produto.toLowerCase().indexOf(q) >= 0) return true;
    return false;
  }
  function aplicar(){
    if(cache) return cache;
    let list = DB.listaNcrs();
    const s = state;
    const q = s.texto ? s.texto.toLowerCase().trim() : '';
    const campos = Object.keys(s.campos).filter(k => s.campos[k] && s.campos[k].length);
    const setMap = {};
    campos.forEach(k => setMap[k] = new Set(s.campos[k]));
    const dims = [];
    Object.keys(s.dims).forEach(id => {
      const v = s.dims[id];
      if(!v || !v.length) return;
      const d = Dim.get(id);
      if(d && d.col) dims.push({d, set:new Set(v)});
    });
    const agSet = s.aging.length ? new Set(s.aging) : null;
    const etSet = s.etapas.length ? new Set(s.etapas.map(String)) : null;
    const de = s.dataDe ? new Date(s.dataDe+'T00:00:00').getTime() : null;
    const ate = s.dataAte ? new Date(s.dataAte+'T23:59:59').getTime() : null;
    const prodQ = s.produto ? s.produto.toLowerCase() : '';

    list = list.filter(n => {
      if(s.situacao === 'abertas' && n.fechada) return false;
      if(s.situacao === 'fechadas' && !n.fechada) return false;
      if(s.statusRapido && Util.strVal(n.status) !== s.statusRapido) return false;
      for(const k of campos){ if(!setMap[k].has(Util.strVal(n.campos[k]) || '(vazio)')) return false; }
      /* multivalorada: basta um dos valores da celula estar selecionado */
      for(const x of dims){ if(!Dim.tokensDe(n, x.d).some(t => x.set.has(t))) return false; }
      if(etSet && !etSet.has(String(n.ordem == null ? 'null' : n.ordem))) return false;
      if(agSet){ const m = Metrics.derive(n); if(!agSet.has(m.faixa)) return false; }
      if(de != null || ate != null){
        const t = n.criadoEm ? new Date(n.criadoEm).getTime() : (n.primeiraVez ? new Date(n.primeiraVez).getTime() : null);
        if(t == null) return false;
        if(de != null && t < de) return false;
        if(ate != null && t > ate) return false;
      }
      if(s.semMovDias){ const dm = Util.days(n.ultimaAlteracao || n.primeiraVez); if(dm == null || dm < s.semMovDias) return false; }
      if(s.comRetorno && !((n.mov && n.mov.retornos) > 0)) return false;
      if(prodQ){
        const ps = DB.produtosDe(n.key);
        if(!ps.some(p => p.produto.toLowerCase().indexOf(prodQ) >= 0)) return false;
      }
      if(q && !textoMatch(n, q)) return false;
      return true;
    });
    cache = list;
    return list;
  }
  return {state, aplicar, reset, invalidate, invalidateFacets, facets, ativos, limparUm, afeta};
})();

  async function importarManual(){
    const files = await inputArquivos();
    if(!files.length) return;
    if(Store.st.mode === 'none'){ Store.useLocal(); await DB.load(); }
    await executarImportacao(files.map(f => ({name:f.name, size:f.size, lastModified:f.lastModified, file:f, path:f.name})));
  }
  async function atualizarBanco(){
    const inf = Store.info();
    if(inf.mode === 'none'){ telaInicial(); return; }
    if(inf.pending){
      const ok = await Store.grantPending();
      if(!ok){ Util.toast('Autorização da pasta não concedida.','warn'); telaInicial(); return; }
      await recarregar();
    }
    if(Store.st.mode === 'idb'){ await importarManual(); return; }
    busy.show('Procurando arquivos Excel...', 'Varrendo a pasta de trabalho');
    let arquivos = [];
    try{ arquivos = await Store.listExcel(); }
    catch(e){ busy.hide(); Util.toast('Falha ao ler a pasta: '+e.message,'err'); return; }
    busy.hide();
    if(!arquivos.length){
      const ok = await confirmar('Nenhum Excel encontrado',
        'Não há arquivos <code>.xlsx</code> na pasta <b>'+esc(Store.info().folder)+'</b> (nem em <code>imports/</code>).<br><br>Você pode copiar os arquivos para lá e tentar de novo, ou selecioná-los manualmente agora.',
        'Selecionar manualmente');
      if(ok) await importarManual();
      return;
    }
    await executarImportacao(arquivos);
  }
  async function executarImportacao(arquivos){
    const conhecidos = DB.all().arquivos;
    busy.show('Atualizando banco de dados...', arquivos.length+' arquivo(s) localizado(s)');
    const acc = {'Analisadas':0,'Novas':0,'Atualizadas':0,'Sem alteração':0};
    busy.stats(acc);
    const t0 = performance.now();
    let res;
    try{
      res = await Importer.processar(arquivos, {
        arquivo(i, tot, nome){ busy.msg('Arquivo '+i+' de '+tot+': '+nome); busy.pct((i-1)/tot*100); busy.log('▶ '+nome); },
        progresso(p){ if(p && p.pct != null) busy.pct(Math.min(99, p.pct)); },
        linhas(n, tot, st){ acc['Analisadas'] = st.analisadas; acc['Novas'] = st.novas; acc['Atualizadas'] = st.atualizadas; acc['Sem alteração'] = st.semAlteracao; busy.stats(acc); },
        resultado(st){
          acc['Analisadas'] += 0;
          busy.log(st.ignorado ? '  ↳ ignorado (já processado)' :
            st.falhou ? '  ↳ ERRO: '+(st.erros[0]||'') :
            '  ↳ '+st.analisadas+' analisadas · '+st.novas+' novas · '+st.atualizadas+' atualizadas · '+st.mudancasStatus+' mudanças de status');
        },
        salvando(){ busy.msg('Gravando banco de dados e backup...'); busy.pct(99); }
      });
    }catch(e){
      busy.hide();
      Util.toast(e.message,'err','Falha na importação');
      return;
    }
    busy.pct(100);
    await Util.sleep(150);
    busy.hide();
    Filters.invalidateFacets();
    atualizarBadges();
    render(atual);
    mostrarResultado(res.resultados, performance.now()-t0, res.cancelado);
  }
  function mostrarResultado(lista, ms, cancelado){
    if(!lista.length){ Util.toast('Nenhum arquivo processado.','warn'); return; }
    const t = lista.reduce((a,s) => {
      if(s.ignorado){ a.ignorados++; return a; }
      if(s.falhou){ a.falhas++; return a; }
      a.arquivos++; a.analisadas += s.analisadas; a.novas += s.novas; a.atualizadas += s.atualizadas;
      a.semAlteracao += s.semAlteracao; a.status += s.mudancasStatus; a.retornos += s.cls.RETORNO;
      a.produtos += s.produtosNovos + s.produtosAtualizados; a.erros += s.erros.length; a.eventos += s.eventosGerados;
      a.marcos += s.marcosLidos || 0; a.reconstruidas += s.ncrsReconstruidas || 0;
      a.movRecon += s.movimentosReconstruidos || 0;

        <td class="small">${Util.fDateTime(s.dataArquivo)}</td>

        <td class="num">${s.ignorado?'—':Util.fNum(s.novas)}</td>

          ${tile('Sem alteração', Util.fNum(t.semAlteracao), 'var(--muted)')}
          ${tile('Mudanças de status', Util.fNum(t.status), 'var(--s7)')}
          ${tile('Retornos detectados', Util.fNum(t.retornos), 'var(--critical)')}
          ${tile('Produtos atualizados', Util.fNum(t.produtos), 'var(--s2)')}

        </div>

          + ' NCR(s), gerando ' + Util.fNum(t.movRecon) + ' movimento(s) com a data e o responsável registrados na planilha. '
          + 'Esses movimentos são anteriores a esta importação e por isso não entram em “Mudanças de status”, '
          + 'que conta apenas o que mudou <i>entre</i> duas fotos.</div>' : ''}
        <div class="tbl-wrap"><table class="tbl"><thead><tr>
          <th>Arquivo</th><th>Data do arquivo</th><th class="num">Analisadas</th><th class="num">Novas</th>
          <th class="num">Atualizadas</th><th class="num">S/ alteração</th><th class="num">Status</th><th class="num">Retornos</th>

  /* ---------- componentes reutilizaveis ---------- */
  function multiselect(host, o){
    /* o = {label, valores:[{v,n}], selecionados:[], onChange} */
    const id = 'ms'+Util.uid();
    const sel = new Set(o.selecionados||[]);
    host.innerHTML = `<label class="fld">${esc(o.label)}</label>
      <div class="ms" id="${id}">
        <button type="button" class="ms-btn"><span class="txt">${sel.size?sel.size+' selecionado(s)':'Todos'}</span>${sel.size?'<span class="cnt">'+sel.size+'</span>':''}<span style="opacity:.5">▾</span></button>
        <div class="ms-pop">
          ${o.valores.length > 8 ? '<div class="ms-search"><input type="text" placeholder="Filtrar..."></div>' : ''}
          <div class="ms-list">${o.valores.map(x => `<label class="ms-opt"${x.n?'':' style="opacity:.5" title="nenhuma NCR com este valor nos arquivos já importados"'}><input type="checkbox" value="${esc(x.v)}" ${sel.has(x.v)?'checked':''}><span>${esc(x.lbl==null?x.v:x.lbl)}</span><span class="n">${Util.fNum(x.n)}</span></label>`).join('')}</div>
          <div class="ms-acts"><button class="btn sm ghost" data-act="all">Todos</button><button class="btn sm ghost" data-act="none">Nenhum</button></div>
        </div></div>`;
    const root = $('#'+id, host);
    const btn = $('.ms-btn', root);
    btn.onclick = e => { e.stopPropagation(); $$('.ms.open').forEach(m => { if(m !== root) m.classList.remove('open'); }); root.classList.toggle('open'); };
    const s = $('.ms-search input', root);
    if(s) s.oninput = () => { const q = s.value.toLowerCase(); $$('.ms-opt', root).forEach(l => l.style.display = l.textContent.toLowerCase().indexOf(q) >= 0 ? '' : 'none'); };
    const fire = () => {
      const vals = $$('.ms-opt input:checked', root).map(i => i.value);
      $('.txt', btn).textContent = vals.length ? vals.length+' selecionado(s)' : 'Todos';
      const c = $('.cnt', btn);
      if(vals.length){ if(c) c.textContent = vals.length; else btn.insertBefore(Object.assign(document.createElement('span'),{className:'cnt',textContent:vals.length}), btn.lastChild); }
      else if(c) c.remove();
      o.onChange(vals);
    };
    $$('.ms-opt input', root).forEach(i => i.onchange = fire);
    $$('[data-act]', root).forEach(b => b.onclick = ev => {
      ev.stopPropagation();
      $$('.ms-opt', root).forEach(l => { if(l.style.display !== 'none') $('input',l).checked = b.dataset.act === 'all'; });
      fire();
    });
    return root;
  }
  document.addEventListener('click', () => $$('.ms.open').forEach(m => m.classList.remove('open')));

    const fD = document.createElement('div'); fD.className = 'f';

    ins[1].onchange = e => { st.dataAte = e.target.value; aplicar(); };
    cont.appendChild(fD);
    /* produto */
    const fP = document.createElement('div'); fP.className = 'f';
    fP.innerHTML = '<label class="fld">Produto contém</label><input type="text" value="'+esc(st.produto)+'" placeholder="ex.: P41207">';
    $('input',fP).oninput = Util.debounce(e => { st.produto = e.target.value.trim(); aplicar(); }, 320);
    cont.appendChild(fP);
    /* extras */
    const fX = document.createElement('div'); fX.className = 'f';
    fX.innerHTML = `<label class="fld">Marcadores</label><div class="hstack">
      <label class="ms-opt" style="padding:6px 8px;border:1px solid var(--border);border-radius:7px"><input type="checkbox" ${st.comRetorno?'checked':''}><span>Com retorno</span></label>
      <label class="ms-opt" style="padding:6px 8px;border:1px solid var(--border);border-radius:7px"><input type="checkbox" ${st.semMovDias?'checked':''}><span>Paradas ≥ ${DB.cfg().semMovimentacaoDias}d</span></label></div>`;
    const cbs = $$('input', fX);
    cbs[0].onchange = e => { st.comRetorno = e.target.checked; aplicar(); };
    cbs[1].onchange = e => { st.semMovDias = e.target.checked ? (DB.cfg().semMovimentacaoDias||30) : null; aplicar(); };
    cont.appendChild(fX);
    wrap.appendChild(cont);
    const acts = document.createElement('div');
    acts.className = 'hstack';
    acts.innerHTML = '<button class="btn sm" id="fClear">Limpar filtros</button>';
    wrap.appendChild(acts);
    host.appendChild(wrap);
    $('#fClear', wrap).onclick = () => { Filters.reset(); const gs = $('#globalSearch'); if(gs) gs.value = ''; refresh(); };
    /* chips ativos */
    const chips = document.createElement('div');
    chips.className = 'active-filters';
    const at = Filters.ativos();
    if(at.length){
      chips.innerHTML = at.map((f,i) => '<span class="chip" data-i="'+i+'">'+esc(f.label)+'<span class="x">&times;</span></span>').join('')
        + '<span class="chip" style="border-style:dashed"><b>'+Util.fNum(Filters.aplicar().length)+'</b> de '+Util.fNum(DB.contagem().ncrs)+' NCRs</span>';
      host.appendChild(chips);
      $$('.chip .x', chips).forEach((x,i) => x.onclick = () => { Filters.limparUm(at[i]); refresh(); });
    }
    function aplicar(){ Filters.invalidate(); refresh(); }
  }
  return {VIEWS, ICON, svgIcon, montarNav, ir, render, refresh, atualizarBadges, atualizarCue, abrirCuePop, fecharCuePop, tema, toggleTema,

/* rotulo de SVG em caixa fixa: comprime o texto ate caber em vez de corta-lo;
   so corta (com o nome inteiro no <title>) o que nem comprimido caberia */
function rotuloSVG(txt, largura, fonte){
  const t = String(txt == null ? '' : txt);
  const cabe = Math.floor(largura / (fonte * 0.56) * 1.45);
  const label = t.length > cabe ? t.slice(0, cabe - 1) + '…' : t;
  const aperta = label.length * fonte * 0.56 > largura
    ? ` textLength="${Math.round(largura)}" lengthAdjust="spacingAndGlyphs"` : '';
  return {label, aperta};
}
