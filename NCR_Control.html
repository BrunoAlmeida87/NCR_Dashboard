    if(t) t.onclick = () => { Filters.state.situacao = 'abertas'; Filters.state.semMovDias = 61; Filters.invalidate(); UI.ir('ncrs'); };
  }
  return {render};
})();

/* ============================ Análise de Fluxo ============================ */
const FluxoView = (() => {
  function render(host){
    if(!DB.contagem().ncrs){ host.innerHTML = semDados('Importe ao menos dois arquivos Excel para analisar a evolução do fluxo.'); return; }
    host.innerHTML = '';
    UI.barraFiltros(host, {maxFacetas:4});
    const list = Filters.aplicar();
    const keys = new Set(list.map(n => n.key));
    const evs = DB.all().historico.filter(e => keys.has(e.ncr));
    const stEv = evs.filter(e => Flow.isFluxoEvt(e) && e.cls !== 'INICIAL');
    const r = Metrics.resumo(list);
    const tempos = Metrics.temposPorStatus(list);
    const fech = Metrics.tempoAteFechamento(list);
    const reps = Metrics.repeticoes(list);
    /* matriz de transicoes */
    const trans = new Map();
    stEv.forEach(e => {
      const k = (e.de||'—')+' ⟶ '+(e.para||'—');
      if(!trans.has(k)) trans.set(k, {de:e.de, para:e.para, cls:e.cls, n:0});
      trans.get(k).n++;
    });
    const topTrans = Array.from(trans.values()).sort((a,b) => b.n-a.n).slice(0,20);
    /* eventos por mes e classificacao */
    const MES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
    const meses = [], mkeys = [], hoje = new Date();
    for(let i = 11; i >= 0; i--){
      const d = new Date(hoje.getFullYear(), hoje.getMonth()-i, 1);
      mkeys.push(d.getFullYear()+'-'+(d.getMonth()+1 < 10 ? '0' : '')+(d.getMonth()+1));
      meses.push(MES[d.getMonth()]+'/'+String(d.getFullYear()).slice(2));
    }
    const classes = ['AVANCO','RETORNO','LATERAL','FECHAMENTO','REABERTURA'];
    const corCls = {AVANCO:'var(--s3)', RETORNO:'var(--s8)', LATERAL:'var(--s4)', FECHAMENTO:'var(--s7)', REABERTURA:'var(--s2)'};
    const series = classes.map(c => ({name:Flow.LABEL[c], color:corCls[c], values:mkeys.map(() => 0)}));
    stEv.forEach(e => {
      const i = classes.indexOf(e.cls);
      if(i < 0) return;
      const d = new Date(e.data);
      if(isNaN(d.getTime())) return;
      const k = d.getFullYear()+'-'+(d.getMonth()+1 < 10 ? '0' : '')+(d.getMonth()+1);
      const j = mkeys.indexOf(k);
      if(j >= 0) series[i].values[j]++;
    });
    /* gargalos: status com maior tempo medio em aberto */
    const gargalos = tempos.filter(t => t.emAberto > 0).sort((a,b) => (b.mediaAbertoDias||0)-(a.mediaAbertoDias||0)).slice(0,12);
    const box = document.createElement('div');
    box.innerHTML = `
      <div class="grid g6" style="margin-bottom:14px">
        ${tileHtml('Movimentações', Util.fNum(stEv.length), 'mudanças de status registradas', 'var(--s1)')}
        ${tileHtml('Avanços', Util.fNum(r.avancos), Util.pct(r.avancos, stEv.length)+'% do total', 'var(--s3)')}
        ${tileHtml('Retornos', Util.fNum(r.retornos), Util.pct(r.retornos, stEv.length)+'% do total', 'var(--s8)')}
        ${tileHtml('Laterais', Util.fNum(r.laterais), 'mesma etapa', 'var(--s4)')}
        ${tileHtml('Reaberturas', Util.fNum(r.reaberturas), 'após fechamento', 'var(--s2)')}
        ${tileHtml('Tempo até fechamento', fech?Util.fDec(fech.media,0)+' d':'—', fech?('mediana '+fech.mediana+' d · '+fech.n+' NCRs'):'sem fechamentos', 'var(--s7)')}
      </div>
      <div class="grid g2" style="margin-bottom:14px">
        ${card('Movimentações por mês e tipo','últimos 12 meses','<div class="chart-host" id="chF1"></div>')}
        ${card('Tempo médio por etapa concluída','dias entre entrada e saída do status','<div class="chart-host" id="chF2"></div>')}
      </div>
      <div class="grid g2" style="margin-bottom:14px">
        ${card('Gargalos — tempo médio das NCRs paradas em cada status','dias no status, NCRs em aberto','<div class="chart-host" id="chF3"></div>')}
        ${card('Transições mais frequentes','top 20','<div class="tbl-wrap" style="max-height:330px"><table class="tbl"><thead><tr><th>Transição</th><th>Tipo</th><th class="num">Ocorrências</th></tr></thead><tbody>'
          + (topTrans.length ? topTrans.map(t => `<tr><td><span class="small">${esc(t.de||'—')}</span> <span class="arrowto">→</span> <b>${esc(t.para||'—')}</b></td>
              <td><span class="mv mv-${esc(t.cls)}">${Flow.ICON[t.cls]||''} ${esc(Flow.LABEL[t.cls]||t.cls)}</span></td><td class="num">${t.n}</td></tr>`).join('')
             : '<tr><td colspan="3">'+semDados('Nenhuma transição registrada ainda')+'</td></tr>')
          + '</tbody></table></div>')}
      </div>
      <div class="grid g2">
        ${card('NCRs que mais retornaram','top 20','<div class="tbl-wrap" style="max-height:360px"><table class="tbl"><thead><tr><th>NCR</th><th>Status atual</th><th class="num">Retornos</th><th class="num">Movimentos</th></tr></thead><tbody>'
          + (() => { const l = list.filter(n => (n.mov&&n.mov.retornos) > 0).sort((a,b) => b.mov.retornos-a.mov.retornos).slice(0,20);
              return l.length ? l.map(n => `<tr><td>${ncrLink(n.id,n.key)}</td><td>${badgeStatus(n)}</td>
                <td class="num"><span class="mv mv-RETORNO">↩ ${n.mov.retornos}</span></td><td class="num">${n.mov.total}</td></tr>`).join('')
                : '<tr><td colspan="4">'+semDados('Nenhum retorno detectado')+'</td></tr>'; })()
          + '</tbody></table></div>')}
        ${card('NCRs que passaram várias vezes pelo mesmo status','top 20','<div class="tbl-wrap" style="max-height:360px"><table class="tbl"><thead><tr><th>NCR</th><th>Status repetido</th><th class="num">Passagens</th><th class="num">Repetições</th></tr></thead><tbody>'
          + (reps.length ? reps.slice(0,20).map(x => `<tr><td>${ncrLink(x.ncr.id,x.ncr.key)}</td><td>${esc(x.status||'—')}</td>
              <td class="num">${x.vezes}×</td><td class="num">${x.repeticoes}</td></tr>`).join('')
             : '<tr><td colspan="4">'+semDados('Nenhuma repetição detectada')+'</td></tr>')
          + '</tbody></table></div>')}
      </div>`;
    host.appendChild(box);
    Charts.stacked($('#chF1'), {categories:meses, series, height:250, emptyMsg:'Sem movimentações no período'});
    Charts.hbar($('#chF2'), {data: tempos.filter(t => t.mediaDias != null).slice(0,14)
        .map(t => ({label:t.status, value:Math.round(t.mediaDias), key:t.status})), suffix:' d', unit:'dias em média',
      colorFn: d => { const o = Flow.ordemDe(d.label); return o == null ? 'var(--muted)' : Charts.SERIES[(o-1)%8]; },
      emptyMsg:'Ainda não há etapas concluídas (necessário ao menos 2 importações com mudança de status)'});
    Charts.hbar($('#chF3'), {data: gargalos.map(t => ({label:t.status+' ('+t.emAberto+')', value:Math.round(t.mediaAbertoDias), key:t.status})),
      suffix:' d', colorFn: d => d.value >= 60 ? 'var(--critical)' : d.value >= 30 ? 'var(--warning)' : 'var(--s3)',
      onClick: k => { Filters.state.statusRapido = String(k).replace(/\s\(\d+\)$/,''); Filters.invalidate(); UI.ir('ncrs'); }});
    ligarLinks(box);
  }
  return {render};
})();

/* ============================ Fluxos das NCRs ============================
   Duas leituras da mesma trajetória: a galeria, para varrer muitas NCRs de
   relance e achar o padrão estranho, e a reprodução, que roda o relógio e
   mostra as NCRs andando pelas etapas no tempo real do export.            */
const Trilhas = (() => {
  const st = {modo:'galeria', ordem:'mov', grupo:'nenhum', limite:60,
              t:null, tocando:false, vel:30, raf:null,
              qtdRepro:0,            /* 0 = todas as NCRs do recorte */
              colRepro:'etapa'};     /* colunas da reproducao: 'etapa' do fluxo ou cada 'status' */
  /* um circulo por NCR custa DOM: acima disso a tela avisa que pode pesar */
  const PESADO_REPRO = 3000;

  /* ---------- modelo de colunas (uma por etapa do fluxo) ---------- */
  function modelo(){
    const byOrd = Flow.statusPorOrdem();
    const ordens = Array.from(byOrd.keys()).sort((a,b) => a-b);
    const cols = ordens.map(o => ({ordem:o, titulo:Flow.etapa(o)}));
    cols.push({ordem:null, titulo:'Fora do fluxo'});
    const idx = new Map();
    cols.forEach((c,i) => { if(c.ordem != null) idx.set(c.ordem, i); });
    const m = {cols, idx, fora: cols.length - 1, tipo:'etapa'};
    m.colDe = status => colDe(status, m);
    return m;
  }
  /* uma coluna por status (etapa da NCR), so os que aparecem nas trajetorias
     do recorte, na ordem do fluxo configurado; status fora da lista entram
     pela ordem inferida do codigo ("7.2 - TA") */
  function modeloStatus(list){
    const cfgPos = new Map();
    (DB.cfg().fluxo || []).forEach((f, i) => { const k = Util.norm(f.status); if(!cfgPos.has(k)) cfgPos.set(k, i); });
    const usados = new Map();
    list.forEach(rec => Detalhe.sequencia(rec).forEach(e => {
      if(!e.status) return;
      const k = Util.norm(e.status);
      if(!usados.has(k)) usados.set(k, {st:e.status, o:Flow.ordemInferida(e.status), pos: cfgPos.has(k) ? cfgPos.get(k) : 9999});
    }));
    const lista = Array.from(usados.entries()).sort((a, b) =>
      ((a[1].o == null ? 999 : a[1].o) - (b[1].o == null ? 999 : b[1].o)) || (a[1].pos - b[1].pos) || Util.cmp(a[1].st, b[1].st));
    const pos = new Map();
    const cols = lista.map(([k, v], i) => { pos.set(k, i); return {ordem:v.o, titulo:v.st}; });
    if(!cols.length) cols.push({ordem:null, titulo:'—'});
    return {cols, idx:new Map(), fora:0, tipo:'status', colDe: status => { const i = pos.get(Util.norm(status || '')); return i == null ? 0 : i; }};
  }
  function colDe(status, m){
    const o = Flow.ordemInferida(status);
    return (o != null && m.idx.has(o)) ? m.idx.get(o) : m.fora;
  }
  /* pontos da trajetoria, em ordem de tempo */
  function pontos(rec, m){
    const pts = [];
    Detalhe.sequencia(rec).forEach(e => {
      if(!e.data || !e.status) return;
      const t = new Date(e.data).getTime();
      if(isNaN(t)) return;
      pts.push({t, data:e.data, st:e.status, cls:e.cls || 'INDEFINIDA', c:m.colDe(e.status), estimado:!!e.estimado});
    });
    pts.sort((a,b) => a.t - b.t);
    return pts;
  }
  function montar(list, m){
    return list.map(rec => ({rec, pts: pontos(rec, m), i:0}))
               .filter(x => x.pts.length);
  }
  const CORES = {AVANCO:'var(--good)', RETORNO:'var(--critical)', LATERAL:'var(--warning)',
                 FECHAMENTO:'var(--s7)', REABERTURA:'var(--serious)', INDEFINIDA:'var(--muted)',
                 INICIAL:'var(--s1)', PERMANENCIA:'var(--muted)'};

  /* ---------- galeria: uma trajetoria por cartao ---------- */
  /* nos cartoes so vai o numero da etapa: o nome inteiro, repetido em dezenas
     de miniaturas, vira ruido — a legenda acima da grade diz o que e cada linha */
  const marcaEtapa = c => c.ordem == null ? '—' : String(c.ordem);
  function legendaEtapas(m){
    return '<div class="trk-legend"><span>Linhas, de cima para baixo:</span>'
      + m.cols.map(c => '<span><b>' + esc(marcaEtapa(c)) + '</b> '
          + esc(String(c.titulo).replace(/^\s*\d+\s*·\s*/, '')) + '</span>').join('')
      + '<span style="margin-left:auto">eixo horizontal: passos da trajetória, na ordem</span></div>';
  }
  function miniSVG(t, m){
    const rows = m.cols.length;
    const PADL = 24, PADR = 12, TOP = 10, RH = 15;
    const W = 400, H = TOP + rows*RH + 8;
    let g = '';
    m.cols.forEach((c,i) => {
      const y = TOP + i*RH + RH/2;
      g += `<text x="${PADL-8}" y="${y+3.5}" text-anchor="end" style="fill:var(--muted);font-size:9px">${esc(marcaEtapa(c))}`
         + `<title>${esc(c.titulo)}</title></text>`;
      g += `<path d="M${PADL},${y} H${W-PADR}" style="stroke:var(--grid)" stroke-width="1" stroke-dasharray="2 4"/>`;
    });
    const n = t.pts.length;
    const span = W - PADR - PADL;
    const xs = i => n === 1 ? PADL + span/2 : PADL + (span * i) / (n - 1);
    const ys = c => TOP + c*RH + RH/2;
    for(let i = 1; i < n; i++){
      const a = t.pts[i-1], b = t.pts[i];
      const cor = CORES[b.cls] || 'var(--muted)';
      const x1 = xs(i-1), y1 = ys(a.c), x2 = xs(i), y2 = ys(b.c);
      const mx = (x1 + x2) / 2;
      g += `<path d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}" fill="none"`
         + ` style="stroke:${cor};opacity:.9" stroke-width="1.8"${b.estimado ? ' stroke-dasharray="4 3"' : ''}/>`;
    }
    t.pts.forEach((pt,i) => {
      const x = xs(i), y = ys(pt.c), ult = i === n-1;
      const cor = CORES[pt.cls] || 'var(--muted)';
      g += `<circle cx="${x}" cy="${y}" r="${ult ? 4.6 : 3.1}" style="fill:${ult ? cor : 'var(--surface)'};stroke:${cor}" stroke-width="1.8">`
         + `<title>${i+1}. ${Util.fDate(pt.data)} — ${esc(pt.st)} (${esc(Flow.LABEL[pt.cls] || pt.cls)})`
         + `${pt.estimado ? '\n data estimada: o export registra apenas a saída desta etapa' : ''}</title></circle>`;
    });
    return `<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMinYMin meet"
      style="max-width:${W}px;height:auto;display:block">${g}</svg>`;
  }
  function chaves(rec, grupo){
    if(grupo === 'nenhum') return [''];
    if(grupo === 'etapa') return [Flow.etapa(rec.ordem)];
    if(grupo === 'status') return [Util.strVal(rec.status) || '(vazio)'];
    const d = Dim.get(grupo);
    if(!d) return [''];
    const ts = Dim.tokensDe(rec, d);
    return ts.length ? ts : ['(sem ' + d.rot + ')'];
  }
  const ORDENS = {
    mov:     {lbl:'Mais movimentadas',   fn:(a,b) => b.pts.length - a.pts.length || Util.cmp(a.rec.id, b.rec.id)},
    ret:     {lbl:'Mais retornos',       fn:(a,b) => ((b.rec.mov&&b.rec.mov.retornos)||0) - ((a.rec.mov&&a.rec.mov.retornos)||0) || b.pts.length - a.pts.length},
    recente: {lbl:'Movimentação mais recente', fn:(a,b) => Util.cmp(b.rec.ultimaAlteracao, a.rec.ultimaAlteracao)},
    antiga:  {lbl:'Abertas há mais tempo',     fn:(a,b) => Util.cmp(a.rec.criadoEm, b.rec.criadoEm)},
    id:      {lbl:'Número da NCR',       fn:(a,b) => Util.cmp(a.rec.id, b.rec.id)}
  };
  function galeria(host, trilhas, m){
    const ord = ORDENS[st.ordem] || ORDENS.mov;
    const ordenadas = trilhas.slice().sort(ord.fn);
    const mostrar = ordenadas.slice(0, st.limite || 60);
    /* agrupa so o que vai a tela, mas conta o grupo inteiro: senao o
       cabecalho mentiria sobre o tamanho do grupo */
    const totalPorChave = new Map();
    ordenadas.forEach(t => chaves(t.rec, st.grupo).forEach(k => totalPorChave.set(k, (totalPorChave.get(k)||0) + 1)));
    const grupos = new Map();
    mostrar.forEach(t => chaves(t.rec, st.grupo).forEach(k => {
      if(!grupos.has(k)) grupos.set(k, []);
      grupos.get(k).push(t);
    }));
    const ks = Array.from(grupos.keys()).sort((a,b) => (totalPorChave.get(b)||0) - (totalPorChave.get(a)||0) || Util.cmp(a,b));
    let html = legendaEtapas(m);
    ks.forEach(k => {
      if(st.grupo !== 'nenhum'){
        const tot = totalPorChave.get(k) || 0, vis = grupos.get(k).length;
        html += `<div class="trk-grp"><b>${esc(k)}</b><span class="badge ord">${Util.fNum(tot)} NCR${tot===1?'':'s'}</span>`
              + (vis < tot ? `<span class="muted small">mostrando ${Util.fNum(vis)}</span>` : '') + '</div>';
      }
      html += '<div class="trk-grid">' + grupos.get(k).map(t => {
        const r = t.rec, ret = (r.mov && r.mov.retornos) || 0;
        const etapas = new Set(t.pts.map(x => Util.strVal(x.st))).size;
        return `<div class="trk">
          <div class="trk-h">${ncrLink(r.id, r.key)}${badgeStatus(r)}</div>
          <div class="trk-b">${miniSVG(t, m)}</div>
          <div class="trk-f"><span>${t.pts.length} passo${t.pts.length===1?'':'s'}</span><span>${etapas} etapa${etapas===1?'':'s'}</span>
            ${ret ? '<span class="mv mv-RETORNO">↩ '+ret+'</span>' : ''}
            ${r.reconstruida ? '<span class="badge new" title="trajetória lida das colunas datadas do export">'+r.reconstruida+' marcos</span>' : ''}
            <span class="right muted">${Util.fDate(t.pts[0].data)} → ${Util.fDate(t.pts[t.pts.length-1].data)}</span></div>
        </div>`;
      }).join('') + '</div>';
    });
    if(!ks.length) html = semDados('Nenhuma NCR com trajetória registrada no recorte atual');
    else if(mostrar.length < ordenadas.length)
      html += '<div class="note small" style="margin-top:12px">Mostrando ' + Util.fNum(mostrar.length) + ' de '
            + Util.fNum(ordenadas.length) + ' NCRs, por ' + esc(ord.lbl.toLowerCase())
            + '. Use <b>Mostrar</b> para ampliar ou aperte o filtro.</div>';
    const box = document.createElement('div');
    box.innerHTML = html;
    host.appendChild(box);
    ligarLinks(box);
  }

  /* ---------- reproducao: o relogio corre e as NCRs andam ---------- */
  function reproducao(host, todas, m){
    const teto = st.qtdRepro || Infinity;
    const excedente = Math.max(0, todas.length - teto);
    const ord = ORDENS[st.ordem] || ORDENS.mov;
    const trilhas = excedente ? todas.slice().sort(ord.fn).slice(0, teto) : todas;
    const t0 = Math.min.apply(null, trilhas.map(t => t.pts[0].t));
    const t1 = Math.max.apply(null, trilhas.map(t => t.pts[t.pts.length-1].t));
    if(st.t == null || st.t < t0 || st.t > t1) st.t = t0;
    const N = trilhas.length;
    /* por status sao muitas colunas: mais estreitas, cabecalho em duas linhas
       (nome e contagem) e rolagem horizontal em vez de encolher o desenho */
    const porStatus = m.tipo === 'status';
    const COLW = porStatus ? 96 : 138, GAP = porStatus ? 6 : 10, PADT = porStatus ? 64 : 50, PADX = 8;
    const HH = porStatus ? 38 : 24;
    const R = N > 400 ? 2.6 : N > 150 ? 3.4 : 4.4;
    const DX = R*2 + 3, DY = R*2 + 3;
    const perRow = Math.max(1, Math.floor((COLW - 16) / DX));
    /* o quadro nao pode mudar de tamanho enquanto a animacao corre, entao a
       altura sai da maior lotacao que alguma etapa chega a ter no periodo —
       varrendo os eventos uma vez, em vez de reservar espaco para o caso
       improvavel de todas as NCRs caberem numa etapa so */
    const maxRows = (() => {
      const evs = [];
      trilhas.forEach(t => t.pts.forEach((pt,i) => evs.push({t:pt.t, entra:pt.c, sai: i ? t.pts[i-1].c : -1})));
      evs.sort((a,b) => a.t - b.t);
      const cur = new Array(m.cols.length).fill(0);
      let max = 1;
      evs.forEach(e => {
        if(e.sai >= 0) cur[e.sai]--;
        cur[e.entra]++;
        if(cur[e.entra] > max) max = cur[e.entra];
      });
      return Math.ceil(max / perRow);
    })();
    const W = PADX*2 + m.cols.length*COLW + (m.cols.length-1)*GAP;
    const H = PADT + Math.max(4, maxRows)*DY + 12;

    const box = document.createElement('div');
    box.innerHTML = `
      <div class="rep-ctl">
        <button class="btn sm primary" id="repPlay">${st.tocando ? '❚❚ Pausar' : '▶ Reproduzir'}</button>
        <button class="btn sm" id="repBack" title="Voltar ao início">⏮</button>
        <input type="range" id="repSlider" min="0" max="1000" value="0" style="flex:1;min-width:180px">
        <select id="repVel" class="sm" title="Quantos dias do calendário passam a cada segundo">
          ${[[1,'1 dia/s'],[3,'3 dias/s'],[7,'7 dias/s'],[30,'30 dias/s'],[90,'90 dias/s'],[365,'1 ano/s']].map(([v,l]) =>
            `<option value="${v}"${st.vel===v?' selected':''}>${l}</option>`).join('')}
        </select>
        <b id="repData" class="mono"></b>
      </div>
      <div class="rep-wrap"><svg id="repSvg" viewBox="0 0 ${W} ${H}"
        ${porStatus ? `width="${W}" height="${H}" style="display:block;max-width:none"`
                    : `width="100%" preserveAspectRatio="xMinYMin meet" style="max-width:${W}px;height:auto;display:block"`}></svg></div>
      ${excedente ? '<div class="note warn small" style="margin-top:10px">Reproduzindo ' + Util.fNum(teto)
        + ' de ' + Util.fNum(todas.length) + ' NCRs do recorte, escolhidas por <b>' + esc(ord.lbl.toLowerCase())
        + '</b>. Em <b>NCRs</b>, escolha <b>Todas</b> para ver o conjunto inteiro.</div>' : ''}
      ${!excedente && N > PESADO_REPRO ? '<div class="note warn small" style="margin-top:10px">' + Util.fNum(N)
        + ' NCRs na reprodução: a animação pode ficar lenta. Filtre o recorte se precisar.</div>' : ''}
      ${Detalhe.legendaFluxo()}
      <div class="small muted" style="margin-top:10px">Cada ponto é uma NCR, na etapa em que ela estava naquela data.
        A cor é a do movimento que a trouxe até ali.
        O anel destaca quem se mexeu nos 15 dias anteriores. NCRs ainda não abertas não aparecem.
        Trajetórias reconstruídas das colunas datadas do export entram aqui como qualquer outra.</div>`;
    host.appendChild(box);

    const svg = $('#repSvg', box);
    const ns = 'http://www.w3.org/2000/svg';
    const mk = (tag, attrs) => { const e = document.createElementNS(ns, tag); for(const k in attrs) e.setAttribute(k, attrs[k]); return e; };
    /* colunas */
    m.cols.forEach((c,i) => {
      const x = PADX + i*(COLW+GAP);
      const cab = mk('g', {});
      const ttl = mk('title', {}); ttl.textContent = c.titulo; cab.appendChild(ttl);
      cab.appendChild(mk('rect', {x, y:14, width:COLW, height:HH, rx:6, style:'fill:var(--surface-3)'}));
      const tx = mk('text', {x:x+(porStatus ? 6 : 10), y:29, style:'fill:var(--text-2);font-size:' + (porStatus ? 9.5 : 10) + 'px;font-weight:600'});
      /* o nome inteiro, comprimido se preciso; so corta o que nao caberia nem assim */
      const disp = COLW - (porStatus ? 12 : 44);
      const fs = porStatus ? 9.5 : 10;
      const cabe = Math.floor(disp / (fs * 0.56) * 1.45);
      const nome = c.titulo.length > cabe ? c.titulo.slice(0, cabe - 1) + '…' : c.titulo;
      tx.textContent = nome;
      if(nome.length * fs * 0.56 > disp){ tx.setAttribute('textLength', disp); tx.setAttribute('lengthAdjust', 'spacingAndGlyphs'); }
      cab.appendChild(tx);
      svg.appendChild(cab);
      /* a contagem fica no cabecalho, encostada nos pontos que ela conta */
      const cnt = mk('text', porStatus
        ? {x:x+COLW/2, y:44, 'text-anchor':'middle', style:'fill:var(--text);font-size:11px;font-weight:700;font-variant-numeric:tabular-nums', id:'repC'+i}
        : {x:x+COLW-10, y:29, 'text-anchor':'end', style:'fill:var(--text);font-size:11px;font-weight:700;font-variant-numeric:tabular-nums', id:'repC'+i});
      cnt.textContent = '0';
      svg.appendChild(cnt);
      svg.appendChild(mk('path', {d:`M${x},${PADT-8} H${x+COLW}`, style:'stroke:var(--grid)', 'stroke-width':1}));
    });
    /* um circulo por NCR, reaproveitado a cada quadro */
    const nodes = trilhas.map(t => {
      const c = mk('circle', {r:R, cx:-50, cy:-50, style:'fill:var(--muted)', opacity:0});
      const ti = mk('title', {});
      c.appendChild(ti);
      svg.appendChild(c);
      return {c, ti, t, lastTip:''};
    });
    const contadores = m.cols.map((c,i) => $('#repC'+i, box));
    const lblData = $('#repData', box);
    const slider = $('#repSlider', box);

    const DESTAQUE = 15*Util.DAY;
    function quadro(){
      const T = st.t;
      const ocup = new Array(m.cols.length).fill(0);
      for(let k = 0; k < nodes.length; k++){
        const nd = nodes[k], pts = nd.t.pts;
        if(T < pts[0].t){ nd.c.setAttribute('opacity', 0); nd.t.i = 0; continue; }
        let i = nd.t.i;
        if(pts[i].t > T) i = 0;
        while(i + 1 < pts.length && pts[i+1].t <= T) i++;
        nd.t.i = i;
        const pt = pts[i];
        const col = pt.c;
        const pos = ocup[col]++;
        const x = PADX + col*(COLW+GAP) + 8 + (pos % perRow)*DX + R;
        const y = PADT + Math.floor(pos / perRow)*DY + R;
        nd.c.setAttribute('cx', x);
        nd.c.setAttribute('cy', y);
        nd.c.setAttribute('opacity', 1);
        const novo = (T - pt.t) < DESTAQUE && i > 0;
        nd.c.setAttribute('style', 'fill:' + (CORES[pt.cls] || 'var(--muted)')
          + (novo ? ';stroke:var(--text);stroke-width:1.6' : ';stroke:none'));
        nd.c.setAttribute('r', novo ? R + 1.4 : R);
        const tip = nd.t.rec.id + ' — ' + pt.st;
        if(tip !== nd.lastTip){ nd.ti.textContent = tip + ' (desde ' + Util.fDate(pt.data) + ')'; nd.lastTip = tip; }
      }
      for(let i = 0; i < contadores.length; i++) contadores[i].textContent = ocup[i] || '';
      lblData.textContent = Util.fDate(new Date(T).toISOString());
      slider.value = Math.round((T - t0) / Math.max(1, t1 - t0) * 1000);
    }
    let ultimo = 0;
    function loop(ts){
      if(UI.atual !== 'fluxos' || st.modo !== 'reproducao' || !st.tocando){ st.raf = null; return; }
      if(!svg.isConnected){ st.raf = null; return; }
      const dt = ultimo ? Math.min(100, ts - ultimo) : 16;
      ultimo = ts;
      st.t += (dt/1000) * st.vel * Util.DAY;
      if(st.t >= t1){ st.t = t1; st.tocando = false; $('#repPlay', box).textContent = '▶ Reproduzir'; }
      quadro();
      st.raf = st.tocando ? requestAnimationFrame(loop) : null;
    }
    function tocar(v){
      st.tocando = v;
      $('#repPlay', box).textContent = v ? '❚❚ Pausar' : '▶ Reproduzir';
      ultimo = 0;
      if(v && !st.raf) st.raf = requestAnimationFrame(loop);
    }
    $('#repPlay', box).onclick = () => { if(!st.tocando && st.t >= t1) st.t = t0; tocar(!st.tocando); };
    $('#repBack', box).onclick = () => { st.t = t0; quadro(); };
    slider.oninput = e => { tocar(false); st.t = t0 + (t1-t0) * (+e.target.value/1000); quadro(); };
    $('#repVel', box).onchange = e => { st.vel = +e.target.value; };
    quadro();
    if(st.tocando){ st.tocando = false; tocar(true); }
  }

  /* ---------- tela ---------- */
  function render(host){
    if(st.raf){ cancelAnimationFrame(st.raf); st.raf = null; }
    host.innerHTML = '';
    if(!DB.contagem().ncrs){ host.innerHTML = semDados('Importe um Excel para ver as trajetórias'); return; }
    UI.barraFiltros(host, {maxFacetas:3});
    const list = Filters.aplicar();
    const m = st.modo === 'reproducao' && st.colRepro === 'status' ? modeloStatus(list) : modelo();
    const trilhas = montar(list, m);
    const grupos = [['nenhum','Sem agrupamento']]
      .concat(Dim.disponiveis().map(d => [d.id, d.rot]))
      .concat([['etapa','Etapa do fluxo'],['status','Status atual']]);
    const galeriaAtiva = st.modo === 'galeria';
    const bar = document.createElement('div');
    bar.className = 'hstack wrap';
    bar.style.cssText = 'margin-bottom:12px;gap:10px;align-items:flex-end';
    bar.innerHTML = `
      <div class="f"><label class="fld">Visão</label>
        <div class="hstack" style="gap:6px">
          <button class="btn sm${st.modo==='galeria'?' primary':''}" data-modo="galeria">Galeria</button>
          <button class="btn sm${st.modo==='reproducao'?' primary':''}" data-modo="reproducao">Reprodução</button>
        </div></div>
      ${galeriaAtiva ? `<div class="f"><label class="fld">Agrupar por</label><select id="trGrupo">
        ${grupos.map(([v,l]) => `<option value="${esc(v)}"${st.grupo===v?' selected':''}>${esc(l)}</option>`).join('')}
      </select></div>` : ''}
      ${!galeriaAtiva ? `<div class="f"><label class="fld">Colunas</label><select id="trCol">
        <option value="etapa"${st.colRepro==='etapa'?' selected':''}>Etapa do fluxo (agrupada)</option>
        <option value="status"${st.colRepro==='status'?' selected':''}>Etapa da NCR (cada status)</option>
      </select></div>
      <div class="f"><label class="fld">NCRs</label><select id="trQtd">
        ${[[0,'Todas'],[200,'200'],[400,'400'],[800,'800']].map(([v,l]) =>
          `<option value="${v}"${st.qtdRepro===v?' selected':''}>${l}</option>`).join('')}
      </select></div>` : ''}
      ${galeriaAtiva || st.qtdRepro ? `<div class="f"><label class="fld">${galeriaAtiva ? 'Ordenar por' : 'Prioridade na seleção'}</label><select id="trOrd">
        ${Object.keys(ORDENS).map(k => `<option value="${k}"${st.ordem===k?' selected':''}>${esc(ORDENS[k].lbl)}</option>`).join('')}
      </select></div>` : ''}
      ${galeriaAtiva ? `<div class="f"><label class="fld">Mostrar</label><select id="trLim">
        ${[[24,'24 NCRs'],[60,'60 NCRs'],[150,'150 NCRs'],[400,'400 NCRs'],[1000,'1000 NCRs']].map(([v,l]) =>
          `<option value="${v}"${st.limite===v?' selected':''}>${l}</option>`).join('')}
      </select></div>` : ''}
      <span class="muted small right">${Util.fNum(trilhas.length)} NCR(s) com trajetória de ${Util.fNum(list.length)} no recorte</span>`;
    host.appendChild(bar);
    $$('[data-modo]', bar).forEach(b => b.onclick = () => { st.modo = b.dataset.modo; st.tocando = false; UI.render('fluxos'); });
    if($('#trGrupo', bar)) $('#trGrupo', bar).onchange = e => { st.grupo = e.target.value; UI.render('fluxos'); };
    if($('#trLim', bar))   $('#trLim', bar).onchange   = e => { st.limite = +e.target.value; UI.render('fluxos'); };
    if($('#trOrd', bar))   $('#trOrd', bar).onchange   = e => { st.ordem = e.target.value; UI.render('fluxos'); };
    if($('#trQtd', bar))   $('#trQtd', bar).onchange   = e => { st.qtdRepro = +e.target.value; UI.render('fluxos'); };
    if($('#trCol', bar))   $('#trCol', bar).onchange   = e => { st.colRepro = e.target.value; UI.render('fluxos'); };

    if(!trilhas.length){ host.appendChild(Object.assign(document.createElement('div'), {innerHTML: semDados('Nenhuma NCR com trajetória registrada no recorte atual')})); return; }
    if(st.modo === 'galeria') galeria(host, trilhas, m);
    else reproducao(host, trilhas, m);
  }
  return {render, state:st};
})();

/* ============================ Histórico geral ============================ */
const Hist = (() => {
  const st = {tipo:'todos', pagina:1, busca:''};
  /* Ordenar e contabilizar o historico inteiro a cada render fica caro quando
     ele passa de algumas dezenas de milhares de eventos. O resultado e mantido
     em cache e refeito apenas quando o banco muda; o filtro por NCR preserva a
     ordem, logo nao precisa reordenar. */
  let cache = {chave:null, ord:null, cont:null};
  function ordenado(todos){
    const meta = DB.all().meta || {};
    const chave = todos.length + '|' + (todos.length ? todos[0].id : '') + '|' + (meta.atualizadoEm || '');
    if(cache.chave !== chave){
      const ord = todos.slice().sort((a,b) => a.data < b.data ? 1 : a.data > b.data ? -1 : 0);
      const cont = {};
      for(const e of ord){
        const k = e.tipo === 'CAMPO' ? 'CAMPO' : e.tipo === 'PRODUTO' ? 'PRODUTO' : e.cls;
        cont[k] = (cont[k]||0) + 1;
      }
      cache = {chave, ord, cont};
    }
    return cache;
  }
  function render(host){
    const todos = DB.all().historico;
    if(!todos.length){ host.innerHTML = semDados('O histórico começa a ser construído a partir da primeira importação. Importe um novo arquivo para registrar as mudanças.'); return; }
    const cc = ordenado(todos);
    const keys = new Set(Filters.aplicar().map(n => n.key));
    let evs = cc.ord.filter(e => keys.has(e.ncr));
    if(st.tipo !== 'todos'){
      if(st.tipo === 'CAMPO') evs = evs.filter(e => e.tipo === 'CAMPO');
      else if(st.tipo === 'PRODUTO') evs = evs.filter(e => e.tipo === 'PRODUTO');
      else evs = evs.filter(e => e.cls === st.tipo);
    }
    if(st.busca){
      const q = st.busca.toLowerCase();
      evs = evs.filter(e => {
        const rec = DB.all().ncrs[e.ncr];
        return (rec && rec.id.toLowerCase().indexOf(q) >= 0) || Util.strVal(e.para).toLowerCase().indexOf(q) >= 0
            || Util.strVal(e.de).toLowerCase().indexOf(q) >= 0 || Util.strVal(e.campo).toLowerCase().indexOf(q) >= 0;
      });
    }
    const porPag = 120, totalPag = Math.max(1, Math.ceil(evs.length/porPag));
    if(st.pagina > totalPag) st.pagina = 1;
    const page = evs.slice((st.pagina-1)*porPag, st.pagina*porPag);
    const cont = cc.cont;
    host.innerHTML = '';
    UI.barraFiltros(host, {maxFacetas:3});
    const filtros = [['todos','Todos'],['AVANCO','Avanços'],['RETORNO','Retornos'],['LATERAL','Laterais'],
                     ['FECHAMENTO','Fechamentos'],['REABERTURA','Reaberturas'],['INICIAL','Estado inicial'],
                     ['CAMPO','Campos'],['PRODUTO','Produtos']];
    const box = document.createElement('div');
    box.innerHTML = `
      <div class="hstack wrap" style="margin-bottom:12px">
        <div class="tabs" style="border:0;margin:0">${filtros.map(([k,l]) =>
          '<button class="tab'+(st.tipo===k?' active':'')+'" data-t="'+k+'">'+l+(k!=='todos'&&cont[k]?' <span class="muted">('+Util.fNum(cont[k])+')</span>':'')+'</button>').join('')}</div>
        <div class="right hstack">
          <div class="search" style="min-width:220px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input type="search" id="hBusca" placeholder="Filtrar eventos..." value="${esc(st.busca)}"></div>
          <button class="btn sm" id="hCsv">Exportar CSV</button>
        </div>
      </div>
      <div class="muted small" style="margin-bottom:8px">${Util.fNum(evs.length)} eventos</div>
      <div class="tbl-wrap" style="max-height:calc(100vh - 340px)"><table class="tbl"><thead><tr>
        <th style="width:130px">Data</th><th style="width:170px">NCR</th><th style="width:150px">Tipo</th><th>Alteração</th><th style="width:180px">Arquivo</th>
      </tr></thead><tbody>${page.map(e => {
        const rec = DB.all().ncrs[e.ncr];
        const cls = e.cls || e.tipo;
        let txt;
        if(e.tipo === 'STATUS' || (e.tipo === 'MARCO' && e.cls !== 'INICIAL'))
          txt = '<span class="small">'+esc(e.de||'—')+'</span> <span class="arrowto">→</span> <b>'+esc(e.para||'—')+'</b>'
              + (e.tipo === 'MARCO' ? ' <span class="small muted">· ' + (e.fonte === 'SISTEMA' ? 'histórico do sistema' : 'marco do export') + '</span>' : '');
        else if(e.tipo === 'INICIAL' || e.cls === 'INICIAL') txt = '<b>'+esc(e.para||'—')+'</b> <span class="muted small">abertura da NCR</span>';
        else txt = '<b>'+esc(e.campo||'')+'</b>: <span class="small">'+esc(Util.strVal(e.de).slice(0,60)||'(vazio)')+'</span> <span class="arrowto">→</span> <span class="small">'+esc(Util.strVal(e.para).slice(0,60)||'(vazio)')+'</span>';
        return `<tr><td class="small">${Util.fDateTime(e.data)}</td>
          <td>${rec?ncrLink(rec.id,e.ncr):esc(e.ncr)}</td>
          <td><span class="mv mv-${esc(cls)}">${Flow.ICON[cls]||''} ${esc(Flow.LABEL[cls]||cls)}</span></td>
          <td style="max-width:520px">${txt}</td><td class="small muted" title="${esc(e.arquivo||'')}">${esc(e.arquivo||'—')}</td></tr>`;
      }).join('')}</tbody></table>${!page.length?semDados('Nenhum evento encontrado'):''}</div>
      <div class="pager"><button class="btn sm" id="hPrev" ${st.pagina===1?'disabled':''}>‹ Anterior</button>
        <span>Página <b>${st.pagina}</b> de <b>${totalPag}</b></span>
        <button class="btn sm" id="hNext" ${st.pagina>=totalPag?'disabled':''}>Próxima ›</button></div>`;
    host.appendChild(box);
    $$('[data-t]', box).forEach(b => b.onclick = () => { st.tipo = b.dataset.t; st.pagina = 1; UI.render('historico'); });
    $('#hBusca', box).oninput = Util.debounce(e => { st.busca = e.target.value.trim(); st.pagina = 1; UI.render('historico'); }, 300);
    $('#hPrev', box).onclick = () => { st.pagina--; UI.render('historico'); };
    $('#hNext', box).onclick = () => { st.pagina++; UI.render('historico'); };
    $('#hCsv', box).onclick = () => {
      const rows = [['Data','NCR','Tipo','Classificacao','Campo','De','Para','Arquivo']];
      evs.forEach(e => { const rec = DB.all().ncrs[e.ncr];
        rows.push([Util.fDateTime(e.data), rec?rec.id:e.ncr, e.tipo, e.cls||'', e.campo||'', Util.strVal(e.de), Util.strVal(e.para), e.arquivo||'']); });
      Util.download('historico_'+Util.stamp()+'.csv', Util.toCSV(rows), 'text/csv;charset=utf-8');
    };
    ligarLinks(box);
  }
  return {render};
})();

/* ============================ Log de importações ============================ */
const Imp = (() => {
  function render(host){
    const imps = DB.all().importacoes;
    host.innerHTML = `
      <div class="hstack wrap" style="margin-bottom:14px">
        <button class="btn primary" id="iUpd">Atualizar Banco de Dados</button>

    if($('#sisRecap', host)) $('#sisRecap', host).onclick = copiarRecaptura;

  async function copiarRecaptura(){
    const r = SistemaHist.paraRecapturar();
    if(!r.links.length){ Util.toast('Nenhuma NCR precisa de nova captura: todas estão encerradas no Excel e no sistema com o mesmo status.', 'ok', 'Extrator'); return; }
    const t = r.links.join('\n') + '\n';
    const resumo = r.links.length + ' NCR(s): ' + r.abertas + ' aberta(s) e ' + r.divergentes + ' com status diferente entre o Excel e a última captura (inclui reabertas)';
    try{ await navigator.clipboard.writeText(t); Util.toast(resumo + '. No extrator, use "Todas da lista".', 'ok', 'Links copiados'); }
    catch(e){
      UI.modal({size:'md', title:'Links a recapturar', sub:esc(resumo),
        body:'<textarea class="mono small" style="width:100%;height:50vh" readonly>' + esc(t) + '</textarea>'});
      const ta = $('#modalBody textarea'); ta.focus(); ta.select();
    }
  }

  /* ---------- histórico do sistema (NCR Integrada) ---------- */

      ? '<b>' + Util.fNum(r.noBanco) + '</b> de ' + Util.fNum(r.ncrs) + ' NCRs do banco com trajetória corrigida pelo sistema'

        + Util.fNum(r.fora) + ' aguardando a NCR entrar no banco</span>' : '')

      + '<button class="btn primary" id="sisImp">Importar histórico extraído (.json)</button>'

  function inputJson(){

        + kv('Backup criado', r.backup ? '<span class="mono small">'+esc(r.backup)+'</span>' : '—'))}</div>
        <div>${card('Correção','',

        + kv('Eventos do sistema gravados', Util.fNum(a.eventos))
        + kv('Eventos anteriores substituídos', Util.fNum(a.removidos))
        + kv('Status atual atualizado', Util.fNum(a.statusAtualizado))
        + kv('Aguardando a NCR entrar no banco', Util.fNum(r.foraDoBanco.length))
        + kv('Sem mudança de estado registrada', Util.fNum(a.semTransicao)))}</div></div>
        ${r.errosExtracao ? '<div class="note small" style="margin-top:12px">'+Util.fNum(r.errosExtracao)+' NCR(s) falharam na captura. '

        ${r.foraDoBanco.length ? '<div style="margin-top:12px"><b class="small">NCRs capturadas que ainda não existem no banco</b>'

/* ============================ Arquivos processados / backups ============================ */
const Arq = (() => {
  let cacheExcel = null;
  function render(host){
    const arq = DB.all().arquivos;
    const lista = Object.keys(arq).map(h => arq[h]).sort((a,b) => Util.cmp(b.importadoEm, a.importadoEm));
    host.innerHTML = `
      <div class="grid g2" style="margin-bottom:14px">
        ${card('Arquivos Excel encontrados na pasta','identificação por hash SHA-256',
          '<div id="excelList">'+(Store.info().mode === 'fs' ? '<div class="muted small">Clique em <b>Verificar pasta</b> para varrer os arquivos.</div>' :
            '<div class="note warn small">Modo de armazenamento do navegador: os arquivos Excel são escolhidos manualmente a cada atualização.</div>')+'</div>',
          '<button class="btn sm" id="aScan">Verificar pasta</button>')}
        ${card('Backups do banco','política de retenção: '+(DB.cfg().retencaoBackups||10)+' mais recentes','<div id="bkList" class="muted small">Carregando...</div>',
          '<button class="btn sm" id="bkNew">Criar backup agora</button>')}
      </div>
      ${card('Arquivos já processados', Util.fNum(lista.length)+' registros',
        !lista.length ? semDados('Nenhum arquivo processado ainda') :
        `<div class="tbl-wrap" style="max-height:440px"><table class="tbl"><thead><tr>
          <th>Nome</th><th>Hash SHA-256</th><th class="num">Tamanho</th><th>Data do arquivo</th><th>Importado em</th>
          <th class="num">NCRs</th><th class="num">Novas</th><th class="num">Atualizadas</th><th class="num">Erros</th><th></th></tr></thead><tbody>
          ${lista.map(a => `<tr><td title="${esc(a.caminho||a.nome)}"><b>${esc(a.nome)}</b><div class="small muted">${esc(a.caminho||'')}</div></td>
            <td class="mono small" title="${esc(a.hash)}">${esc(a.hash.slice(0,20))}…</td>
            <td class="num">${Util.fBytes(a.tamanho)}</td><td class="small">${Util.fDateTime(a.dataArquivo)}</td>
            <td class="small">${Util.fDateTime(a.importadoEm)}</td><td class="num">${Util.fNum(a.ncrs)}</td>
            <td class="num">${Util.fNum(a.novas)}</td><td class="num">${Util.fNum(a.atualizadas)}</td>
            <td class="num">${a.erros?'<span class="badge warn">'+a.erros+'</span>':'0'}</td>
            <td><button class="btn sm danger" data-esq="${esc(a.hash)}" title="Permite reprocessar este arquivo">Esquecer</button></td></tr>`).join('')}
        </tbody></table></div>`)}`;
    $('#aScan', host).onclick = () => scan(host);
    $('#bkNew', host).onclick = async () => {
      try{ const n = await Backup.criar('manual'); Util.toast(n ? 'Backup criado: '+n : 'Nada a salvar ainda.', 'ok'); listarBackups(); }
      catch(e){ Util.toast(e.message,'err','Backup'); }
    };
    $$('[data-esq]', host).forEach(b => b.onclick = async () => {
      const ok = await UI.confirmar('Esquecer arquivo', 'O arquivo deixará de ser reconhecido como processado e poderá ser importado novamente.<br>O banco atual <b>não</b> será alterado.', 'Esquecer', true);
      if(!ok) return;
      delete DB.all().arquivos[b.dataset.esq];
      await DB.save(['arquivos']);
      UI.render('arquivos');
    });
    listarBackups();
    if(cacheExcel) mostrarExcel(cacheExcel);
  }
  async function scan(host){
    const el = $('#excelList');
    el.innerHTML = '<div class="muted small"><span class="spin"></span> Varrendo pasta...</div>';
    try{
      const arqs = await Store.listExcel();
      cacheExcel = arqs;
      mostrarExcel(arqs);
    }catch(e){ el.innerHTML = '<div class="note err small">'+esc(e.message)+'</div>'; }
  }
  function mostrarExcel(arqs){
    const el = $('#excelList');
    if(!el) return;
    if(!arqs.length){ el.innerHTML = '<div class="muted small">Nenhum arquivo .xlsx encontrado na pasta de trabalho nem em <code>imports/</code>.</div>'; return; }
    const proc = DB.all().arquivos;
    const porNome = {};
    Object.keys(proc).forEach(h => { const a = proc[h]; (porNome[a.nome] = porNome[a.nome] || []).push(a); });
    el.innerHTML = '<table class="tbl"><thead><tr><th>Arquivo</th><th class="num">Tamanho</th><th>Modificado</th><th>Situação</th></tr></thead><tbody>'
      + arqs.map(a => {
        const antes = porNome[a.name];
        let sit;
        if(a.error) sit = '<span class="badge crit">'+esc(a.error)+'</span>';
        else if(!antes) sit = '<span class="badge new">Novo — será processado</span>';
        else{
          const mesmo = antes.find(x => x.tamanho === a.size && x.dataArquivo && Math.abs(new Date(x.dataArquivo)-a.lastModified) < 2000);
          sit = mesmo ? '<span class="badge ord">Provavelmente já processado</span>'
                      : '<span class="badge warn">Mesmo nome, conteúdo diferente — será reprocessado</span>';
        }
        return `<tr><td><b>${esc(a.path||a.name)}</b></td><td class="num">${Util.fBytes(a.size)}</td>
          <td class="small">${a.lastModified?Util.fDateTime(new Date(a.lastModified).toISOString()):'—'}</td><td>${sit}</td></tr>`;
      }).join('') + '</tbody></table><div class="small muted" style="margin-top:8px">A confirmação definitiva é feita pelo hash SHA-256 do conteúdo durante a atualização.</div>';
  }
  async function listarBackups(){
    const el = $('#bkList');
    if(!el) return;
    try{
      const list = await Backup.listar();
      if(!list.length){ el.innerHTML = '<div class="muted small">Nenhum backup criado ainda. Um backup é gerado automaticamente antes de cada importação.</div>'; return; }
      el.innerHTML = '<table class="tbl"><thead><tr><th>Arquivo</th><th class="num">Tamanho</th><th></th></tr></thead><tbody>'
        + list.map(b => `<tr><td class="mono small">${esc(b.name)}</td><td class="num">${Util.fBytes(b.size)}</td>
            <td class="nowrap"><button class="btn sm" data-rest="${esc(b.name)}">Restaurar</button>
            <button class="btn sm ghost" data-dl="${esc(b.name)}">Baixar</button></td></tr>`).join('')
        + '</tbody></table>';
      $$('[data-rest]', el).forEach(b => b.onclick = async () => {
        const ok = await UI.confirmar('Restaurar backup',
          'O banco atual será substituído pelo conteúdo de <b>'+esc(b.dataset.rest)+'</b>.<br>Um backup do estado atual será criado antes.', 'Restaurar', true);
        if(!ok) return;
        try{
          UI.busy.show('Restaurando backup...','Validando e gravando');
          const c = await Backup.restaurar(b.dataset.rest);
          UI.busy.hide();
          Util.toast('Banco restaurado: '+Util.fNum(c.ncrs)+' NCRs.','ok');
          UI.refresh();
        }catch(e){ UI.busy.hide(); Util.toast(e.message,'err','Restauração'); }
      });
      $$('[data-dl]', el).forEach(b => b.onclick = async () => {
        const snap = await Store.readBackup(b.dataset.dl);
        Util.download(b.dataset.dl, JSON.stringify(snap, null, 1));
      });
    }catch(e){ el.innerHTML = '<div class="note err small">'+esc(e.message)+'</div>'; }
  }
  return {render};
})();

/* ============================ Configurações ============================ */

          <div class="small muted" style="margin-top:10px">Um recorte sem coluna correspondente simplesmente não aparece nos filtros —

          <div class="grid g3" id="campoList">${DB.campos().sort(Util.cmp).map(c => {
            const ign = (cfg.camposIgnorados||[]).some(x => Util.norm(x) === Util.norm(c));
            return `<label class="ms-opt"><input type="checkbox" value="${esc(c)}" ${ign?'':'checked'}><span>${esc(c)}</span></label>`;

          <div class="hstack" style="margin-top:12px"><button class="btn primary" id="cmSalvar">Salvar campos</button>
          <button class="btn ghost" id="cmAll">Marcar todos</button><button class="btn ghost" id="cmNone">Desmarcar todos</button></div>`)}

          <div class="kv"><span>Gráficos</span><b>SVG proprietário, paleta acessível validada para daltonismo</b></div>
          <div class="kv"><span>Navegadores</span><b>Chrome e Edge (recomendados, com acesso a pastas) · demais navegadores em modo interno</b></div>
          <div class="kv"><span>Dados</span><b>Permanecem exclusivamente neste computador</b></div>`)}</div>

    ligar(host);

  function ligar(host){
    const cfg = DB.cfg();
    $$('.tab', host).forEach(t => t.onclick = () => {
      $$('.tab', host).forEach(x => x.classList.remove('active'));
      $$('.tabpane', host).forEach(x => x.classList.remove('active'));
      t.classList.add('active');
      $('#cp-'+t.dataset.tab, host).classList.add('active');
    });
    const salvarCfg = async (msg) => {
      try{ await DB.save(['config']); Flow.build(cfg); Filters.invalidateFacets(); UI.refresh(); Util.toast(msg||'Configuração salva.','ok'); }
      catch(e){ Util.toast(e.message,'err','Configuração'); }
    };
    const g = id => $('#'+id, host);
    g('cPick').onclick = async () => {
      try{ await Store.pickFolder(); await UI.recarregar(); Util.toast('Pasta conectada: '+Store.info().folder,'ok'); UI.render('config'); }
      catch(e){ if(e.name !== 'AbortError') Util.toast(e.message,'err'); }
    };
    g('cWelcome').onclick = () => UI.telaInicial();
    g('pSalvar').onclick = () => {
      cfg.semMovimentacaoDias = Math.max(1, +g('pSemMov').value||30);
      cfg.porPagina = Math.max(10, +g('pPag').value||50);
      cfg.retencaoBackups = Math.max(1, +g('pBk').value||10);
      cfg.usarDataArquivo = g('pData').value === '1';
      cfg.pastaImports = g('pImports').value.trim() || 'imports';
      UI.tema(g('pTema').value);
      salvarCfg('Preferências salvas.');
    };
    /* fluxo */
    $$('[data-add]', host).forEach(b => b.onclick = () => {
      const s = b.dataset.add;
      const ordens = cfg.fluxo.map(f => f.ordem);
      cfg.fluxo.push({ordem: Math.max.apply(null, ordens.concat([0]))||1, status:s});
      salvarCfg('Status "'+s+'" adicionado ao fluxo. Ajuste a ordem se necessário.').then(() => UI.render('config'));
    });
    const bodyF = $('#fluxoBody', host);
    if(bodyF){
      $$('[data-del]', bodyF).forEach(b => b.onclick = () => { b.closest('tr').remove(); });
      g('fAdd').onclick = () => {
        const tr = document.createElement('tr');
        const i = $$('tr', bodyF).length;
        tr.innerHTML = `<td><input type="number" min="1" value="1" data-f="ordem" data-i="${i}" style="width:70px"></td>
          <td><input type="text" value="" data-f="status" data-i="${i}" placeholder="Nome exato do status"></td>
          <td class="small muted">—</td><td><label class="ms-opt"><input type="checkbox" data-f="final" data-i="${i}"><span class="small">encerrada</span></label></td>
          <td><button class="btn sm ghost">✕</button></td>`;
        bodyF.appendChild(tr);
        $('button', tr).onclick = () => tr.remove();
      };
      g('fSalvar').onclick = () => {
        const novo = [], finais = [];
        $$('tr', bodyF).forEach(tr => {
          const o = $('[data-f=ordem]', tr), s = $('[data-f=status]', tr), f = $('[data-f=final]', tr);
          const status = s.value.trim();
          if(!status) return;
          novo.push({ordem: Math.max(1, +o.value||1), status});
          if(f.checked) finais.push(status);
        });
        if(!novo.length){ Util.toast('O fluxo precisa de ao menos um status.','warn'); return; }
        cfg.fluxo = novo.sort((a,b) => a.ordem-b.ordem || Util.cmp(a.status,b.status));
        cfg.statusFinais = finais;
        recalcularFechadas();
        salvarCfg('Fluxo salvo com '+novo.length+' status.').then(() => UI.render('config'));
      };
      const cbR = g('pRecon'), cbF = g('pFotoConteudo');
      if(cbR) cbR.onchange = e => {
        cfg.reconstruirHistorico = e.target.checked;
        salvarCfg(e.target.checked
          ? 'Reconstrução de histórico ativada — vale para as próximas importações.'
          : 'Reconstrução de histórico desativada: o histórico passará a começar na importação.');
      };
      if(cbF) cbF.onchange = e => {
        cfg.dataFotoDoConteudo = e.target.checked;
        salvarCfg(e.target.checked ? 'Data da foto será deduzida do conteúdo do export.' : 'Data da foto voltará a vir do arquivo.');
      };
      g('fReset').onclick = async () => {
        if(!await UI.confirmar('Restaurar fluxo padrão','O fluxo voltará à configuração original de 22 status. O histórico é preservado.','Restaurar')) return;
        cfg.fluxo = Util.clone(Cfg.FLUXO_PADRAO);
        cfg.statusFinais = Cfg.PADRAO.statusFinais.slice();
        recalcularFechadas();
        salvarCfg('Fluxo padrão restaurado.').then(() => UI.render('config'));
      };
    }
    /* aging */
    const bodyA = $('#agBody', host);
    if(bodyA){
      $$('[data-adel]', bodyA).forEach(b => b.onclick = () => b.closest('tr').remove());
      g('agAdd').onclick = () => {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td><input type="text" value="Nova faixa" data-a="lbl"></td><td><input type="number" value="0" data-a="min"></td>
          <td><input type="number" value="" placeholder="sem limite" data-a="max"></td><td><button class="btn sm ghost">✕</button></td>`;
        bodyA.appendChild(tr); $('button', tr).onclick = () => tr.remove();
      };
      g('agSalvar').onclick = () => {
        const novo = [];
        $$('tr', bodyA).forEach(tr => {
          const lbl = $('[data-a=lbl]', tr).value.trim();
          const min = +$('[data-a=min]', tr).value||0;
          const maxv = $('[data-a=max]', tr).value;
          if(!lbl) return;
          novo.push({lbl, min, max: maxv === '' ? null : +maxv});
        });
        if(!novo.length){ Util.toast('Defina ao menos uma faixa.','warn'); return; }
        cfg.agingFaixas = novo.sort((a,b) => a.min-b.min);
        salvarCfg('Faixas de aging salvas.');
      };
    }
    /* campos */
    $$('[data-dimcol]', host).forEach(sel => sel.onchange = () => {
      cfg.dimensoesCol = cfg.dimensoesCol || {};
      if(sel.value) cfg.dimensoesCol[sel.dataset.dimcol] = sel.value;
      else delete cfg.dimensoesCol[sel.dataset.dimcol];
      /* o recorte mudou de coluna: a selecao antiga nao vale mais */
      delete Filters.state.dims[sel.dataset.dimcol];
      Dim.invalidate();
      Filters.invalidateFacets();
      salvarCfg('Coluna do recorte atualizada.');
    });
    if(g('cmSalvar')){
      g('cmSalvar').onclick = () => {
        const todos = DB.campos();
        const marcados = new Set($$('#campoList input:checked', host).map(i => i.value));
        cfg.camposIgnorados = todos.filter(c => !marcados.has(c));
        salvarCfg('Campos monitorados atualizados.');
      };
      g('cmAll').onclick = () => $$('#campoList input', host).forEach(i => i.checked = true);
      g('cmNone').onclick = () => $$('#campoList input', host).forEach(i => i.checked = false);
    }
    /* manutencao */
    g('mExp').onclick = () => Util.download('NCR_banco_'+Util.stamp()+'.json', JSON.stringify(DB.snapshot()));
    g('mImp').onclick = async () => {
      const inp = document.createElement('input');
      inp.type = 'file'; inp.accept = '.json';
      inp.onchange = async () => {
        const f = inp.files[0];
        if(!f) return;
        try{
          const snap = JSON.parse(await f.text());
          if(!await UI.confirmar('Importar banco','O banco atual será substituído pelo conteúdo de <b>'+esc(f.name)+'</b>. Um backup será criado antes.','Importar', true)) return;
          await Backup.criar('antes-da-importacao-manual');
          DB.importarSnapshot(snap);
          await DB.save();
          Filters.invalidateFacets(); UI.refresh();
          Util.toast('Banco importado: '+Util.fNum(DB.contagem().ncrs)+' NCRs.','ok');
        }catch(e){ Util.toast('Arquivo inválido: '+e.message,'err'); }
      };
      inp.click();
    };
    g('mReidx').onclick = () => { DB.reindex(); Filters.invalidateFacets(); UI.refresh(); Util.toast('Índices reconstruídos.','ok'); };
    g('mRecalc').onclick = async () => {
      let n = 0;
      DB.all().historico.forEach(e => {
        if(e.tipo !== 'STATUS') return;
        const novo = Flow.classificar(e.de, e.para);
        if(novo !== e.cls){ e.cls = novo; e.ordemDe = Flow.ordemDe(e.de); e.ordemPara = Flow.ordemDe(e.para); n++; }
      });
      recalcularContadores();
      await DB.save(['ncr','historico']);
      DB.reindex(); UI.refresh();
      Util.toast(n+' eventos reclassificados conforme o fluxo atual.','ok');
    };
    g('mLimpar').onclick = async () => {
      if(!await UI.confirmar('Limpar banco de dados','Todas as NCRs, produtos, histórico e registros de arquivos serão apagados.<br>Um backup será criado antes e a configuração será mantida.','Apagar tudo', true)) return;
      try{
        await Backup.criar('antes-da-limpeza');
        DB.limpar();
        await DB.save();
        Filters.reset(); Filters.invalidateFacets(); UI.refresh();
        Util.toast('Banco limpo. Os backups continuam disponíveis.','ok');
      }catch(e){ Util.toast(e.message,'err'); }
    };
  }
  function recalcularFechadas(){
    const d = DB.all();
    for(const k in d.ncrs){
      const n = d.ncrs[k];
      n.ordem = Flow.ordemDe(n.status);
      n.fechada = Flow.isFinal(n.status);
    }
  }
  function recalcularContadores(){
    const d = DB.all();
    for(const k in d.ncrs){
      const n = d.ncrs[k];
      const mov = {avancos:0, retornos:0, laterais:0, fechamentos:0, reaberturas:0, total:0, campos:(n.mov&&n.mov.campos)||0};
      DB.eventos(k).forEach(e => {
        if(e.tipo !== 'STATUS') return;
        mov.total++;
        if(e.cls === 'AVANCO') mov.avancos++;
        else if(e.cls === 'RETORNO') mov.retornos++;
        else if(e.cls === 'LATERAL') mov.laterais++;
        else if(e.cls === 'FECHAMENTO') mov.fechamentos++;
        else if(e.cls === 'REABERTURA') mov.reaberturas++;
      });
      n.mov = mov;
      n.ordem = Flow.ordemDe(n.status);
      n.fechada = Flow.isFinal(n.status);
    }
    SistemaHist.reaplicar();
  }
  return {render};
})();

├── NCR_Control.html
├── BD/
│   ├── ncr.json            (NCRs e estado atual)
│   ├── produtos.json       (vínculos NCR × produto)
│   ├── historico.json      (eventos de alteração)
│   ├── arquivos_processados.json
│   ├── importacoes.json
│   ├── configuracao.json
│   └── backups/
└── imports/                (coloque aqui os .xlsx)</pre>`)}
      ${card('2. Atualização do banco','',`<p class="small">Clique em <b>Atualizar Banco de Dados</b>. O sistema varre a pasta e <code>imports/</code>, calcula o <b>hash SHA-256</b> de cada arquivo e:</p>
        <ul class="small"><li>arquivo <b>idêntico</b> a um já processado → ignorado;</li>
        <li>mesmo nome mas conteúdo diferente → tratado como <b>nova versão</b>;</li>

        <p class="small">O nome do arquivo nunca é usado como critério.</p>`)}
      ${card('3. Histórico incremental','',`<p class="small">Cada Excel é uma <b>fotografia</b> do estado atual. Na primeira vez em que uma NCR aparece, registra-se o

      ${card('4. Classificação das movimentações','',`<div class="small">

        <li>backup automático antes de cada importação (<code>BD/backups/</code>);</li>
        <li>gravação em duas etapas com verificação de leitura antes de confirmar;</li>

      ${card('Atalhos','',`<div class="small"><div class="kv"><span><b>Ctrl + U</b></span><span>Atualizar banco de dados</span></div>

/* ============================ Boot ============================ */
(async function boot(){
  /* tema salvo */
  let tema = 'light';
  try{ tema = localStorage.getItem('ncr_tema') || 'light'; }catch(e){}
  document.documentElement.setAttribute('data-theme', tema);

  UI.montarNav();
  $('#app').hidden = false;

  /* eventos globais */
  $('#btnUpdate').onclick = () => UI.atualizarBanco();
  $('#btnTheme').onclick = () => UI.toggleTema();
  $('#btnHelp').onclick = ajuda;
  $('#filterCue').onclick = e => { e.stopPropagation(); UI.abrirCuePop(); };
  document.addEventListener('click', e => {
    const p = $('#fcuePop');
    if(p && !p.contains(e.target) && e.target.id !== 'filterCue') UI.fecharCuePop();
  });
  $('#modalClose').onclick = UI.fecharModal;
  $('#modalBg').onclick = e => { if(e.target === $('#modalBg')) UI.fecharModal(); };
  $('#btnCancelImport').onclick = () => { Importer.cancelar(); Util.toast('Cancelamento solicitado — concluindo o arquivo atual...','warn'); };
  $('#btnCollapse').onclick = () => {
    const app = $('#app');
    app.classList.toggle('collapsed');
    $('#btnCollapse').textContent = app.classList.contains('collapsed') ? '»' : '« Recolher';
    setTimeout(Charts.redrawAll, 220);
  };
  $('#globalSearch').oninput = Util.debounce(e => {
    Filters.state.texto = e.target.value.trim();
    Filters.invalidate();
    if(UI.atual !== 'ncrs' && Filters.state.texto) UI.ir('ncrs'); else UI.refresh();
  }, 320);
  document.addEventListener('keydown', e => {
    if(e.key === 'Escape'){ UI.fecharModal(); $('#overlay').classList.remove('show'); }
    if((e.ctrlKey||e.metaKey) && e.key.toLowerCase() === 'k'){ e.preventDefault(); $('#globalSearch').focus(); $('#globalSearch').select(); }
    if((e.ctrlKey||e.metaKey) && e.key.toLowerCase() === 'u'){ e.preventDefault(); UI.atualizarBanco(); }
  });
  window.addEventListener('error', ev => {
    if(ev.message && /ResizeObserver/.test(ev.message)) return;
    Util.toast(String(ev.message||'Erro inesperado'), 'err', 'Erro na aplicação');
  });
  window.addEventListener('unhandledrejection', ev => {
    const m = ev.reason && ev.reason.message ? ev.reason.message : String(ev.reason);
    if(/AbortError|user aborted|The user aborted a request/i.test(m)) return;
    Util.toast(m, 'err', 'Operação não concluída');
  });

  /* inicia o motor de leitura em segundo plano */
  Importer.initWorker();

  /* tenta reconectar a pasta usada na última sessão */
  let restaurado = false;
  try{ restaurado = await Store.tryRestore(); }catch(e){}
  if(restaurado === true){
    await DB.load();
    UI.tema(DB.cfg().tema || tema);
    Filters.invalidateFacets();
    UI.atualizarBadges();
    UI.render('dashboard');
    if(!DB.contagem().ncrs) UI.telaInicial();
    else Util.toast('Pasta reconectada: '+Store.info().folder, 'ok');
    return;
  }
  if(restaurado === 'prompt'){
    UI.atualizarBadges();
    UI.render('dashboard');
    const body = `<div class="note" style="margin-bottom:14px"><b>Autorização necessária.</b><br>
      Por segurança, o navegador precisa que você confirme novamente o acesso à pasta
      <b>${esc(Store.info().folder)}</b> usada na sessão anterior. Nenhum dado foi perdido.</div>
      <div class="hstack"><button class="btn primary" id="reAuth">Reconectar pasta</button>
      <button class="btn" id="reOther">Escolher outra pasta</button>
      <button class="btn ghost" id="reLocal">Trabalhar sem pasta</button></div>`;
    UI.modal({size:'sm', title:'Reconectar pasta de trabalho', body, footer:''});
    $('#reAuth').onclick = async () => {
      try{
        const ok = await Store.grantPending();
        if(!ok){ Util.toast('Autorização negada.','warn'); return; }
        UI.fecharModal();
        await UI.recarregar();
        UI.tema(DB.cfg().tema || tema);
        Util.toast('Pasta reconectada. Banco carregado com '+Util.fNum(DB.contagem().ncrs)+' NCRs.','ok');
      }catch(e){ Util.toast(e.message,'err'); }
    };
    $('#reOther').onclick = async () => {
      try{ await Store.pickFolder(); UI.fecharModal(); await UI.recarregar(); Util.toast('Pasta conectada.','ok'); }
      catch(e){ if(e.name !== 'AbortError') Util.toast(e.message,'err'); }
    };
    $('#reLocal').onclick = async () => { Store.useLocal(); UI.fecharModal(); await UI.recarregar(); };
    return;
  }
  /* sem pasta: tenta o armazenamento interno; se houver banco, usa-o */
  if(Idb.available()){
    Store.useLocal();
    try{
      await DB.load();
      if(DB.contagem().ncrs){
        UI.tema(DB.cfg().tema || tema);
        Filters.invalidateFacets();
        UI.atualizarBadges();
        UI.render('dashboard');
        Util.toast('Banco carregado do armazenamento interno do navegador ('+Util.fNum(DB.contagem().ncrs)+' NCRs).','warn','Sem pasta conectada');
        return;
      }
    }catch(e){}
    Store.st.mode = Store.info().supportsFS ? 'none' : 'idb';
  }
  UI.atualizarBadges();
  UI.render('dashboard');
  UI.telaInicial();
})();
</script>
