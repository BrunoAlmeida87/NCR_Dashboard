  const idx = {histPorNcr: new Map(), prodPorNcr: new Map(), prodPorProduto: new Map(),
               campos: [], camposSet: new Set(), carregado: false};

  const cfg = () => d.config;
  const all = () => d;

  function reindex(){
    idx.histPorNcr = new Map();
    /* Dois eventos podem cair no mesmo instante — a aprovação em 7.2 e o
       fechamento que ela dispara, por exemplo. O desempate tem que ser a
       ordem em que foram gravados (que é a ordem real dos fatos e a mesma
       depois de salvar e recarregar); desempatar pelo id sorteado faria a
       trajetória trocar de ordem a cada abertura da tela. */
    const posicao = new Map();
    for(let i = 0; i < d.historico.length; i++){
      const ev = d.historico[i];
      posicao.set(ev, i);
      if(!idx.histPorNcr.has(ev.ncr)) idx.histPorNcr.set(ev.ncr, []);
      idx.histPorNcr.get(ev.ncr).push(ev);
    }
    idx.histPorNcr.forEach(l => l.sort((a,b) => Util.cmp(a.data,b.data) || (posicao.get(a) - posicao.get(b))));
    idx.prodPorNcr = new Map(); idx.prodPorProduto = new Map();
    for(const k in d.produtos){
      const p = d.produtos[k];
      if(!idx.prodPorNcr.has(p.ncr)) idx.prodPorNcr.set(p.ncr, []);
      idx.prodPorNcr.get(p.ncr).push(p);
      if(!idx.prodPorProduto.has(p.produto)) idx.prodPorProduto.set(p.produto, []);
      idx.prodPorProduto.get(p.produto).push(p);
    }
    idx.camposSet = new Set();
    for(const id in d.ncrs){
      const c = d.ncrs[id].campos || {};
      for(const k in c) idx.camposSet.add(k);
    }
    idx.campos = Array.from(idx.camposSet);
    Flow.build(d.config);
  }
  const eventos = ncr => idx.histPorNcr.get(ncr) || [];
  const produtosDe = ncr => idx.prodPorNcr.get(ncr) || [];
  const ncrsDeProduto = p => idx.prodPorProduto.get(p) || [];
  const listaNcrs = () => Object.keys(d.ncrs).map(k => d.ncrs[k]);
  const campos = () => idx.campos.slice();

  async function load(){
    const files = ['configuracao','ncr','produtos','historico','arquivos_processados','importacoes','historico_sistema'];
    const res = {};
    for(const f of files){
      try{ res[f] = await Store.readJSON(f + '.json'); }
      catch(e){ Util.toast('Erro lendo '+f+'.json: '+e.message, 'err', 'Banco de dados'); res[f] = null; }
    }
    if(res.configuracao && typeof res.configuracao === 'object'){
      d.config = Object.assign(Cfg.base(), res.configuracao);
      if(!Array.isArray(d.config.fluxo) || !d.config.fluxo.length) d.config.fluxo = Cfg.FLUXO_PADRAO.slice();
      if(!d.config.etapas) d.config.etapas = Cfg.ETAPAS;
      /* recortes de SBR: SBR1..SBR4 deram lugar aos cascos 53A..53D */
      (d.config.dimensoes || []).forEach(dm => {
        if(dm && dm.id === 'sbr' && JSON.stringify(dm.fixos || []) === JSON.stringify(['SBR1','SBR2','SBR3','SBR4'])){
          const pad = Cfg.PADRAO.dimensoes.find(x => x.id === 'sbr');
          dm.fixos = pad.fixos.slice(); dm.ajuda = pad.ajuda;
        }
      });
    }
    d.ncrs = (res.ncr && res.ncr.registros) || {};
    d.produtos = (res.produtos && res.produtos.registros) || {};
    d.historico = (res.historico && res.historico.eventos) || [];
    d.arquivos = (res.arquivos_processados && res.arquivos_processados.registros) || {};
    d.importacoes = (res.importacoes && res.importacoes.registros) || [];
    d.sistema = (res.historico_sistema && res.historico_sistema.registros) || {};
    d.meta = (res.ncr && res.ncr.meta) || d.meta;
    idx.carregado = true;
    reindex();
    return contagem();
  }
  function contagem(){
    return {ncrs: Object.keys(d.ncrs).length, produtos: Object.keys(d.produtos).length,
            eventos: d.historico.length, arquivos: Object.keys(d.arquivos).length,
            importacoes: d.importacoes.length};
  }
  function envelope(key, registros){
    return {tipo:key, versao:2, gravadoEm:new Date().toISOString(), total:Array.isArray(registros)?registros.length:Object.keys(registros).length,
            meta:d.meta, registros:registros};
  }
  async function save(parts){
    parts = parts || ['config','ncr','produtos','historico','arquivos','importacoes','sistema'];
    d.meta.atualizadoEm = new Date().toISOString();
    if(!d.meta.criadoEm) d.meta.criadoEm = d.meta.atualizadoEm;
    const ops = [];
    if(parts.indexOf('config') >= 0){ d.config.atualizadoEm = d.meta.atualizadoEm; ops.push(['configuracao.json', d.config]); }
    if(parts.indexOf('ncr') >= 0) ops.push(['ncr.json', envelope('ncr', d.ncrs)]);
    if(parts.indexOf('produtos') >= 0) ops.push(['produtos.json', envelope('produtos', d.produtos)]);
    if(parts.indexOf('historico') >= 0) ops.push(['historico.json', {tipo:'historico', versao:2, gravadoEm:d.meta.atualizadoEm, total:d.historico.length, eventos:d.historico}]);
    if(parts.indexOf('arquivos') >= 0) ops.push(['arquivos_processados.json', envelope('arquivos_processados', d.arquivos)]);
    if(parts.indexOf('importacoes') >= 0) ops.push(['importacoes.json', envelope('importacoes', d.importacoes)]);
    if(parts.indexOf('sistema') >= 0) ops.push(['historico_sistema.json', envelope('historico_sistema', d.sistema)]);
    let bytes = 0;
    for(const [name, obj] of ops) bytes += await Store.writeJSON(name, obj);
    return bytes;
  }
  function limpar(){
    d.ncrs = {}; d.produtos = {}; d.historico = []; d.arquivos = {}; d.importacoes = []; d.sistema = {};
    d.meta = {criadoEm:null, atualizadoEm:null, versao:2};
    reindex();
  }
  function importarSnapshot(snap){
    if(!snap || typeof snap !== 'object') throw new Error('Backup inválido');
    if(snap.configuracao) d.config = Object.assign(Cfg.base(), snap.configuracao);
    d.ncrs = snap.ncr || {}; d.produtos = snap.produtos || {};
    d.historico = snap.historico || []; d.arquivos = snap.arquivos_processados || {};
    d.importacoes = snap.importacoes || [];
    d.sistema = snap.historico_sistema || {};
    d.meta = snap.meta || d.meta;
    reindex();
  }
  function snapshot(){
    return {gerado: new Date().toISOString(), meta:d.meta, configuracao:d.config, ncr:d.ncrs,
            produtos:d.produtos, historico:d.historico, arquivos_processados:d.arquivos, importacoes:d.importacoes,
            historico_sistema:d.sistema};
  }
  return {all, cfg, load, save, reindex, contagem, eventos, produtosDe, ncrsDeProduto,
          listaNcrs, campos, limpar, snapshot, importarSnapshot, idx};
})();

/* ============================ BackupManager ============================ */
const Backup = (() => {
  async function criar(motivo){
    const dd = DB.all();
    if(!Object.keys(dd.ncrs).length && !dd.historico.length && !Object.keys(dd.sistema).length) return null;   /* nada a preservar */
    const name = 'backup_' + Util.stamp() + '.json';
    const snap = DB.snapshot();
    snap.motivo = motivo || 'manual';
    await Store.writeBackup(name, snap);
    await aplicarRetencao();
    return name;
  }
  async function aplicarRetencao(){
    const cfg = DB.cfg();
    const manter = Math.max(1, cfg.retencaoBackups || 10);
    const dias = cfg.retencaoDias || 0;
    const list = await Store.listBackups();
    const limite = dias ? Date.now() - dias*Util.DAY : 0;
    for(let i = 0; i < list.length; i++){
      const b = list[i];
      const velho = limite && b.mod && b.mod < limite;
      if(i >= manter || velho){
        if(i < manter && !velho) continue;
        await Store.deleteBackup(b.name);
      }
    }
  }
  const listar = () => Store.listBackups();
  async function restaurar(name){
    const snap = await Store.readBackup(name);
    if(!snap) throw new Error('Backup não encontrado: '+name);
    await criar('antes-da-restauracao');
    DB.importarSnapshot(snap);
    await DB.save();
    return DB.contagem();
  }
  return {criar, listar, restaurar, aplicarRetencao};
})();

/* ============================ HistoryManager ============================ */
const History = (() => {
  let mcache = null;
  function invalidarCache(){ mcache = null; }
  function monitorados(campos){
    const cfg = DB.cfg();
    const ni = (cfg.camposIgnorados||[]).length, nm = (cfg.camposMonitorados||[]).length;
    if(!mcache || mcache.ni !== ni || mcache.nm !== nm || mcache.ts !== cfg.atualizadoEm){
      mcache = {ni, nm, ts:cfg.atualizadoEm, memo:new Map(),
                ign:new Set((cfg.camposIgnorados||[]).map(Util.norm)),
                mon:(cfg.camposMonitorados||[]).map(Util.norm)};
    }
    const memo = mcache.memo;
    return campos.filter(c => {
      let r = memo.get(c);
      if(r === undefined){
        const n = Util.norm(c);
        r = mcache.ign.has(n) ? false : (mcache.mon.length ? mcache.mon.indexOf(n) >= 0 : true);
        memo.set(c, r);
      }
      return r;
    });
  }
  /* compara dois conjuntos de campos e devolve apenas o que mudou */
  function diff(antes, depois, statusKey){
    const out = [];
    const keys = new Set(Object.keys(antes||{}).concat(Object.keys(depois||{})));
    const lista = monitorados(Array.from(keys));
    for(const k of lista){
      if(statusKey && k === statusKey) continue;
      const a = Util.strVal(antes ? antes[k] : ''), b = Util.strVal(depois ? depois[k] : '');
      if(a === b) continue;
      if(!b && a) { out.push({campo:k, de:a, para:'', removido:true}); continue; }
      out.push({campo:k, de:a, para:b});
    }
    return out;
  }
  function evento(o){
    const ev = {id: Util.uid(), ncr:o.ncr, data:o.data, tipo:o.tipo, campo:o.campo||null,
            de:o.de==null?null:o.de, para:o.para==null?null:o.para,
            cls:o.cls||null, ordemDe:o.ordemDe==null?null:o.ordemDe, ordemPara:o.ordemPara==null?null:o.ordemPara,
            arquivo:o.arquivo||null, importId:o.importId||null, obs:o.obs||null,
            estimado:o.estimado?1:0};
    /* origem do dado quando nao e um Excel (ex.: 'SISTEMA' = aba Historico do NCR Integrada) */
    if(o.fonte) ev.fonte = o.fonte;
    return ev;
  }
  return {diff, evento, monitorados, invalidarCache};
})();

/* ============================ MarcoManager ============================
   Exports de NCR normalmente trazem, na PROPRIA LINHA, colunas datadas que
   registram a passagem da NCR por etapas do fluxo. Ex.:
     "Data Criação"
     "Data avanço 2.1 - Especialista ICN"    + "Usuário avanço 2.1 - ..."
     "Data da rejeição 2.2 - TA Specialist"  + "Motivo da rejeição 2.2 - ..."
     "Data da aprovação 7.2 - TA"            + "Responsável 7.2 - TA"
     "CEDOC Closure Data", "7.2 - TA unfounded"
   Sem ler essas colunas a primeira importacao conheceria apenas o status
   ATUAL e todo o caminho ja percorrido seria perdido. Este modulo reconhece
   as colunas pelo PADRAO DO CABECALHO — nunca por lista fixa, nome de aba ou
   nome de arquivo — e reconstroi a trajetoria da NCR com datas, etapas e
   responsaveis reais do export, ja na primeira leitura.
   ====================================================================== */
const Marcos = (() => {
  /* destino=true  -> a data marca a ENTRADA da NCR nesse status
     destino=false -> a NCR ESTAVA nesse passo e ele foi concluido/rejeitado ali */
  const VERBOS = [
    {v:'CRIACAO',      rot:'Criação',      destino:true,  re:/\b(criac|criad|abertur|abert|emiss|emitid|creation|creat|opened|opening)/},
    {v:'IMPROCEDENTE', rot:'Improcedente', destino:true,  re:/\b(unfounded|improceden|sem fundamento)/},
    {v:'FECHAMENTO',   rot:'Fechamento',   destino:true,  re:/\b(closure|closing|closed|encerr|fecham|fechad|conclus|finaliz)/},
    {v:'REJEICAO',     rot:'Rejeição',     destino:false, re:/\b(rejeic|rejeit|reject|reprov|devoluc|devolvid|retorn|refus|recus)/},
    {v:'APROVACAO',    rot:'Aprovação',    destino:false, re:/\b(aprovac|aprovad|approv|validac|validad|homolog)/},
    {v:'AVANCO',       rot:'Avanço',       destino:false, re:/\b(avanc|advanc|forward|encaminh|liberac)/}
  ];
  const RE_DATA  = /\b(data|date|dt)\b/;
  const RE_PESSOA = /\b(usuario|user|responsavel|responsaveis|especialista|analista|autor|by|owner|aprovador|executante)\b/;
  const RE_MOTIVO = /\b(motivo|motivos|reason|justificativa|justificacao|observacao|comentario|comment)\b/;
  /* palavras de moldura que nao fazem parte do nome da etapa */
  const RUIDO = new Set(['data','date','dt','de','da','do','das','dos','em','no','na','pela','pelo','por',
                         'the','of','at','and','e','a','o','as','os','ncr','etapa','step','status','fase']);

  /* --- codigo numerico do rotulo: "2.1 - Especialista ICN" -> {maior:2, menor:1} --- */
  function codigo(txt){
    const n = Util.norm(txt);
    let m = /^(\d{1,2})(?: (\d{1,2}))?\b/.exec(n);
    if(!m) m = /\b(\d{1,2}) (\d{1,2})\b/.exec(n);
    if(!m) return null;
    return {maior:+m[1], menor: m[2] == null ? null : +m[2]};
  }
  const palavras = txt => Util.norm(txt).split(' ')
    .filter(w => w.length > 1 && !RUIDO.has(w) && !/^\d+$/.test(w));

  /* --- casa o rotulo restante com um status do fluxo configurado --- */
  function casarStatus(token, fluxo){
    const nt = Util.norm(token);
    if(!nt) return null;
    for(const f of fluxo) if(Util.norm(f.status) === nt) return f.status;
    const ct = codigo(token), pt = palavras(token);
    let melhor = null, melhorPt = 0;
    for(const f of fluxo){
      const cf = codigo(f.status), pf = palavras(f.status);
      let s = 0;
      if(ct && cf){
        if(ct.maior === cf.maior && ct.menor === cf.menor) s += 4;
        else if(ct.maior === cf.maior) s += 1;
        else s -= 2;
      }
      let dentro = pt.length > 0;
      pt.forEach(w => { if(pf.indexOf(w) >= 0) s += 2; else dentro = false; });
      if(dentro) s += 3;      /* o rotulo e um subconjunto do nome do status */
      if(s > melhorPt){ melhorPt = s; melhor = f.status; }
    }
    return melhorPt >= 4 ? melhor : null;
  }

  /* --- remove a moldura ("Data da rejeição X") sobrando o nome da etapa --- */
  function extrairToken(label, verboRe){
    let n = Util.norm(label);
    if(verboRe) n = n.replace(verboRe, ' ');
    n = n.replace(RE_DATA, ' ');
    return n.split(' ').filter(w => w && !RUIDO.has(w)).join(' ');
  }

  /* ---------------------------------------------------------------
     Detecta, num conjunto de colunas, os marcos de fluxo disponiveis.
     Devolve tambem as colunas auxiliares (criacao, tempo total, tempo no
     status atual) usadas para datar a entrada no status corrente.
     --------------------------------------------------------------- */
  function detectar(cols, tiposData, fluxo){
    const marcos = [], aux = {criacao:null, tramitacao:null, recente:null};
    const pessoas = [], motivos = [];
    const lista = (cols || []).filter(Boolean);

    lista.forEach(c => {
      const n = Util.norm(c);
      if(RE_PESSOA.test(n) && !RE_DATA.test(n)) pessoas.push(c);
      if(RE_MOTIVO.test(n) && !RE_DATA.test(n)) motivos.push(c);
      /* "tempo de tramitacao" total x "mais recente" (dias no status atual) */
      if(/\b(tempo|dias|aging|idade|age|days)\b/.test(n)){
        if(/\b(recente|atual|current|last|ultimo|ultima)\b/.test(n)){ if(!aux.recente) aux.recente = c; }
        else if(/\b(tramitacao|aberto|aberta|total|aging|idade|age|ciclo)\b/.test(n)){ if(!aux.tramitacao) aux.tramitacao = c; }
      }
    });

    lista.forEach(c => {
      const n = Util.norm(c);
      const temData = RE_DATA.test(n);
      const ehData  = tiposData ? !!tiposData[c] : false;
      if(!temData && !ehData) return;                       /* nao carrega data */
      const vb = VERBOS.find(x => x.re.test(n));
      if(!vb) return;                                        /* data sem verbo de fluxo */
      /* "CEDOC Closure Data": o verbo faz parte do nome do status, entao o
         rotulo completo e testado antes de remover o verbo */
      const inteiro = extrairToken(c, null);
      const token = extrairToken(c, vb.re);
      const status = casarStatus(inteiro, fluxo) || casarStatus(token, fluxo);
      if(vb.v === 'CRIACAO'){ if(!aux.criacao) aux.criacao = c; }
      /* rotulo da etapa: o status do fluxo, ou o proprio token capitalizado */
      const rotuloEtapa = status || rotuloDe(c, vb.re)
        || (vb.v === 'CRIACAO'      ? statusAberturaDe(fluxo)
          : vb.v === 'IMPROCEDENTE' ? statusFinalUnfounded()
          : vb.v === 'FECHAMENTO'   ? statusFinalPadrao() : c);
      marcos.push({col:c, v:vb.v, rot:vb.rot, destino:vb.destino, status, etapa:rotuloEtapa,
                   token, respCol:parear(c, vb.re, pessoas), motivoCol:parear(c, vb.re, motivos)});
    });
    return {marcos, aux};
  }

  /* recorta do cabecalho original o trecho que nomeia a etapa, preservando
     a grafia do export ("Data da rejeição 7.2 - TA" -> "7.2 - TA") */
  function rotuloDe(label, verboRe){
    const bruto = String(label);
    /* recorta o trecho entre a primeira e a ultima palavra que nomeia a etapa,
       preservando a grafia e a pontuacao originais do cabecalho */
    const re = /[^\s]+/g;
    let m, ini = -1, fim = -1;
    while((m = re.exec(bruto))){
      const n = Util.norm(m[0]);
      if(!n || RUIDO.has(n) || verboRe.test(n) || RE_DATA.test(n)) continue;
      if(ini < 0) ini = m.index;
      fim = m.index + m[0].length;
    }
    if(ini < 0) return '';
    return bruto.slice(ini, fim).replace(/^[-–—:.,\s]+|[-–—:.,\s]+$/g,'').trim();
  }

  /* acha a coluna auxiliar (responsavel/motivo) que se refere ao mesmo marco */
  function parear(col, verboRe, candidatas){
    if(!candidatas.length) return null;
    const alvoTok = palavras(extrairToken(col, verboRe));
    const alvoCod = codigo(col);
    let melhor = null, pt = 0;
    candidatas.forEach(c => {
      const nc = Util.norm(c);
      /* uma coluna que cita outro verbo pertence a outro marco */
      const outroVerbo = VERBOS.some(x => x.re !== verboRe && x.re.test(nc) && !verboRe.test(nc));
      let s = outroVerbo ? -4 : 0;
      const ct = palavras(c), cc = codigo(c);
      if(alvoCod && cc && alvoCod.maior === cc.maior && alvoCod.menor === cc.menor) s += 3;
      alvoTok.forEach(w => { if(ct.indexOf(w) >= 0) s += 2; });
      if(verboRe.test(nc)) s += 2;
      if(s > pt){ pt = s; melhor = c; }
    });
    return pt >= 3 ? melhor : null;
  }

  const dias = v => { const m = /(-?\d+(?:[.,]\d+)?)/.exec(Util.strVal(v)); return m ? Math.round(parseFloat(m[1].replace(',','.'))) : null; };

  /* --- data da foto deduzida do CONTEUDO: criacao + tempo de tramitacao --- */
  function dataFotoDoConteudo(amostras){
    const est = [];
    amostras.forEach(a => {
      if(!a.criadoEm || a.tramitacao == null || a.tramitacao < 0) return;
      est.push(new Date(a.criadoEm).getTime() + a.tramitacao * Util.DAY);
    });
    if(est.length < 3) return null;
    est.sort((x,y) => x-y);
    return new Date(est[Math.floor(est.length/2)]).toISOString();
  }

  /* ---------------------------------------------------------------
     Reconstroi a trajetoria de uma NCR a partir dos marcos da linha.
     Gera eventos reais (cada um ancorado numa data do export), o mapa de
     visitas por status, os contadores de movimentacao e a data de entrada
     no status atual.
     --------------------------------------------------------------- */
  function reconstruir(o){
    const {campos, det, statusAtual, statusCol, criadoEm, dataFoto, arquivo, importId, ncr, fluxo} = o;
    const passos = [];
    const vistos = new Set();
    (det.marcos || []).forEach(m => {
      const iso = Util.toISO(campos[m.col]);
      if(!iso) return;
      const ch = iso + '|' + m.v + '|' + m.etapa;
      if(vistos.has(ch)) return;
      vistos.add(ch);
      passos.push({data:iso, v:m.v, rot:m.rot, destino:m.destino,
                   etapa:m.etapa, status:m.status,
                   resp: m.respCol ? Util.strVal(campos[m.respCol]) : '',
                   motivo: m.motivoCol ? Util.strVal(campos[m.motivoCol]) : '',
                   col:m.col});
    });
    /* a criacao ancora o inicio, mesmo quando o export nao traz coluna de marco */
    if(criadoEm && !passos.some(p => p.v === 'CRIACAO'))
      passos.push({data:criadoEm, v:'CRIACAO', rot:'Criação', destino:true, etapa:null, status:null, resp:'', motivo:'', col:null});
    if(!passos.length) return null;
    passos.sort((a,b) => a.data < b.data ? -1 : a.data > b.data ? 1 : (a.v === 'CRIACAO' ? -1 : 0));

    const abertura = statusAberturaDe(fluxo);
    const eventos = [], visitas = {};
    const mov = {avancos:0, retornos:0, laterais:0, fechamentos:0, reaberturas:0, total:0, campos:0};
    let atual = null, ordemAtual = null, desde = null;

    function visitar(st){ if(!st) return; if(!visitas[st]) visitas[st] = {n:0, ms:0}; visitas[st].n++; }
    function acumular(st, de, ate){
      if(!st) return;
      if(!visitas[st]) visitas[st] = {n:1, ms:0};
      if(de && ate) visitas[st].ms += Math.max(0, new Date(ate) - new Date(de));
    }
    function mover(para, data, cls, extra){
      const ordemPara = para ? Flow.ordemInferida(para) : null;
      acumular(atual, desde, data);
      eventos.push(History.evento(Object.assign({
        ncr, data, tipo:'MARCO', campo:statusCol || 'Status',
        de:atual, para, cls, ordemDe:ordemAtual, ordemPara,
        arquivo, importId
      }, extra || {})));
      if(cls !== 'INICIAL'){
        mov.total++;
        if(cls === 'AVANCO') mov.avancos++;
        else if(cls === 'RETORNO') mov.retornos++;
        else if(cls === 'LATERAL') mov.laterais++;
        else if(cls === 'FECHAMENTO') mov.fechamentos++;
        else if(cls === 'REABERTURA') mov.reaberturas++;
      }
      visitar(para);
      atual = para; ordemAtual = ordemPara; desde = data;
    }
    function classe(de, para, forc){
      if(forc) return forc;
      if(!de) return 'INICIAL';
      return Flow.classificar(de, para);
    }
    const fonte = m => 'Registrado na coluna "' + m.col + '" do export'
      + (m.resp ? ' · ' + m.resp : '') + (m.motivo ? ' · ' + m.motivo : '');

    passos.forEach((p, i) => {
      if(p.v === 'CRIACAO'){
        const st = p.status || abertura;
        if(atual) return;                                  /* criacao duplicada */
        mover(st, p.data, 'INICIAL', {obs: p.col ? fonte(p) : 'Data de criação da NCR'});
        return;
      }
      if(p.destino){                                       /* fechamento / improcedente */
        let st = p.status;
        if(!st) st = p.v === 'IMPROCEDENTE' ? statusFinalUnfounded() : statusFinalPadrao();
        if(!st) return;
        mover(st, p.data, classe(atual, st, Flow.isFinal(st) ? 'FECHAMENTO' : null),
              {obs: fonte(p) + ' · ' + p.rot});
        return;
      }
      /* passagem: a NCR estava nesta etapa e ela foi concluida/rejeitada aqui.
         O export nao datao a CHEGADA, apenas a saida; a chegada entra na mesma
         data e fica marcada como estimada. */
      const st = p.status || p.etapa;
      if(!st) return;
      if(Util.norm(st) !== Util.norm(atual || '')){
        mover(st, p.data, classe(atual, st), {obs:'Passagem por "' + st + '" registrada pela coluna "' + p.col + '" (data de chegada não consta no export)', estimado:true});
      }
      if(p.v === 'REJEICAO'){
        /* rejeitada nesta etapa: volta para a etapa anterior conhecida */
        const volta = eventos.length > 1 ? eventos[eventos.length-2].para : null;
        const destino = (volta && Util.norm(volta) !== Util.norm(st)) ? volta : null;
        if(destino) mover(destino, p.data, 'RETORNO', {obs: fonte(p) + ' · rejeitada em "' + st + '"'});
        else eventos[eventos.length-1].obs = fonte(p) + ' · rejeitada em "' + st + '"';
      }
    });
    if(!eventos.length) return null;

    /* --- entrada no status atual --- */
    const ultima = eventos[eventos.length-1].data;
    let entrada = null;
    const dr = det.aux.recente ? dias(campos[det.aux.recente]) : null;
    if(dr != null && dr > 0){
      const cand = new Date(new Date(dataFoto).getTime() - dr*Util.DAY).toISOString();
      entrada = cand > ultima ? cand : ultima;             /* nunca antes do ultimo marco */
    } else {
      entrada = ultima;
    }
    if(entrada > dataFoto) entrada = dataFoto;

    if(statusAtual && Util.norm(statusAtual) !== Util.norm(atual || '')){
      mover(statusAtual, entrada, classe(atual, statusAtual), {
        obs: dr != null && dr > 0
          ? 'Status atual do export · há ' + Util.fDur(dr) + ' nesta situação (coluna "' + det.aux.recente + '")'
          : dr === 0
            ? 'Status atual do export · a coluna "' + det.aux.recente + '" marca 0 dias, que em NCR encerrada costuma significar "sem contagem"; '
              + 'a entrada foi ancorada no último marco datado em vez da data da foto'
            : 'Status atual do export · data de entrada estimada',
        estimado:true});
    } else if(atual){
      desde = entrada;
    }
    return {eventos, visitas, mov, statusDesde: desde || entrada, nMarcos: passos.length};
  }

  function statusAberturaDe(fluxo){
    let melhor = null, ord = Infinity;
    (fluxo || []).forEach(f => { const o = Number(f.ordem); if(o < ord){ ord = o; melhor = f.status; } });
    return melhor;
  }
  function statusFinalPadrao(){
    const cfg = DB.cfg();
    return (cfg.statusFinais || []).find(s => !Flow.isUnfounded(s)) || (cfg.statusFinais || [])[0] || null;
  }
  function statusFinalUnfounded(){
    const cfg = DB.cfg();
    return (cfg.statusUnfounded || [])[0] || statusFinalPadrao();
  }
  return {detectar, reconstruir, dataFotoDoConteudo, dias, VERBOS};
})();

/* ============================ ExcelImporter ============================ */
const Importer = (() => {
  let worker = null, workerOk = null, seq = 0;
  const pend = new Map();
  let cancelado = false;

  function engineSrc(){ return document.getElementById('xlsxEngineSrc').textContent; }

  function initWorker(){
    if(workerOk !== null) return Promise.resolve(workerOk);
    return new Promise(res => {
      try{
        const blob = new Blob([engineSrc()], {type:'application/javascript'});
        worker = new Worker(URL.createObjectURL(blob));
        let done = false;
        const to = setTimeout(() => { if(!done){ done = true; worker = null; workerOk = false; res(false); } }, 2500);
        worker.onmessage = ev => {
          const m = ev.data || {};
          if(m.type === 'pong'){ if(!done){ done = true; clearTimeout(to); workerOk = true; worker.onmessage = onWorkerMsg; res(true); } return; }
          onWorkerMsg(ev);
        };
        worker.onerror = () => { if(!done){ done = true; clearTimeout(to); worker = null; workerOk = false; res(false); } };
        worker.postMessage({cmd:'ping'});
      }catch(e){ worker = null; workerOk = false; res(false); }
    });
  }
  function onWorkerMsg(ev){
    const m = ev.data || {};
    const p = pend.get(m.id);
    if(!p) return;
    if(m.type === 'progress'){ p.onProgress && p.onProgress(m); return; }
    if(m.type === 'skipped'){ pend.delete(m.id); p.resolve({skipped:true, hash:m.hash, bytes:m.bytes}); return; }
    if(m.type === 'done'){ pend.delete(m.id); p.resolve(m.result); return; }
    if(m.type === 'error'){ pend.delete(m.id); p.reject(new Error(m.message||'Falha na leitura do Excel')); return; }
  }
  /* le + hash + parse: worker quando possivel, senao thread principal */
  async function lerArquivo(file, skipHashes, onProgress){
    const ok = await initWorker();
    if(ok && worker){
      const id = ++seq;
      return new Promise((resolve, reject) => {
        pend.set(id, {resolve, reject, onProgress});
        try{ worker.postMessage({cmd:'parse', id, file, skipHashes: skipHashes||[]}); }
        catch(e){ pend.delete(id); reject(e); }
      });
    }
    /* fallback: engine na thread principal */
    if(!window.__XLSX_ENGINE__){ try{ (new Function(engineSrc()))(); }catch(e){ throw new Error('Não foi possível iniciar o leitor de Excel: '+e.message); } }
    const eng = window.__XLSX_ENGINE__;
    if(!eng) throw new Error('Leitor de Excel indisponível neste navegador.');
    const buf = await file.arrayBuffer();
    const bytes = new Uint8Array(buf);
    const hash = await eng.sha256Hex(bytes);
    onProgress && onProgress({phase:'hash', pct:8});
    if(skipHashes && skipHashes.indexOf(hash) >= 0) return {skipped:true, hash, bytes:bytes.length};
    await Util.yieldUI();
    const res = await eng.parseWorkbookBuffer(buf, p => onProgress && onProgress(p));
    res.hash = hash; res.bytes = bytes.length;
    return res;
  }

  /* ---------- deteccao de cabecalho e de tipo de planilha ---------- */
  function acharCabecalho(rows){
    let best = -1, bestScore = 0;
    const lim = Math.min(rows.length, 12);
    for(let i = 0; i < lim; i++){
      const r = rows[i] || [];
      let n = 0, txt = 0;
      for(let j = 0; j < r.length; j++){
        const v = r[j];
        if(v === undefined || v === null || v === '') continue;
        n++;
        if(typeof v === 'string' && v.trim().length && v.trim().length < 90) txt++;
      }
      const score = txt * 2 + n;
      if(n >= 2 && score > bestScore){ bestScore = score; best = i; }
    }
    return best;
  }
  function nomesColunas(row){
    const out = [], usados = {};
    for(let j = 0; j < row.length; j++){
      let v = row[j];
      let name = (v === undefined || v === null) ? '' : String(v).replace(/\s+/g,' ').trim();
      if(!name){ out.push(null); continue; }
      if(usados[name]){ usados[name]++; name = name + ' (' + usados[name] + ')'; }
      else usados[name] = 1;
      out.push(name);
    }
    return out;
  }
  function acharCol(cols, aliases){
    const normCols = cols.map(c => c ? Util.norm(c) : '');
    for(const a of aliases){
      const i = normCols.indexOf(Util.norm(a));
      if(i >= 0) return i;
    }
    for(const a of aliases){
      const na = Util.norm(a);
      for(let i = 0; i < normCols.length; i++){
        if(normCols[i] && (normCols[i] === na || normCols[i].indexOf(na) === 0)) return i;
      }
    }
    return -1;
  }
  function analisarPlanilha(sheet){
    const rows = sheet.rows || [];
    const hi = acharCabecalho(rows);
    if(hi < 0) return null;
    const cols = nomesColunas(rows[hi] || []);
    const info = {
      nome: sheet.name, headerRow: hi, cols,
      iNcr: acharCol(cols, Cfg.aliasDe('ncr')),
      iProduto: acharCol(cols, Cfg.aliasDe('produto')),
      iStatus: acharCol(cols, Cfg.aliasDe('status')),
      iData: acharCol(cols, Cfg.aliasDe('dataCriacao')),
      nLinhas: Math.max(0, rows.length - hi - 1)
    };
    info.scoreNcr = (info.iNcr >= 0 ? 4 : -99) + (info.iStatus >= 0 ? 3 : 0) + (info.iData >= 0 ? 2 : 0)
                  + (cols.length > 12 ? 2 : 0) + (info.iProduto >= 0 && cols.length < 14 ? -4 : 0);
    info.scoreProd = (info.iNcr >= 0 ? 3 : -99) + (info.iProduto >= 0 ? 5 : -99)
                   + (info.iStatus >= 0 ? -2 : 1) + (cols.length <= 16 ? 1 : 0);
    return info;
  }
  function identificar(res){
    const avisos = [];
    const infos = [];
    (res.sheets||[]).forEach(s => {
      const i = analisarPlanilha(s);
      if(i){ i.sheet = s; infos.push(i); }
      else if((s.rows||[]).length) avisos.push('Aba "'+s.name+'" ignorada: não foi possível identificar um cabeçalho.');
    });
    const cand = infos.filter(i => i.iNcr >= 0);
    if(!cand.length){
      const nomes = infos.map(i => i.nome).join(', ') || '(nenhuma)';
      throw new Error('Nenhuma aba com coluna de identificação da NCR (ex.: "Número NCR") foi encontrada. Abas lidas: '+nomes);
    }
    const ncrInfo = cand.slice().sort((a,b) => b.scoreNcr - a.scoreNcr)[0];
    const prodCand = cand.filter(i => i !== ncrInfo && i.iProduto >= 0).sort((a,b) => b.scoreProd - a.scoreProd);
    const prodInfo = prodCand.length ? prodCand[0] : null;
    if(!prodInfo) avisos.push('Nenhuma aba de produtos identificada neste arquivo — apenas as NCRs serão atualizadas.');
    infos.forEach(i => { if(i !== ncrInfo && i !== prodInfo && i.nLinhas > 0) avisos.push('Aba "'+i.nome+'" não utilizada ('+i.nLinhas+' linhas).'); });
    return {ncrInfo, prodInfo, avisos};
  }
  /* converte a linha em objeto {coluna: valor} */
  function linhaObj(row, cols){
    const o = {};
    for(let j = 0; j < cols.length; j++){
      const c = cols[j];
      if(!c) continue;
      let v = row[j];
      if(v === undefined || v === null) continue;
      if(v instanceof Date) v = v.toISOString();
      else if(typeof v === 'string'){ v = v.replace(/\r\n/g,'\n').trim(); if(!v) continue; }
      else if(typeof v === 'boolean') v = v ? 'Sim' : 'Não';
      o[c] = v;
    }
    return o;
  }
  const chaveNcr = s => String(s == null ? '' : s).toUpperCase().replace(/\s+/g,'').replace(/[·]/g,'');

  /* ---------- mesclagem incremental ---------- */
  async function aplicar(res, arqInfo, stats, onTick){
    const d = DB.all(), cfg = DB.cfg();
    const {ncrInfo, prodInfo, avisos} = identificar(res);
    stats.avisos = stats.avisos.concat(avisos);
    if(res.warnings && res.warnings.length) stats.avisos = stats.avisos.concat(res.warnings);

    const importId = stats.importId;
    const arquivoNome = arqInfo.name;
    const novosEventos = [];

    /* ---- NCRs ---- */
    const cols = ncrInfo.cols.filter(Boolean);
    const colsSet = new Set(cols);
    const statusCol = ncrInfo.iStatus >= 0 ? ncrInfo.cols[ncrInfo.iStatus] : null;
    const dataCol = ncrInfo.iData >= 0 ? ncrInfo.cols[ncrInfo.iData] : null;
    const rows = ncrInfo.sheet.rows;
    const vistosNoArquivo = new Set();
    stats.colunasNcr = cols.length;
    stats.abaNcr = ncrInfo.nome;
    stats.abaProdutos = prodInfo ? prodInfo.nome : null;

    /* ---- marcos de fluxo embutidos na propria linha ----
       Colunas como "Data avanço 2.1 - Especialista ICN" ou "CEDOC Closure Data"
       registram a passagem da NCR por etapas anteriores. Sao reconhecidas pelo
       padrao do cabecalho e usadas para reconstruir a trajetoria na primeira
       leitura, em vez de o historico comecar do zero no status atual. */
    const tiposData = {};
    for(let r = ncrInfo.headerRow + 1; r < Math.min(rows.length, ncrInfo.headerRow + 60); r++){
      const row = rows[r]; if(!row) continue;
      for(let j = 0; j < ncrInfo.cols.length; j++){
        const c = ncrInfo.cols[j];
        if(c && !tiposData[c] && row[j] instanceof Date) tiposData[c] = true;
      }
    }
    const reconstruir = cfg.reconstruirHistorico !== false;
    const det = Marcos.detectar(cols, tiposData, cfg.fluxo || []);
    stats.colunasMarco = det.marcos.length;
    /* noFluxo indica que a etapa consta na lista de status configurada; quando
       nao consta, a ordem foi inferida pelo codigo numerico do rotulo */
    const statusConfig = new Set((cfg.fluxo || []).map(f => Util.norm(f.status)));
    stats.marcosDetectados = det.marcos.map(m => ({col:m.col, tipo:m.rot, etapa:m.etapa,
      ordem: Flow.ordemInferida(m.etapa),
      noFluxo: statusConfig.has(Util.norm(m.etapa || '')),
      resp:m.respCol || null}));
    if(det.marcos.length) stats.avisos.push('Reconstrução de histórico: ' + det.marcos.length +
      ' coluna(s) de marco de fluxo reconhecida(s) — ' + det.marcos.map(m => m.rot + ' em "' + m.etapa + '"').join('; ') + '.');

    /* a data da foto vinda do conteudo (criacao + tempo de tramitacao) e mais
       confiavel que a data do arquivo, que muda ao copiar ou baixar de novo */
    let dataFoto = arqInfo.dataFoto;
    if(det.aux.tramitacao && dataCol){
      const amostras = [];
      for(let r = ncrInfo.headerRow + 1; r < rows.length && amostras.length < 80; r++){
        const row = rows[r]; if(!row) continue;
        const cEm = Util.toISO(row[ncrInfo.iData]);
        const tj = ncrInfo.cols.indexOf(det.aux.tramitacao);
        if(cEm && tj >= 0) amostras.push({criadoEm:cEm, tramitacao: Marcos.dias(row[tj])});
      }
      const fc = Marcos.dataFotoDoConteudo(amostras);
      if(fc && cfg.dataFotoDoConteudo !== false){
        dataFoto = fc; stats.dataFotoOrigem = 'conteúdo';
        stats.avisos.push('Data da foto deduzida do conteúdo do export (' +
          Util.fDateTime(fc) + '), a partir de "' + dataCol + '" + "' + det.aux.tramitacao + '".');
      }
    }
    stats.dataFoto = dataFoto;

    for(let r = ncrInfo.headerRow + 1; r < rows.length; r++){
      if(cancelado) throw new Error('CANCELADO');
      if((r & 255) === 0){ await Util.yieldUI(); onTick && onTick(r - ncrInfo.headerRow, rows.length - ncrInfo.headerRow); }
      const row = rows[r];
      if(!row || !row.length) continue;
      const idRaw = row[ncrInfo.iNcr];
      if(idRaw === undefined || idRaw === null || String(idRaw).trim() === ''){
        const temAlgo = row.some(v => v !== undefined && v !== null && v !== '');
        if(temAlgo) stats.erros.push('Linha '+(r+1)+' da aba "'+ncrInfo.nome+'" ignorada: NCR sem identificador.');
        continue;
      }
      const id = String(idRaw).trim(), key = chaveNcr(id);
      if(vistosNoArquivo.has(key)){ stats.duplicadasNoArquivo++; }
      vistosNoArquivo.add(key);
      stats.analisadas++;

      const campos = linhaObj(row, ncrInfo.cols);
      const status = statusCol ? Util.strVal(campos[statusCol]) : '';
      const ordem = Flow.ordemDe(status);
      const criadoEm = dataCol ? Util.toISO(campos[dataCol]) : null;

      let rec = d.ncrs[key];
      if(!rec){
        rec = {
          id, key, campos, status, ordem, fechada: Flow.isFinal(status),
          criadoEm, primeiraVez: dataFoto, ultimaVez: dataFoto, statusDesde: dataFoto,
          ultimaAlteracao: dataFoto,
          mov: {avancos:0, retornos:0, laterais:0, fechamentos:0, reaberturas:0, total:0, campos:0},
          visitas: {}, arquivoOrigem: arquivoNome, hashOrigem: arqInfo.hash,
          fontes: [{arquivo:arquivoNome, hash:arqInfo.hash, data:dataFoto, tipo:'inicial'}]
        };
        d.ncrs[key] = rec;
        /* Trajetoria reconstruida a partir das colunas datadas da propria linha:
           a NCR ja entra no banco com o caminho percorrido, nao apenas com o
           status atual. Sem isso o historico so comecaria na proxima foto. */
        const rc = reconstruir && det.marcos.length
          ? Marcos.reconstruir({campos, det, statusAtual:status, statusCol, criadoEm,
              dataFoto, arquivo:arquivoNome, importId, ncr:key, fluxo:cfg.fluxo || []})
          : null;
        if(rc){
          rec.visitas = rc.visitas;
          rec.mov = rc.mov;
          rec.statusDesde = rc.statusDesde || dataFoto;
          rec.primeiraVez = rc.eventos[0].data;
          rec.ultimaAlteracao = rc.eventos[rc.eventos.length-1].data;
          rec.reconstruida = rc.nMarcos;
          rc.eventos.forEach(e => {
            novosEventos.push(e);
            if(e.cls && e.cls !== 'INICIAL') stats.cls[e.cls] = (stats.cls[e.cls]||0) + 1;
          });
          stats.marcosLidos += rc.nMarcos;
          stats.ncrsReconstruidas++;
          /* movimento vindo do proprio export nao e uma mudanca ocorrida ENTRE
             duas fotos: os dois numeros ficam separados no relatorio */
          stats.movimentosReconstruidos += Math.max(0, rc.eventos.length - 1);
        } else {
          if(status) rec.visitas[status] = {n:1, ms:0};
          novosEventos.push(History.evento({ncr:key, data:dataFoto, tipo:'INICIAL', campo:statusCol||'Status',
            de:null, para:status, cls:'INICIAL', ordemPara:ordem, arquivo:arquivoNome, importId,
            obs:'Estado inicial conhecido'}));
        }
        stats.novas++;
        continue;
      }
      /* importacao retroativa: a foto e mais antiga do que o ultimo estado conhecido */
      const retroativa = dataFoto < rec.ultimaVez;
      if(retroativa){
        stats.retroativas++;
        for(const k in campos) if(rec.campos[k] === undefined || rec.campos[k] === '') rec.campos[k] = campos[k];
        if(!rec.criadoEm && criadoEm) rec.criadoEm = criadoEm;
        if(dataFoto < rec.primeiraVez) rec.primeiraVez = dataFoto;
        continue;
      }
      /* diferencas de campos (apenas colunas presentes neste arquivo) */
      const antes = {}, depois = {};
      colsSet.forEach(c => { antes[c] = rec.campos[c]; depois[c] = campos[c] === undefined ? '' : campos[c]; });
      const mudancas = History.diff(antes, depois, statusCol);
      /* marcos que passaram a ter data desde a ultima foto: sao movimentacoes
         reais que o export datou, e nao apenas uma mudanca de campo */
      if(reconstruir && det.marcos.length){
        for(const m of det.marcos){
          if(!colsSet.has(m.col)) continue;
          const nova = Util.toISO(campos[m.col]);
          if(!nova || Util.toISO(rec.campos[m.col])) continue;
          const etapa = m.status || m.etapa;
          if(!etapa) continue;
          novosEventos.push(History.evento({ncr:key, data:nova, tipo:'MARCO', campo:m.col,
            de:rec.status, para:etapa, cls: m.v === 'REJEICAO' ? 'RETORNO'
              : (m.destino && Flow.isFinal(etapa) ? 'FECHAMENTO' : Flow.classificar(rec.status, etapa)),
            ordemDe:rec.ordem, ordemPara:Flow.ordemInferida(etapa), arquivo:arquivoNome, importId,
            obs: m.rot + ' registrado na coluna "' + m.col + '" do export'
                 + (m.respCol && campos[m.respCol] ? ' · ' + Util.strVal(campos[m.respCol]) : '')
                 + (m.motivoCol && campos[m.motivoCol] ? ' · ' + Util.strVal(campos[m.motivoCol]) : '')}));
          if(!rec.visitas[etapa]) rec.visitas[etapa] = {n:0, ms:0};
          rec.visitas[etapa].n++;
          stats.marcosLidos++;
        }
      }
      let mudouStatus = false;
      if(statusCol && status && Util.strVal(rec.status) !== status){
        mudouStatus = true;
        const cls = Flow.classificar(rec.status, status);
        const ordemAnt = rec.ordem;
        /* tempo acumulado no status anterior */
        const ms = Math.max(0, new Date(dataFoto) - new Date(rec.statusDesde || rec.primeiraVez));
        if(rec.status){
          if(!rec.visitas[rec.status]) rec.visitas[rec.status] = {n:1, ms:0};
          rec.visitas[rec.status].ms += ms;
        }
        if(!rec.visitas[status]) rec.visitas[status] = {n:0, ms:0};
        rec.visitas[status].n++;
        novosEventos.push(History.evento({ncr:key, data:dataFoto, tipo:'STATUS', campo:statusCol,
          de:rec.status, para:status, cls, ordemDe:ordemAnt, ordemPara:ordem, arquivo:arquivoNome, importId,
          obs: 'Permaneceu ' + Util.fDur(Math.floor(ms/Util.DAY)) + ' em "' + rec.status + '"'}));
        rec.status = status; rec.ordem = ordem; rec.statusDesde = dataFoto;
        rec.fechada = Flow.isFinal(status);
        rec.mov.total++;
        if(cls === 'AVANCO') rec.mov.avancos++;
        else if(cls === 'RETORNO') rec.mov.retornos++;
        else if(cls === 'LATERAL') rec.mov.laterais++;
        else if(cls === 'FECHAMENTO') rec.mov.fechamentos++;
        else if(cls === 'REABERTURA') rec.mov.reaberturas++;
        stats.mudancasStatus++;
        stats.cls[cls] = (stats.cls[cls]||0) + 1;
      }
      for(const m of mudancas){
        novosEventos.push(History.evento({ncr:key, data:dataFoto, tipo:'CAMPO', campo:m.campo,
          de:m.de, para:m.para, cls:'CAMPO', arquivo:arquivoNome, importId}));
        rec.mov.campos++;
      }
      /* aplica valores: colunas ausentes no arquivo preservam o valor anterior */
      for(const c of cols){
        const nv = campos[c];
        if(nv === undefined){ if(depois[c] === '' && antes[c] !== undefined && Util.strVal(antes[c]) !== '') rec.campos[c] = ''; }
        else rec.campos[c] = nv;
      }
      if(criadoEm) rec.criadoEm = criadoEm;
      rec.ultimaVez = dataFoto;
      rec.arquivoOrigem = arquivoNome; rec.hashOrigem = arqInfo.hash;
      if(mudouStatus || mudancas.length){
        rec.ultimaAlteracao = dataFoto;
        stats.atualizadas++;
        rec.fontes = (rec.fontes||[]).concat([{arquivo:arquivoNome, hash:arqInfo.hash, data:dataFoto, tipo:'alteracao'}]).slice(-8);
      } else stats.semAlteracao++;
    }

    /* ---- Produtos ---- */
    if(prodInfo){
      const pcols = prodInfo.cols;
      const pRows = prodInfo.sheet.rows;
      const prodCol = pcols[prodInfo.iProduto];
      const porNcr = new Map();
      /* indice local dos vinculos ja existentes (evita varrer o banco a cada NCR) */
      const idxProd = new Map();
      for(const k in d.produtos){
        const p = d.produtos[k];
        if(!idxProd.has(p.ncr)) idxProd.set(p.ncr, []);
        idxProd.get(p.ncr).push(p);
      }
      stats.abaProdutosLinhas = Math.max(0, pRows.length - prodInfo.headerRow - 1);
      for(let r = prodInfo.headerRow + 1; r < pRows.length; r++){
        if(cancelado) throw new Error('CANCELADO');
        if((r & 511) === 0) await Util.yieldUI();
        const row = pRows[r];
        if(!row || !row.length) continue;
        const nRaw = row[prodInfo.iNcr], pRaw = row[prodInfo.iProduto];
        if(nRaw === undefined || String(nRaw).trim() === ''){
          if(pRaw !== undefined && String(pRaw).trim() !== '') stats.erros.push('Linha '+(r+1)+' da aba "'+prodInfo.nome+'": produto sem NCR de referência.');
          continue;
        }
        if(pRaw === undefined || String(pRaw).trim() === ''){ stats.erros.push('Linha '+(r+1)+' da aba "'+prodInfo.nome+'": NCR sem produto informado.'); continue; }
        const key = chaveNcr(nRaw), prod = String(pRaw).trim();
        const campos = linhaObj(row, pcols);
        stats.produtosAnalisados++;
        if(!porNcr.has(key)) porNcr.set(key, new Set());
        porNcr.get(key).add(prod);
        const pk = key + '||' + prod;
        const orfao = !d.ncrs[key];
        if(orfao) stats.produtosOrfaos++;
        let prec = d.produtos[pk];
        if(!prec){
          prec = {ncr:key, ncrId:String(nRaw).trim(), produto:prod, campos, ativo:true,
            primeiraVez:dataFoto, ultimaVez:dataFoto, orfao, arquivoOrigem:arquivoNome};
          d.produtos[pk] = prec;
          if(!idxProd.has(key)) idxProd.set(key, []);
          idxProd.get(key).push(prec);
          stats.produtosNovos++;
          if(d.ncrs[key] && d.ncrs[key].primeiraVez !== dataFoto){
            novosEventos.push(History.evento({ncr:key, data:dataFoto, tipo:'PRODUTO', campo:prodCol,
              de:null, para:prod, cls:'PRODUTO', arquivo:arquivoNome, importId, obs:'Produto vinculado'}));
          }
        } else {
          const mud = History.diff(prec.campos, campos, prodCol);
          if(mud.length){
            stats.produtosAtualizados++;
            mud.forEach(m => novosEventos.push(History.evento({ncr:key, data:dataFoto, tipo:'PRODUTO',
              campo:prod + ' · ' + m.campo, de:m.de, para:m.para, cls:'PRODUTO', arquivo:arquivoNome, importId})));
          }
          for(const c in campos) prec.campos[c] = campos[c];
          prec.ultimaVez = dataFoto; prec.orfao = orfao;
          if(!prec.ativo){ prec.ativo = true; prec.removidoEm = null; }
        }
      }
      /* remocoes: apenas para NCRs presentes na aba de produtos deste arquivo */
      porNcr.forEach((setProd, key) => {
        const lista = idxProd.get(key) || [];
        lista.forEach(p => {
          if(p.ativo !== false && !setProd.has(p.produto)){
            p.ativo = false; p.removidoEm = dataFoto;
            stats.produtosRemovidos++;
            novosEventos.push(History.evento({ncr:key, data:dataFoto, tipo:'PRODUTO', campo:'Produto removido',
              de:p.produto, para:null, cls:'PRODUTO', arquivo:arquivoNome, importId, obs:'Vínculo removido na origem'}));
          }
        });
      });
    }

    if(novosEventos.length) d.historico = d.historico.concat(novosEventos);
    stats.eventosGerados = novosEventos.length;
    return stats;
  }

  function novoStats(arq, importId){
    return {importId, arquivo:arq.name, hash:null, tamanho:arq.size, dataArquivo:arq.dataFoto,
      importadoEm:new Date().toISOString(), analisadas:0, novas:0, atualizadas:0, semAlteracao:0,
      mudancasStatus:0, retroativas:0, duplicadasNoArquivo:0,
      marcosLidos:0, ncrsReconstruidas:0, colunasMarco:0, dataFotoOrigem:'arquivo',
      movimentosReconstruidos:0,
      cls:{AVANCO:0,RETORNO:0,LATERAL:0,FECHAMENTO:0,REABERTURA:0,INDEFINIDA:0},
      produtosAnalisados:0, produtosNovos:0, produtosAtualizados:0, produtosRemovidos:0, produtosOrfaos:0,
      eventosGerados:0, erros:[], avisos:[], duracaoMs:0};
  }

  /* processa uma lista de arquivos (File + metadados) */
  async function processar(arquivos, ui){
    cancelado = false;
    const d = DB.all();
    const conhecidos = Object.keys(d.arquivos);
    const resultados = [];
    /* ordem cronologica das fotos garante historico coerente */
    const lista = arquivos.slice().sort((a,b) => (a.lastModified||0) - (b.lastModified||0));
    let backupFeito = false;

    for(let i = 0; i < lista.length; i++){
      if(cancelado) break;
      const a = lista[i];
      const t0 = performance.now();
      const dataFoto = new Date(DB.cfg().usarDataArquivo && a.lastModified ? a.lastModified : Date.now()).toISOString();
      const arqInfo = {name:a.name, size:a.size, lastModified:a.lastModified, dataFoto, hash:null};
      const stats = novoStats(arqInfo, Util.uid());
      ui && ui.arquivo(i+1, lista.length, a.name);
      try{
        if(a.error) throw new Error(a.error);
        const res = await lerArquivo(a.file || a, conhecidos, p => ui && ui.progresso(p));
        arqInfo.hash = res.hash; stats.hash = res.hash;
        if(res.skipped){
          const prev = d.arquivos[res.hash];
          stats.ignorado = true;
          stats.motivoIgnorado = 'Conteúdo idêntico a um arquivo já processado' + (prev && prev.nome !== a.name ? ' ("'+prev.nome+'")' : '');
          stats.duracaoMs = performance.now() - t0;
          resultados.push(stats);
          d.importacoes.unshift(stats);
          ui && ui.resultado(stats);
          continue;
        }
        if(!backupFeito){
          try{ const bn = await Backup.criar('antes-da-importacao'); if(bn) stats.backup = bn; }
          catch(e){ stats.avisos.push('Não foi possível criar backup automático: '+e.message); }
          backupFeito = true;
        }
        await aplicar(res, arqInfo, stats, (n, tot) => ui && ui.linhas(n, tot, stats));
        d.arquivos[res.hash] = {
          hash:res.hash, nome:a.name, caminho:a.path||a.name, tamanho:a.size,
          dataArquivo:a.lastModified ? new Date(a.lastModified).toISOString() : null,
          importadoEm:stats.importadoEm, importId:stats.importId,
          ncrs:stats.analisadas, novas:stats.novas, atualizadas:stats.atualizadas,
          erros:stats.erros.length, abaNcr:stats.abaNcr, abaProdutos:stats.abaProdutos
        };
      }catch(e){
        if(e && e.message === 'CANCELADO'){
          stats.cancelado = true; stats.duracaoMs = performance.now() - t0;
          resultados.push(stats); d.importacoes.unshift(stats); break;
        }
        stats.erros.push((e && e.message) || String(e));
        stats.falhou = true;
      }
      stats.duracaoMs = performance.now() - t0;
      resultados.push(stats);
      d.importacoes.unshift(stats);
      ui && ui.resultado(stats);
    }
    if(d.importacoes.length > 400) d.importacoes = d.importacoes.slice(0,400);
    DB.reindex();
    /* o historico capturado do sistema tem as datas exatas: prevalece sobre o
       que o Excel acabou de reconstruir ou deduzir ate a data da captura
       (inclusive para NCRs que so agora entraram no banco) */
    if(resultados.some(r => !r.ignorado && !r.falhou)){
      const rs = SistemaHist.reaplicar();
      resultados.forEach(r => { if(!r.ignorado && !r.falhou && rs.aplicadas) r.avisos.push('Histórico do sistema reaplicado em ' + rs.aplicadas + ' NCR(s).'); });
    }
    const houve = resultados.some(r => !r.ignorado && !r.falhou);
    if(houve){
      ui && ui.salvando();
      await DB.save();
    }
    return {resultados, cancelado};
  }
  function cancelar(){ cancelado = true; }
  const usandoWorker = () => workerOk === true;
  return {processar, cancelar, lerArquivo, identificar, chaveNcr, initWorker, usandoWorker, analisarPlanilha};
})();

/* ============================ Histórico do sistema (NCR Integrada) ============================
   A aba "Histórico" de cada NCR no NCR Integrada registra, com data e hora
   exatas, cada mudança de estado ("A NCR foi para o estado 6.1 - CQ") e quem a
   fez. O extrator embutido neste arquivo (script colado no Console do site)
   percorre as NCRs e gera um JSON; aqui esse JSON é guardado em
   BD/historico_sistema.json e usado para CORRIGIR a trajetória:
   - todo evento de fluxo da NCR até a data da captura (colunas datadas do
     Excel, datas estimadas, mudanças vistas entre duas fotos) é substituído
     pelas transições reais do sistema;
   - o que o Excel registrar DEPOIS da captura continua valendo;
   - visitas, contadores, "status desde" e última movimentação são
     recalculados a partir da trajetória corrigida.
   A correção é reaplicada depois de cada importação de Excel, então uma NCR
   que só entra no banco mais tarde já chega com o histórico certo.
   ============================================================================================== */
const SistemaHist = (() => {
  const FONTE = 'SISTEMA';
  const ROTULO = 'Histórico do sistema';
  const TIPO_ARQ = 'ncr-control/historico-sistema';
  const n = s => Util.norm(s || '');

  /* chave alternativa so com letras e digitos: tolera "NCR ICN ESC 14 0195 2024" x "NCR-ICN-ESC-14-0195-2024" */
  const chaveSolta = s => String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  function localizar(numero){
    const d = DB.all();
    const k = Importer.chaveNcr(numero);
    if(d.ncrs[k]) return k;
    const alvo = chaveSolta(numero);
    for(const kk in d.ncrs) if(chaveSolta(kk) === alvo) return kk;
    return k;
  }

  /* registro compacto guardado no banco: so o necessario para a trajetoria
     e para conferencia (o texto de anexos e afins fica de fora) */
  function compactar(r){
    return {numero:r.numero, sysId:r.sysId || null, url:r.url || null, capturadoEm:r.capturadoEm,
      statusAtual:r.statusAtual || null, autor:r.autor || null,
      eventos:(r.eventos || []).filter(e => e && e.data && (e.tipo === 'STATUS' || e.tipo === 'CRIACAO'))
        .map(e => ({data:e.data, usuario:e.usuario || '', de:e.statusDe || '', para:e.para || null, tipo:e.tipo})),
      outros:(r.eventos || []).filter(e => e && e.tipo !== 'STATUS' && e.tipo !== 'CRIACAO').length,
      marcos:(r.marcos || []).filter(m => m && m.data)};
  }

  /* transicoes em ordem cronologica. A pagina lista do mais novo para o mais
     antigo; no mesmo segundo, a ordem da pagina desempata (invertida). */
  function transicoes(h){
    const evs = (h.eventos || []).map((e, i) => Object.assign({i}, e))
      .sort((a, b) => Util.cmp(a.data, b.data) || (b.i - a.i));
    const out = [];
    let atual = null;
    const abertura = () => { let m = null, o = Infinity; (DB.cfg().fluxo || []).forEach(f => { if(+f.ordem < o){ o = +f.ordem; m = f.status; } }); return m; };
    evs.forEach(e => {
      if(e.tipo === 'CRIACAO'){
        if(out.length) return;
        atual = e.de || abertura();
        out.push({data:e.data, de:null, para:atual, usuario:e.usuario, criacao:true});
        return;
      }
      if(e.tipo !== 'STATUS' || !e.para) return;
      if(!out.length){
        atual = e.de || abertura();
        out.push({data:e.data, de:null, para:atual, usuario:'', criacao:false});
      }
      if(n(e.para) === n(atual)) return;          /* reenvio para o mesmo estado: nao e movimento */
      out.push({data:e.data, de:atual, para:e.para, usuario:e.usuario, deRegistrado:e.de});
      atual = e.para;
    });
    return out;
  }

  function contarMov(mov, cls){
    mov.total++;
    if(cls === 'AVANCO') mov.avancos++;
    else if(cls === 'RETORNO') mov.retornos++;
    else if(cls === 'LATERAL') mov.laterais++;
    else if(cls === 'FECHAMENTO') mov.fechamentos++;
    else if(cls === 'REABERTURA') mov.reaberturas++;
  }

  /* refaz visitas/contadores/datas da NCR a partir da trajetoria ja corrigida;
     devolve os ids de eventos redundantes (mesmo status repetido) a remover */
  function recalcular(rec, h){
    const ev = DB.eventos(rec.key).filter(Flow.isFluxoEvt);
    const drop = [];
    const visitas = {};
    const mov = {avancos:0, retornos:0, laterais:0, fechamentos:0, reaberturas:0, total:0, campos:(rec.mov && rec.mov.campos) || 0};
    let atual = null, desde = null, primeira = null, ultima = null;
    ev.forEach(e => {
      if(!e.para) return;
      if(atual && n(e.para) === n(atual)){ if(e.fonte !== FONTE) drop.push(e.id); return; }
      if(atual && desde) visitas[atual].ms += Math.max(0, new Date(e.data) - new Date(desde));
      if(atual && e.fonte !== FONTE && n(e.de) !== n(atual)){
        /* evento do Excel posterior a captura: passa a partir do estado real */
        e.de = atual; e.ordemDe = Flow.ordemInferida(atual);
        e.cls = Flow.classificar(atual, e.para);
      }
      if(!visitas[e.para]) visitas[e.para] = {n:0, ms:0};
      visitas[e.para].n++;
      if(atual) contarMov(mov, e.cls);
      atual = e.para; desde = e.data;
      if(!primeira) primeira = e.data;
      ultima = e.data;
    });
    if(!atual) return drop;
    rec.visitas = visitas;
    rec.mov = mov;
    /* o sistema e mais recente que a ultima foto do Excel: o status dele vale */
    if(h.capturadoEm >= (rec.ultimaVez || '') && n(atual) !== n(rec.status)){
      rec.status = atual; rec.ordem = Flow.ordemDe(atual); rec.fechada = Flow.isFinal(atual);
    }
    if(n(atual) === n(rec.status)) rec.statusDesde = desde;
    if(primeira && (!rec.primeiraVez || primeira < rec.primeiraVez)) rec.primeiraVez = primeira;
    let ua = ultima;
    DB.eventos(rec.key).forEach(e => { if(!Flow.isFluxoEvt(e) && e.data > h.capturadoEm && e.data > ua) ua = e.data; });
    rec.ultimaAlteracao = ua;
    delete rec.reconstruida;
    rec.sistema = {capturadoEm:h.capturadoEm, sysId:h.sysId, url:h.url, transicoes:Math.max(0, ev.length - drop.length - 1)};
    return drop;
  }

  /* aplica o historico do sistema as NCRs indicadas (todas por padrao) */
  function aplicar(keys){
    const d = DB.all();
    keys = keys || Object.keys(d.sistema);
    const alvo = new Map();
    let semNcr = 0, semTransicao = 0;
    keys.forEach(k => {
      const h = d.sistema[k], rec = d.ncrs[k];
      if(!h) return;
      if(!rec){ semNcr++; return; }
      const t = transicoes(h);
      if(!t.length){ semTransicao++; return; }
      alvo.set(k, {rec, h, t});
    });
    if(!alvo.size) return {aplicadas:0, semNcr, semTransicao, eventos:0, removidos:0, statusAtualizado:0};
    const antes = d.historico.length;
    d.historico = d.historico.filter(e => {
      const a = alvo.get(e.ncr);
      return !(a && Flow.isFluxoEvt(e) && e.data <= a.h.capturadoEm);
    });
    const removidos = antes - d.historico.length;
    const novos = [];
    alvo.forEach((a, k) => {
      a.t.forEach(t => {
        const cls = t.de == null ? 'INICIAL' : Flow.classificar(t.de, t.para);
        novos.push(History.evento({ncr:k, data:t.data, tipo:'MARCO', campo:'Status', de:t.de, para:t.para, cls,
          ordemDe: t.de == null ? null : Flow.ordemInferida(t.de), ordemPara: Flow.ordemInferida(t.para),
          arquivo:ROTULO, fonte:FONTE,
          /* o "Status:" da pagina as vezes ja mostra o estado de destino; so
             vale anotar quando ele diverge de origem e destino */
          obs: (t.usuario ? 'Por ' + t.usuario : ROTULO)
             + (t.de == null && !t.criacao ? ' · estado inicial deduzido da primeira mudança registrada' : '')
             + (t.deRegistrado && n(t.deRegistrado) !== n(t.de) && n(t.deRegistrado) !== n(t.para)
                ? ' · o sistema registra saída de "' + t.deRegistrado + '"' : '')}));
      });
    });
    d.historico = d.historico.concat(novos);
    DB.reindex();
    let drop = [], statusAtualizado = 0;
    alvo.forEach(a => {
      const st = a.rec.status;
      drop = drop.concat(recalcular(a.rec, a.h));
      if(n(st) !== n(a.rec.status)) statusAtualizado++;
    });
    if(drop.length){
      const s = new Set(drop);
      d.historico = d.historico.filter(e => !s.has(e.id));
      DB.reindex();
    }
    return {aplicadas:alvo.size, semNcr, semTransicao, eventos:novos.length, removidos: removidos + drop.length, statusAtualizado};
  }
  const reaplicar = () => aplicar();

  /* ---------- leitura do JSON gerado pelo extrator ---------- */
  function mesclar(obj){
    if(!obj || obj.tipo !== TIPO_ARQ || !Array.isArray(obj.ncrs))
      throw new Error('Este arquivo não é um histórico gerado pelo extrator do NCR Control.');
    const d = DB.all();
    const r = {lidas:obj.ncrs.length, capturadas:0, errosExtracao:0, novas:0, atualizadas:0, maisAntigas:0,
               semNumero:0, keys:[], foraDoBanco:[]};
    obj.ncrs.forEach(x => {
      if(!x || x.erro){ r.errosExtracao++; return; }
      if(!x.numero || !x.capturadoEm){ r.semNumero++; return; }
      r.capturadas++;
      const k = localizar(x.numero);
      const prev = d.sistema[k];
      if(prev && prev.capturadoEm > x.capturadoEm){ r.maisAntigas++; return; }
      d.sistema[k] = compactar(x);
      if(prev) r.atualizadas++; else r.novas++;
      r.keys.push(k);
      if(!d.ncrs[k]) r.foraDoBanco.push(x.numero);
    });
    return r;
  }

  async function importar(file){
    const texto = await file.text();
    let obj;
    try{ obj = JSON.parse(texto); }catch(e){ throw new Error('JSON inválido: ' + e.message); }
    let backup = null;
    try{ backup = await Backup.criar('antes-do-historico-do-sistema'); }catch(e){ /* segue sem backup */ }
    const r = mesclar(obj);
    const a = aplicar(r.keys);
    await DB.save();
    return Object.assign(r, {aplicacao:a, backup, origem:obj.origem, geradoEm:obj.geradoEm});
  }

  function resumo(){
    const d = DB.all();
    const ks = Object.keys(d.sistema);
    let noBanco = 0, ultima = null;
    ks.forEach(k => { if(d.ncrs[k]) noBanco++; const c = d.sistema[k].capturadoEm; if(!ultima || c > ultima) ultima = c; });
    return {total:ks.length, noBanco, fora:ks.length - noBanco, ultima, ncrs:Object.keys(d.ncrs).length};
  }
  /* NCRs capturadas que precisam de nova captura: tudo o que nao esta
     encerrado nas duas fontes com o mesmo status. Pega as abertas e tambem
     as REABERTAS depois da captura (o Excel mostra aberta, o sistema
     registrou encerrada) e qualquer divergencia entre as duas. */
  function paraRecapturar(){
    const d = DB.all();
    const out = {links:[], abertas:0, divergentes:0, semLink:0};
    Object.keys(d.sistema).forEach(k => {
      const h = d.sistema[k], rec = d.ncrs[k];
      if(!rec) return;
      const t = transicoes(h);
      const capt = h.statusAtual || (t.length ? t[t.length-1].para : '');
      const excel = rec.status || '';
      const encerradaNasDuas = Flow.isFinal(excel) && Flow.isFinal(capt) && n(excel) === n(capt);
      if(encerradaNasDuas) return;
      if(!h.url && !h.sysId){ out.semLink++; return; }
      if(n(excel) !== n(capt)) out.divergentes++; else out.abertas++;
      out.links.push(h.url || h.sysId);
    });
    return out;
  }
  const script = () => document.getElementById('extratorSrc').textContent.trim() + '\n';
  return {importar, aplicar, reaplicar, resumo, script, transicoes, paraRecapturar, FONTE, ROTULO};
})();

/* ============================ Charts (SVG proprio, sem dependencias) ============================ */
const Charts = (() => {
  const SERIES = ['var(--s1)','var(--s2)','var(--s3)','var(--s4)','var(--s5)','var(--s6)','var(--s7)','var(--s8)'];
  const STATUS = {good:'var(--good)', warning:'var(--warning)', serious:'var(--serious)', critical:'var(--critical)'};
  const SEQ = ['var(--seq-250)','var(--seq-400)','var(--seq-450,var(--seq-400))','var(--seq-550)','var(--seq-700)'];
  const registry = new Set();
  const tip = () => document.getElementById('viztip');

  function showTip(evt, html){
    const t = tip(); if(!t) return;
    t.innerHTML = html; t.style.display = 'block';
    const r = t.getBoundingClientRect();
    let x = evt.clientX + 14, y = evt.clientY + 14;
    if(x + r.width > innerWidth - 8) x = evt.clientX - r.width - 14;
    if(y + r.height > innerHeight - 8) y = evt.clientY - r.height - 14;
    t.style.left = Math.max(6,x)+'px'; t.style.top = Math.max(6,y)+'px';
  }
  function hideTip(){ const t = tip(); if(t) t.style.display = 'none'; }

  function niceMax(v){
    if(!v || v <= 0) return 1;
    const e = Math.pow(10, Math.floor(Math.log10(v)));
    const n = v/e;
    const cand = [1,1.5,2,2.5,3,4,5,6,8,10];
    for(const c of cand) if(n <= c + 1e-9) return c*e;
    return 10*e;
  }
  function ticks(max, n){
    const m = niceMax(max);
    let step = m/n;
    if(m <= 12) step = Math.max(1, Math.round(step));           /* evita rotulos repetidos */
    else if(step > 1) step = Math.round(step);
    const out = [];
    for(let v = 0; v <= m + 1e-9; v += step) out.push(Math.round(v*1000)/1000);
    if(out[out.length-1] < m) out.push(m);
    return out;
  }
  const barH = (x,y,w,h,r) => {
    r = Math.max(0, Math.min(r, w, h/2));
    if(w <= 0.5) return `M${x},${y} h0.5 v${h} h-0.5 Z`;
    return `M${x},${y} H${x+w-r} A${r},${r} 0 0 1 ${x+w},${y+r} V${y+h-r} A${r},${r} 0 0 1 ${x+w-r},${y+h} H${x} Z`;
  };
  const barV = (x,y,w,h,r) => {
    r = Math.max(0, Math.min(r, h, w/2));
    if(h <= 0.5) return `M${x},${y+h-0.5} h${w} v0.5 h-${w} Z`;
    return `M${x},${y+r} A${r},${r} 0 0 1 ${x+r},${y} H${x+w-r} A${r},${r} 0 0 1 ${x+w},${y+r} V${y+h} H${x} Z`;
  };
  function wrapSvg(w,h,inner,cls){
    return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet" class="${cls||''}" role="img">${inner}</svg>`;
  }
  function bind(host, opts){
    host.querySelectorAll('[data-tip]').forEach(el => {
      el.style.cursor = opts.onClick ? 'pointer' : 'default';
      el.addEventListener('mousemove', e => showTip(e, el.getAttribute('data-tip')));
      el.addEventListener('mouseleave', hideTip);
      if(opts.onClick) el.addEventListener('click', () => { hideTip(); opts.onClick(el.getAttribute('data-key'), el.getAttribute('data-idx')); });
    });
  }
  function register(host, fn){
    host.__render = fn;
    registry.add(host);
    fn();
  }
  function empty(host, msg){ host.innerHTML = '<div class="chart-empty">'+esc(msg||'Sem dados para exibir')+'</div>'; }
  function legendHtml(items){
    if(!items || items.length < 2) return '';
    return '<div class="legend">' + items.map(i =>
      '<span class="it"><i class="sw" style="background:'+i.color+'"></i>'+esc(i.label)+'</span>').join('') + '</div>';
  }
  function tipRow(color,label,value,extra){
    return '<div class="tt-t">'+esc(label)+'</div><div class="tt-r"><i class="sw" style="background:'+color+'"></i><span>'+
      esc(extra||'')+'</span><span class="v">'+esc(value)+'</span></div>';
  }

  /* ---------- barras horizontais (ranking de categorias) ---------- */
  function hbar(host, o){
    host.innerHTML = '';
    const data = (o.data||[]).filter(d => d && d.value != null);
    if(!data.length) return empty(host, o.emptyMsg);
    register(host, () => {
      const W = Math.max(320, host.clientWidth || 520);
      const rows = data.slice(0, o.limit || 14);
      const bh = Math.min(22, o.barH || 18), gap = 12;
      const labelW = Math.min(Math.max(90, Math.round(W*0.32)), 260);
      const padR = 58, padT = 6, padB = 20;
      const H = padT + rows.length*(bh+gap) + padB;
      const max = niceMax(Math.max.apply(null, rows.map(r => r.value)));
      const plotW = W - labelW - padR;
      let g = '';
      ticks(max,4).forEach(t => {
        const x = labelW + plotW*(t/max);
        g += `<line x1="${x}" y1="${padT}" x2="${x}" y2="${H-padB}" style="stroke:var(--grid)" stroke-width="1"/>`;
        g += `<text x="${x}" y="${H-padB+13}" text-anchor="middle" style="fill:var(--muted);font-size:10px">${Util.fNum(t)}</text>`;
      });
      rows.forEach((r,i) => {
        const y = padT + i*(bh+gap);
        const w = Math.max(0, plotW*(r.value/max));
        const color = r.color || (o.colorFn ? o.colorFn(r,i) : (o.mono ? 'var(--s1)' : SERIES[i % 8]));
        const lbl = r.label.length > 34 ? r.label.slice(0,32)+'…' : r.label;
        g += `<text x="${labelW-8}" y="${y+bh/2+4}" text-anchor="end" style="fill:var(--text-2);font-size:11.5px">${esc(lbl)}</text>`;
        g += `<path d="${barH(labelW, y, w, bh, 4)}" style="fill:${color}" data-tip="${esc(tipRow(color, r.label, Util.fNum(r.value), o.unit||''))}" data-key="${esc(r.key!=null?r.key:r.label)}" data-idx="${i}"/>`;
        g += `<text x="${labelW+w+7}" y="${y+bh/2+4}" style="fill:var(--text-2);font-size:11px;font-variant-numeric:tabular-nums">${Util.fNum(r.value)}${o.suffix||''}</text>`;
      });
      host.innerHTML = wrapSvg(W,H,g);
      bind(host,o);
    });
  }

  /* ---------- colunas verticais (series temporais / faixas) ---------- */
  function column(host, o){
    host.innerHTML = '';
    const data = (o.data||[]).filter(d => d);
    if(!data.length) return empty(host, o.emptyMsg);
    register(host, () => {
      const W = Math.max(320, host.clientWidth || 520);
      const H = o.height || 220, padL = 42, padR = 10, padT = 12, padB = data.some(d => String(d.label).length > 6) ? 46 : 28;
      const plotW = W-padL-padR, plotH = H-padT-padB;
      const max = niceMax(Math.max.apply(null, data.map(d => d.value||0)) || 1);
      const bw = Math.min(o.barW || 26, plotW/data.length - 6);
      let g = '';
      ticks(max,4).forEach(t => {
        const y = padT + plotH*(1-t/max);
        g += `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" style="stroke:var(--grid)" stroke-width="1"/>`;
        g += `<text x="${padL-7}" y="${y+3.5}" text-anchor="end" style="fill:var(--muted);font-size:10px">${Util.fNum(t)}</text>`;
      });
      const step = plotW/data.length;
      data.forEach((d,i) => {
        const h = plotH*((d.value||0)/max);
        const x = padL + step*i + (step-bw)/2;
        const y = padT + plotH - h;
        const color = d.color || (o.colorFn ? o.colorFn(d,i) : 'var(--s1)');
        g += `<path d="${barV(x,y,bw,h,4)}" style="fill:${color}" data-tip="${esc(tipRow(color, d.label, Util.fNum(d.value), o.unit||''))}" data-key="${esc(d.key!=null?d.key:d.label)}" data-idx="${i}"/>`;
        if(o.labelValues !== false && h > 16)
          g += `<text x="${x+bw/2}" y="${y-5}" text-anchor="middle" style="fill:var(--text-2);font-size:10.5px;font-variant-numeric:tabular-nums">${Util.fNum(d.value)}</text>`;
        const lt = String(d.label);
        const short = lt.length > 18 ? lt.slice(0,17)+'…' : lt;
        const rot = padB > 30;
        g += rot
          ? `<text x="${x+bw/2}" y="${H-padB+14}" text-anchor="end" transform="rotate(-35 ${x+bw/2} ${H-padB+14})" style="fill:var(--muted);font-size:10px">${esc(short)}</text>`
          : `<text x="${x+bw/2}" y="${H-padB+14}" text-anchor="middle" style="fill:var(--muted);font-size:10px">${esc(short)}</text>`;
      });
      g += `<line x1="${padL}" y1="${padT+plotH}" x2="${W-padR}" y2="${padT+plotH}" style="stroke:var(--axis)" stroke-width="1"/>`;
      host.innerHTML = wrapSvg(W,H,g);
      bind(host,o);
    });
  }

  /* ---------- colunas empilhadas ---------- */
  function stacked(host, o){
    host.innerHTML = '';
    const cats = o.categories||[], series = o.series||[];
    if(!cats.length || !series.length) return empty(host, o.emptyMsg);
    register(host, () => {
      const W = Math.max(320, host.clientWidth || 520);
      const H = o.height || 240, padL = 42, padR = 10, padT = 12, padB = 46;
      const plotW = W-padL-padR, plotH = H-padT-padB;
      const totals = cats.map((c,i) => series.reduce((s,se) => s+(se.values[i]||0), 0));
      const max = niceMax(Math.max.apply(null, totals) || 1);
      const step = plotW/cats.length, bw = Math.min(o.barW||30, step-8);
      let g = '';
      ticks(max,4).forEach(t => {
        const y = padT + plotH*(1-t/max);
        g += `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" style="stroke:var(--grid)" stroke-width="1"/>`;
        g += `<text x="${padL-7}" y="${y+3.5}" text-anchor="end" style="fill:var(--muted);font-size:10px">${Util.fNum(t)}</text>`;
      });
      cats.forEach((c,i) => {
        let acc = 0;
        const x = padL + step*i + (step-bw)/2;
        series.forEach((se,si) => {
          const v = se.values[i]||0;
          if(!v) return;
          const h = plotH*(v/max) - 2;
          const y = padT + plotH - plotH*((acc+v)/max);
          const color = se.color || SERIES[si%8];
          const top = acc+v >= totals[i]-0.001;
          g += `<path d="${top ? barV(x,y,bw,Math.max(h,1),4) : `M${x},${y} h${bw} v${Math.max(h,1)} h-${bw} Z`}" style="fill:${color}" data-tip="${esc(tipRow(color, c+' · '+se.name, Util.fNum(v)))}" data-key="${esc(c)}" data-idx="${i}"/>`;
          acc += v;
        });
        const lt = String(c), short = lt.length > 14 ? lt.slice(0,13)+'…' : lt;
        g += `<text x="${x+bw/2}" y="${H-padB+14}" text-anchor="end" transform="rotate(-35 ${x+bw/2} ${H-padB+14})" style="fill:var(--muted);font-size:10px">${esc(short)}</text>`;
      });
      g += `<line x1="${padL}" y1="${padT+plotH}" x2="${W-padR}" y2="${padT+plotH}" style="stroke:var(--axis)" stroke-width="1"/>`;
      host.innerHTML = wrapSvg(W,H,g) + legendHtml(series.map((s,i) => ({label:s.name, color:s.color||SERIES[i%8]})));
      bind(host,o);
    });
  }

  /* ---------- rosca (apenas para 2 a 4 categorias) ---------- */
  function donut(host, o){
    host.innerHTML = '';
    const data = (o.data||[]).filter(d => d && d.value > 0);
    if(!data.length) return empty(host, o.emptyMsg);
    register(host, () => {
      const W = Math.max(220, host.clientWidth || 300);
      const H = o.height || 190;
      const cx = W/2, cy = H/2, R = Math.min(W,H)/2 - 8, r = R*0.62;
      const total = data.reduce((s,d) => s+d.value, 0);
      let a0 = -Math.PI/2, g = '';
      data.forEach((d,i) => {
        const frac = d.value/total, a1 = a0 + frac*Math.PI*2;
        const color = d.color || SERIES[i%8];
        const large = frac > 0.5 ? 1 : 0;
        const p = frac >= 0.9999
          ? `M${cx},${cy-R} A${R},${R} 0 1 1 ${cx-0.01},${cy-R} L${cx-0.01},${cy-r} A${r},${r} 0 1 0 ${cx},${cy-r} Z`
          : `M${cx+R*Math.cos(a0)},${cy+R*Math.sin(a0)} A${R},${R} 0 ${large} 1 ${cx+R*Math.cos(a1)},${cy+R*Math.sin(a1)} L${cx+r*Math.cos(a1)},${cy+r*Math.sin(a1)} A${r},${r} 0 ${large} 0 ${cx+r*Math.cos(a0)},${cy+r*Math.sin(a0)} Z`;
        g += `<path d="${p}" style="fill:${color};stroke:var(--surface);stroke-width:2" data-tip="${esc(tipRow(color, d.label, Util.fNum(d.value)+' ('+Util.pct(d.value,total)+'%)'))}" data-key="${esc(d.key!=null?d.key:d.label)}"/>`;
        a0 = a1;
      });
      const cv = o.centerValue != null ? o.centerValue : Util.fNum(total);
      g += `<text x="${cx}" y="${cy+2}" text-anchor="middle" style="fill:var(--text);font-size:22px;font-weight:600">${esc(String(cv))}</text>`;
      if(o.centerLabel) g += `<text x="${cx}" y="${cy+19}" text-anchor="middle" style="fill:var(--muted);font-size:10.5px">${esc(o.centerLabel)}</text>`;
      host.innerHTML = wrapSvg(W,H,g) + legendHtml(data.map((d,i) => ({label:d.label+' · '+Util.fNum(d.value), color:d.color||SERIES[i%8]})));
      bind(host,o);
    });
  }

  /* ---------- linha temporal ---------- */
  function line(host, o){
    host.innerHTML = '';
    const cats = o.categories||[], series = o.series||[];
    if(cats.length < 2 || !series.length) return empty(host, o.emptyMsg);
    register(host, () => {
      const W = Math.max(320, host.clientWidth || 520);
      const H = o.height || 230, padL = 44, padR = 16, padT = 14, padB = 40;
      const plotW = W-padL-padR, plotH = H-padT-padB;
      let max = 0;
      series.forEach(s => s.values.forEach(v => { if(v > max) max = v; }));
      max = niceMax(max || 1);
      const X = i => padL + (cats.length === 1 ? plotW/2 : plotW*(i/(cats.length-1)));
      const Y = v => padT + plotH*(1-(v||0)/max);
      let g = '';
      ticks(max,4).forEach(t => {
        const y = Y(t);
        g += `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" style="stroke:var(--grid)" stroke-width="1"/>`;
        g += `<text x="${padL-7}" y="${y+3.5}" text-anchor="end" style="fill:var(--muted);font-size:10px">${Util.fNum(t)}</text>`;
      });
      const stepLbl = Math.ceil(cats.length/Math.max(3,Math.floor(plotW/62)));
      cats.forEach((c,i) => {
        if(i % stepLbl && i !== cats.length-1) return;
        g += `<text x="${X(i)}" y="${H-padB+15}" text-anchor="middle" style="fill:var(--muted);font-size:10px">${esc(String(c))}</text>`;
      });
      series.forEach((s,si) => {
        const color = s.color || SERIES[si%8];
        const pts = s.values.map((v,i) => X(i)+','+Y(v));
        if(o.area !== false && series.length === 1){
          g += `<path d="M${X(0)},${padT+plotH} L${pts.join(' L')} L${X(cats.length-1)},${padT+plotH} Z" style="fill:${color};opacity:.10"/>`;
        }
        g += `<path d="M${pts.join(' L')}" fill="none" style="stroke:${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
        s.values.forEach((v,i) => {
          if(cats.length > 26 && i !== s.values.length-1) return;
          g += `<circle cx="${X(i)}" cy="${Y(v)}" r="4" style="fill:${color};stroke:var(--surface)" stroke-width="2"/>`;
        });
        const lastV = s.values[s.values.length-1];
        if(o.labelEnd !== false)
          g += `<text x="${X(cats.length-1)}" y="${Y(lastV)-10}" text-anchor="end" style="fill:var(--text-2);font-size:10.5px;font-variant-numeric:tabular-nums">${Util.fNum(lastV)}</text>`;
      });
      /* camada de hover com crosshair */
      const band = plotW/Math.max(1,cats.length-1);
      cats.forEach((c,i) => {
        const rows = series.map((s,si) => `<div class="tt-r"><i class="sw" style="background:${s.color||SERIES[si%8]}"></i><span>${esc(s.name)}</span><span class="v">${Util.fNum(s.values[i])}</span></div>`).join('');
        g += `<rect x="${X(i)-band/2}" y="${padT}" width="${band}" height="${plotH}" fill="transparent" data-tip="${esc('<div class=\"tt-t\">'+esc(String(c))+'</div>'+rows)}" data-key="${esc(String(c))}" data-idx="${i}"/>`;
      });
      g += `<line x1="${padL}" y1="${padT+plotH}" x2="${W-padR}" y2="${padT+plotH}" style="stroke:var(--axis)" stroke-width="1"/>`;
      host.innerHTML = wrapSvg(W,H,g) + legendHtml(series.map((s,i) => ({label:s.name, color:s.color||SERIES[i%8]})));
      bind(host,o);
    });
  }

  /* ---------- sparkline para tiles ---------- */
  function spark(values, color, w, h){
    if(!values || values.length < 2) return '';
    w = w||90; h = h||30;
    let max = Math.max.apply(null, values), min = Math.min.apply(null, values);
    if(max === min) max = min+1;
    const pts = values.map((v,i) => (w*(i/(values.length-1)))+','+(h-2-(h-4)*((v-min)/(max-min))));
    return `<svg class="spark" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}"><path d="M${pts.join(' L')}" fill="none" style="stroke:${color||'var(--s1)'};opacity:.75" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  }
  const redrawAll = Util.debounce(() => {
    registry.forEach(h => {
      if(!document.body.contains(h)){ registry.delete(h); return; }
      if(h.offsetParent === null) return;
      try{ h.__render(); }catch(e){}
    });
  }, 180);
  window.addEventListener('resize', redrawAll);
  return {hbar, column, stacked, donut, line, spark, SERIES, STATUS, SEQ, redrawAll, hideTip, niceMax};
})();

/* ============================ Metrics ============================ */
const Metrics = (() => {
  function faixa(dias){
    const fx = DB.cfg().agingFaixas || [];
    if(dias == null) return 'Sem data';
    for(const f of fx){
      if(dias >= f.min && (f.max == null || dias <= f.max)) return f.lbl;
    }
    return fx.length ? fx[fx.length-1].lbl : '—';
  }
  function derive(rec){
    const hoje = Date.now();
    const diasStatus = Util.days(rec.statusDesde || rec.primeiraVez);
    const diasMov = Util.days(rec.ultimaAlteracao || rec.primeiraVez);
    const idade = Util.days(rec.criadoEm || rec.primeiraVez);
    const acomp = Util.days(rec.primeiraVez);
    return {
      diasStatus, diasMov, idade, acomp,
      aberto: !rec.fechada,
