/* ============================ Arquivos processados / backups ============================ */
const Arq = (() => {
  let cacheExcel = null;
  function render(host){
    const arq = DB.all().arquivos;
    const lista = Object.keys(arq).map(h => arq[h]).sort((a,b) => Util.cmp(b.importadoEm, a.importadoEm));
    host.innerHTML = `
      <div class="grid g2" style="margin-bottom:14px">
        ${card('Arquivos Excel encontrados na pasta','identificação por hash SHA-256',
          '<div id="excelList">'+(Store.info().mode === 'fs' ? '<div class="muted small">Clique em <b>Verificar pasta</b> para varrer os arquivos.</div>' :
            '<div class="note warn small">Modo de armazenamento do navegador: os arquivos Excel são escolhidos manualmente a cada atualização.</div>')+'</div>',
          '<button class="btn sm" id="aScan">Verificar pasta</button>')}
        ${card('Backups do banco','política de retenção: '+(DB.cfg().retencaoBackups||10)+' mais recentes','<div id="bkList" class="muted small">Carregando...</div>',
          '<button class="btn sm" id="bkNew">Criar backup agora</button>')}
      </div>
      ${card('Arquivos já processados', Util.fNum(lista.length)+' registros',
        !lista.length ? semDados('Nenhum arquivo processado ainda') :
        `<div class="tbl-wrap" style="max-height:440px"><table class="tbl"><thead><tr>
          <th>Nome</th><th>Hash SHA-256</th><th class="num">Tamanho</th><th>Data do arquivo</th><th>Importado em</th>
          <th class="num">NCRs</th><th class="num">Novas</th><th class="num">Atualizadas</th><th class="num">Erros</th><th></th></tr></thead><tbody>
          ${lista.map(a => `<tr><td title="${esc(a.caminho||a.nome)}"><b>${esc(a.nome)}</b><div class="small muted">${esc(a.caminho||'')}</div></td>
            <td class="mono small" title="${esc(a.hash)}">${esc(a.hash.slice(0,20))}…</td>
            <td class="num">${Util.fBytes(a.tamanho)}</td><td class="small">${Util.fDateTime(a.dataArquivo)}</td>
            <td class="small">${Util.fDateTime(a.importadoEm)}</td><td class="num">${Util.fNum(a.ncrs)}</td>
            <td class="num">${Util.fNum(a.novas)}</td><td class="num">${Util.fNum(a.atualizadas)}</td>
            <td class="num">${a.erros?'<span class="badge warn">'+a.erros+'</span>':'0'}</td>
            <td><button class="btn sm danger" data-esq="${esc(a.hash)}" title="Permite reprocessar este arquivo">Esquecer</button></td></tr>`).join('')}
        </tbody></table></div>`)}`;
    $('#aScan', host).onclick = () => scan(host);
    $('#bkNew', host).onclick = async () => {
      try{ const n = await Backup.criar('manual'); Util.toast(n ? 'Backup criado: '+n : 'Nada a salvar ainda.', 'ok'); listarBackups(); }
      catch(e){ Util.toast(e.message,'err','Backup'); }
    };
    $$('[data-esq]', host).forEach(b => b.onclick = async () => {
      const ok = await UI.confirmar('Esquecer arquivo', 'O arquivo deixará de ser reconhecido como processado e poderá ser importado novamente.<br>O banco atual <b>não</b> será alterado.', 'Esquecer', true);
      if(!ok) return;
      delete DB.all().arquivos[b.dataset.esq];
      await DB.save(['arquivos']);
      UI.render('arquivos');
    });
    listarBackups();
    if(cacheExcel) mostrarExcel(cacheExcel);
  }
  async function scan(host){
    const el = $('#excelList');
    el.innerHTML = '<div class="muted small"><span class="spin"></span> Varrendo pasta...</div>';
    try{
      const arqs = await Store.listExcel();
      cacheExcel = arqs;
      mostrarExcel(arqs);
    }catch(e){ el.innerHTML = '<div class="note err small">'+esc(e.message)+'</div>'; }
  }
  function mostrarExcel(arqs){
    const el = $('#excelList');
    if(!el) return;
    if(!arqs.length){ el.innerHTML = '<div class="muted small">Nenhum arquivo .xlsx encontrado na pasta de trabalho nem em <code>imports/</code>.</div>'; return; }
    const proc = DB.all().arquivos;
    const porNome = {};
    Object.keys(proc).forEach(h => { const a = proc[h]; (porNome[a.nome] = porNome[a.nome] || []).push(a); });
    el.innerHTML = '<table class="tbl"><thead><tr><th>Arquivo</th><th class="num">Tamanho</th><th>Modificado</th><th>Situação</th></tr></thead><tbody>'
      + arqs.map(a => {
        const antes = porNome[a.name];
        let sit;
        if(a.error) sit = '<span class="badge crit">'+esc(a.error)+'</span>';
        else if(!antes) sit = '<span class="badge new">Novo — será processado</span>';
        else{
          const mesmo = antes.find(x => x.tamanho === a.size && x.dataArquivo && Math.abs(new Date(x.dataArquivo)-a.lastModified) < 2000);
          sit = mesmo ? '<span class="badge ord">Provavelmente já processado</span>'
                      : '<span class="badge warn">Mesmo nome, conteúdo diferente — será reprocessado</span>';
        }
        return `<tr><td><b>${esc(a.path||a.name)}</b></td><td class="num">${Util.fBytes(a.size)}</td>
          <td class="small">${a.lastModified?Util.fDateTime(new Date(a.lastModified).toISOString()):'—'}</td><td>${sit}</td></tr>`;
      }).join('') + '</tbody></table><div class="small muted" style="margin-top:8px">A confirmação definitiva é feita pelo hash SHA-256 do conteúdo durante a atualização.</div>';
  }
  async function listarBackups(){
    const el = $('#bkList');
    if(!el) return;
    try{
      const list = await Backup.listar();
      if(!list.length){ el.innerHTML = '<div class="muted small">Nenhum backup criado ainda. Um backup é gerado automaticamente antes de cada importação.</div>'; return; }
      el.innerHTML = '<table class="tbl"><thead><tr><th>Arquivo</th><th class="num">Tamanho</th><th></th></tr></thead><tbody>'
        + list.map(b => `<tr><td class="mono small">${esc(b.name)}</td><td class="num">${Util.fBytes(b.size)}</td>
            <td class="nowrap"><button class="btn sm" data-rest="${esc(b.name)}">Restaurar</button>
            <button class="btn sm ghost" data-dl="${esc(b.name)}">Baixar</button></td></tr>`).join('')
        + '</tbody></table>';
      $$('[data-rest]', el).forEach(b => b.onclick = async () => {
        const ok = await UI.confirmar('Restaurar backup',
          'O banco atual será substituído pelo conteúdo de <b>'+esc(b.dataset.rest)+'</b>.<br>Um backup do estado atual será criado antes.', 'Restaurar', true);
        if(!ok) return;
        try{
          UI.busy.show('Restaurando backup...','Validando e gravando');
          const c = await Backup.restaurar(b.dataset.rest);
          UI.busy.hide();
          Util.toast('Banco restaurado: '+Util.fNum(c.ncrs)+' NCRs.','ok');
          UI.refresh();
        }catch(e){ UI.busy.hide(); Util.toast(e.message,'err','Restauração'); }
      });
      $$('[data-dl]', el).forEach(b => b.onclick = async () => {
        const snap = await Store.readBackup(b.dataset.dl);
        Util.download(b.dataset.dl, JSON.stringify(snap, null, 1));
      });
    }catch(e){ el.innerHTML = '<div class="note err small">'+esc(e.message)+'</div>'; }
  }
  return {render};
})();

      cfg.porPagina = Math.max(10, +g('pPag').value||50);
      cfg.retencaoBackups = Math.max(1, +g('pBk').value||10);
      cfg.usarDataArquivo = g('pData').value === '1';
      cfg.pastaImports = g('pImports').value.trim() || 'imports';
      UI.tema(g('pTema').value);
      salvarCfg('Preferências salvas.');
    };
    /* fluxo */
    $$('[data-add]', host).forEach(b => b.onclick = () => {
      const s = b.dataset.add;
      const ordens = cfg.fluxo.map(f => f.ordem);
      cfg.fluxo.push({ordem: Math.max.apply(null, ordens.concat([0]))||1, status:s});
      salvarCfg('Status "'+s+'" adicionado ao fluxo. Ajuste a ordem se necessário.').then(() => UI.render('config'));
    });
    const bodyF = $('#fluxoBody', host);
    if(bodyF){
      $$('[data-del]', bodyF).forEach(b => b.onclick = () => { b.closest('tr').remove(); });
      g('fAdd').onclick = () => {
        const tr = document.createElement('tr');
        const i = $$('tr', bodyF).length;
        tr.innerHTML = `<td><input type="number" min="1" value="1" data-f="ordem" data-i="${i}" style="width:70px"></td>
          <td><input type="text" value="" data-f="status" data-i="${i}" placeholder="Nome exato do status"></td>
          <td class="small muted">—</td><td><label class="ms-opt"><input type="checkbox" data-f="final" data-i="${i}"><span class="small">encerrada</span></label></td>
          <td><button class="btn sm ghost">✕</button></td>`;
        bodyF.appendChild(tr);
        $('button', tr).onclick = () => tr.remove();
      };
      g('fSalvar').onclick = () => {
        const novo = [], finais = [];
        $$('tr', bodyF).forEach(tr => {
          const o = $('[data-f=ordem]', tr), s = $('[data-f=status]', tr), f = $('[data-f=final]', tr);
          const status = s.value.trim();
          if(!status) return;
          novo.push({ordem: Math.max(1, +o.value||1), status});
          if(f.checked) finais.push(status);
        });
        if(!novo.length){ Util.toast('O fluxo precisa de ao menos um status.','warn'); return; }
        cfg.fluxo = novo.sort((a,b) => a.ordem-b.ordem || Util.cmp(a.status,b.status));
        cfg.statusFinais = finais;
        recalcularFechadas();
        salvarCfg('Fluxo salvo com '+novo.length+' status.').then(() => UI.render('config'));
      };
      g('fReset').onclick = async () => {
        if(!await UI.confirmar('Restaurar fluxo padrão','O fluxo voltará à configuração original de 22 status. O histórico é preservado.','Restaurar')) return;
        cfg.fluxo = Util.clone(Cfg.FLUXO_PADRAO);
        cfg.statusFinais = Cfg.PADRAO.statusFinais.slice();
        recalcularFechadas();
        salvarCfg('Fluxo padrão restaurado.').then(() => UI.render('config'));
      };
    }
    /* aging */
    const bodyA = $('#agBody', host);
    if(bodyA){
      $$('[data-adel]', bodyA).forEach(b => b.onclick = () => b.closest('tr').remove());
      g('agAdd').onclick = () => {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td><input type="text" value="Nova faixa" data-a="lbl"></td><td><input type="number" value="0" data-a="min"></td>
          <td><input type="number" value="" placeholder="sem limite" data-a="max"></td><td><button class="btn sm ghost">✕</button></td>`;
        bodyA.appendChild(tr); $('button', tr).onclick = () => tr.remove();
      };
      g('agSalvar').onclick = () => {
        const novo = [];
        $$('tr', bodyA).forEach(tr => {
          const lbl = $('[data-a=lbl]', tr).value.trim();
          const min = +$('[data-a=min]', tr).value||0;
          const maxv = $('[data-a=max]', tr).value;
          if(!lbl) return;
          novo.push({lbl, min, max: maxv === '' ? null : +maxv});
        });
        if(!novo.length){ Util.toast('Defina ao menos uma faixa.','warn'); return; }
        cfg.agingFaixas = novo.sort((a,b) => a.min-b.min);
        salvarCfg('Faixas de aging salvas.');
      };
    }
    /* campos */
    if(g('cmSalvar')){
      g('cmSalvar').onclick = () => {
        const todos = DB.campos();
        const marcados = new Set($$('#campoList input:checked', host).map(i => i.value));
        cfg.camposIgnorados = todos.filter(c => !marcados.has(c));
        salvarCfg('Campos monitorados atualizados.');
      };
      g('cmAll').onclick = () => $$('#campoList input', host).forEach(i => i.checked = true);
      g('cmNone').onclick = () => $$('#campoList input', host).forEach(i => i.checked = false);
    }
    /* manutencao */
    g('mExp').onclick = () => Util.download('NCR_banco_'+Util.stamp()+'.json', JSON.stringify(DB.snapshot()));
    g('mImp').onclick = async () => {
      const inp = document.createElement('input');
      inp.type = 'file'; inp.accept = '.json';
      inp.onchange = async () => {
        const f = inp.files[0];
        if(!f) return;
        try{
          const snap = JSON.parse(await f.text());
          if(!await UI.confirmar('Importar banco','O banco atual será substituído pelo conteúdo de <b>'+esc(f.name)+'</b>. Um backup será criado antes.','Importar', true)) return;
          await Backup.criar('antes-da-importacao-manual');
          DB.importarSnapshot(snap);
          await DB.save();
          Filters.invalidateFacets(); UI.refresh();
          Util.toast('Banco importado: '+Util.fNum(DB.contagem().ncrs)+' NCRs.','ok');
        }catch(e){ Util.toast('Arquivo inválido: '+e.message,'err'); }
      };
      inp.click();
    };
    g('mReidx').onclick = () => { DB.reindex(); Filters.invalidateFacets(); UI.refresh(); Util.toast('Índices reconstruídos.','ok'); };
    g('mRecalc').onclick = async () => {
      let n = 0;
      DB.all().historico.forEach(e => {
        if(e.tipo !== 'STATUS') return;
        const novo = Flow.classificar(e.de, e.para);
        if(novo !== e.cls){ e.cls = novo; e.ordemDe = Flow.ordemDe(e.de); e.ordemPara = Flow.ordemDe(e.para); n++; }
      });
      recalcularContadores();
      await DB.save(['ncr','historico']);
      DB.reindex(); UI.refresh();
      Util.toast(n+' eventos reclassificados conforme o fluxo atual.','ok');
    };
    g('mLimpar').onclick = async () => {
      if(!await UI.confirmar('Limpar banco de dados','Todas as NCRs, produtos, histórico e registros de arquivos serão apagados.<br>Um backup será criado antes e a configuração será mantida.','Apagar tudo', true)) return;
      try{
        await Backup.criar('antes-da-limpeza');
        DB.limpar();
        await DB.save();
        Filters.reset(); Filters.invalidateFacets(); UI.refresh();
        Util.toast('Banco limpo. Os backups continuam disponíveis.','ok');
      }catch(e){ Util.toast(e.message,'err'); }
    };
  }
  function recalcularFechadas(){
    const d = DB.all();
    for(const k in d.ncrs){
      const n = d.ncrs[k];
      n.ordem = Flow.ordemDe(n.status);
      n.fechada = Flow.isFinal(n.status);
    }
  }
  function recalcularContadores(){
    const d = DB.all();
    for(const k in d.ncrs){
      const n = d.ncrs[k];
      const mov = {avancos:0, retornos:0, laterais:0, fechamentos:0, reaberturas:0, total:0, campos:(n.mov&&n.mov.campos)||0};
      DB.eventos(k).forEach(e => {
        if(e.tipo !== 'STATUS') return;
        mov.total++;
        if(e.cls === 'AVANCO') mov.avancos++;
        else if(e.cls === 'RETORNO') mov.retornos++;
        else if(e.cls === 'LATERAL') mov.laterais++;
        else if(e.cls === 'FECHAMENTO') mov.fechamentos++;
        else if(e.cls === 'REABERTURA') mov.reaberturas++;
      });
      n.mov = mov;
      n.ordem = Flow.ordemDe(n.status);
      n.fechada = Flow.isFinal(n.status);
    }
  }
  return {render};
})();

/* ============================ Ajuda ============================ */
function ajuda(){
  UI.modal({size:'md', title:'Como o NCR Control funciona', sub:'Guia rápido',
    body:`
    <div class="vstack">
      ${card('1. Pasta de trabalho','',`<p class="small">Clique em <b>Selecionar Pasta de Trabalho</b> (Chrome/Edge). O sistema cria dentro dela:</p>
        <pre class="log">/sua-pasta
├── NCR_Control.html
├── BD/
│   ├── ncr.json            (NCRs e estado atual)
│   ├── produtos.json       (vínculos NCR × produto)
│   ├── historico.json      (eventos de alteração)
│   ├── arquivos_processados.json
│   ├── importacoes.json
│   ├── configuracao.json
│   └── backups/
└── imports/                (coloque aqui os .xlsx)</pre>`)}
      ${card('2. Atualização do banco','',`<p class="small">Clique em <b>Atualizar Banco de Dados</b>. O sistema varre a pasta e <code>imports/</code>, calcula o <b>hash SHA-256</b> de cada arquivo e:</p>
        <ul class="small"><li>arquivo <b>idêntico</b> a um já processado → ignorado;</li>
        <li>mesmo nome mas conteúdo diferente → tratado como <b>nova versão</b>;</li>
        <li>arquivo novo → processado integralmente.</li></ul>
        <p class="small">O nome do arquivo nunca é usado como critério.</p>`)}
      ${card('3. Histórico incremental','',`<p class="small">Cada Excel é uma <b>fotografia</b> do estado atual. Na primeira vez em que uma NCR aparece, registra-se o
        <b>Estado inicial conhecido</b>. Nas importações seguintes, o sistema compara campo a campo e registra <b>apenas o que mudou</b>.
        Uma importação sem mudanças não gera eventos.</p>`)}
      ${card('4. Classificação das movimentações','',`<div class="small">
        <div class="kv"><span><span class="mv mv-AVANCO">↑ Avanço</span></span><span>ordem do fluxo aumenta (ex.: 2 → 3)</span></div>
        <div class="kv"><span><span class="mv mv-RETORNO">↩ Retorno</span></span><span>ordem do fluxo diminui (ex.: 5 → 3)</span></div>
        <div class="kv"><span><span class="mv mv-LATERAL">→ Lateral</span></span><span>status diferente na mesma ordem (ex.: 6.1 - PCP → 6.1 - PROD EXEC)</span></div>
        <div class="kv"><span><span class="mv mv-FECHAMENTO">✔ Fechamento</span></span><span>status final (CEDOC Closure, Closed...)</span></div>
        <div class="kv"><span><span class="mv mv-REABERTURA">⟲ Reabertura</span></span><span>NCR fechada volta a um status ativo</span></div>
        <div class="kv"><span><span class="mv mv-INICIAL">• Permanência</span></span><span>sem alteração — não gera evento</span></div></div>`)}
      ${card('5. Segurança dos dados','',`<ul class="small">
        <li>backup automático antes de cada importação (<code>BD/backups/</code>);</li>
        <li>gravação em duas etapas com verificação de leitura antes de confirmar;</li>
        <li>recuperação automática a partir do último backup se um JSON estiver corrompido;</li>
        <li>política de retenção configurável.</li></ul>`)}
      ${card('Atalhos','',`<div class="small"><div class="kv"><span><b>Ctrl + U</b></span><span>Atualizar banco de dados</span></div>
        <div class="kv"><span><b>Ctrl + K</b></span><span>Ir para a busca global</span></div>
        <div class="kv"><span><b>Esc</b></span><span>Fechar janela</span></div></div>`)}
    </div>`});
}

/* ============================ Boot ============================ */
(async function boot(){
  /* tema salvo */
  let tema = 'light';
  try{ tema = localStorage.getItem('ncr_tema') || 'light'; }catch(e){}
  document.documentElement.setAttribute('data-theme', tema);

  UI.montarNav();
  $('#app').hidden = false;

  /* eventos globais */
  $('#btnUpdate').onclick = () => UI.atualizarBanco();
  $('#btnTheme').onclick = () => UI.toggleTema();
  $('#btnHelp').onclick = ajuda;
  $('#modalClose').onclick = UI.fecharModal;
  $('#modalBg').onclick = e => { if(e.target === $('#modalBg')) UI.fecharModal(); };
  $('#btnCancelImport').onclick = () => { Importer.cancelar(); Util.toast('Cancelamento solicitado — concluindo o arquivo atual...','warn'); };
  $('#btnCollapse').onclick = () => {
    const app = $('#app');
    app.classList.toggle('collapsed');
    $('#btnCollapse').textContent = app.classList.contains('collapsed') ? '»' : '« Recolher';
    setTimeout(Charts.redrawAll, 220);
  };
  $('#globalSearch').oninput = Util.debounce(e => {
    Filters.state.texto = e.target.value.trim();
    Filters.invalidate();
    if(UI.atual !== 'ncrs' && Filters.state.texto) UI.ir('ncrs'); else UI.refresh();
  }, 320);
  document.addEventListener('keydown', e => {
    if(e.key === 'Escape'){ UI.fecharModal(); $('#overlay').classList.remove('show'); }
    if((e.ctrlKey||e.metaKey) && e.key.toLowerCase() === 'k'){ e.preventDefault(); $('#globalSearch').focus(); $('#globalSearch').select(); }
    if((e.ctrlKey||e.metaKey) && e.key.toLowerCase() === 'u'){ e.preventDefault(); UI.atualizarBanco(); }
  });
  window.addEventListener('error', ev => {
    if(ev.message && /ResizeObserver/.test(ev.message)) return;
    Util.toast(String(ev.message||'Erro inesperado'), 'err', 'Erro na aplicação');
  });
  window.addEventListener('unhandledrejection', ev => {
    const m = ev.reason && ev.reason.message ? ev.reason.message : String(ev.reason);
    if(/AbortError|user aborted|The user aborted a request/i.test(m)) return;
    Util.toast(m, 'err', 'Operação não concluída');
  });

  /* inicia o motor de leitura em segundo plano */
  Importer.initWorker();

  /* tenta reconectar a pasta usada na última sessão */
  let restaurado = false;
  try{ restaurado = await Store.tryRestore(); }catch(e){}
  if(restaurado === true){
    await DB.load();
    UI.tema(DB.cfg().tema || tema);
    Filters.invalidateFacets();
    UI.atualizarBadges();
    UI.render('dashboard');
    if(!DB.contagem().ncrs) UI.telaInicial();
    else Util.toast('Pasta reconectada: '+Store.info().folder, 'ok');
    return;
  }
  if(restaurado === 'prompt'){
    UI.atualizarBadges();
    UI.render('dashboard');
    const body = `<div class="note" style="margin-bottom:14px"><b>Autorização necessária.</b><br>
      Por segurança, o navegador precisa que você confirme novamente o acesso à pasta
      <b>${esc(Store.info().folder)}</b> usada na sessão anterior. Nenhum dado foi perdido.</div>
      <div class="hstack"><button class="btn primary" id="reAuth">Reconectar pasta</button>
      <button class="btn" id="reOther">Escolher outra pasta</button>
      <button class="btn ghost" id="reLocal">Trabalhar sem pasta</button></div>`;
    UI.modal({size:'sm', title:'Reconectar pasta de trabalho', body, footer:''});
    $('#reAuth').onclick = async () => {
      try{
        const ok = await Store.grantPending();
        if(!ok){ Util.toast('Autorização negada.','warn'); return; }
        UI.fecharModal();
        await UI.recarregar();
        UI.tema(DB.cfg().tema || tema);
        Util.toast('Pasta reconectada. Banco carregado com '+Util.fNum(DB.contagem().ncrs)+' NCRs.','ok');
      }catch(e){ Util.toast(e.message,'err'); }
    };
    $('#reOther').onclick = async () => {
      try{ await Store.pickFolder(); UI.fecharModal(); await UI.recarregar(); Util.toast('Pasta conectada.','ok'); }
      catch(e){ if(e.name !== 'AbortError') Util.toast(e.message,'err'); }
    };
    $('#reLocal').onclick = async () => { Store.useLocal(); UI.fecharModal(); await UI.recarregar(); };
    return;
  }
  /* sem pasta: tenta o armazenamento interno; se houver banco, usa-o */
  if(Idb.available()){
    Store.useLocal();
    try{
      await DB.load();
      if(DB.contagem().ncrs){
        UI.tema(DB.cfg().tema || tema);
        Filters.invalidateFacets();
        UI.atualizarBadges();
        UI.render('dashboard');
        Util.toast('Banco carregado do armazenamento interno do navegador ('+Util.fNum(DB.contagem().ncrs)+' NCRs).','warn','Sem pasta conectada');
        return;
      }
    }catch(e){}
    Store.st.mode = Store.info().supportsFS ? 'none' : 'idb';
  }
  UI.atualizarBadges();
  UI.render('dashboard');
  UI.telaInicial();
})();
</script>
