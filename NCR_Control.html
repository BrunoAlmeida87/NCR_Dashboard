      data: etapas.map(k => ({label: k==='null'?'Fora do fluxo':Flow.etapa(+k), value:porOrdem[k], key:k,
        color: k==='null' ? 'var(--muted)' : Charts.SERIES[(+k-1)%8]})),
      height:230, barW:52,
      onClick: k => { Filters.state.etapas = [k]; Filters.invalidate(); UI.ir('ncrs'); }
    });
    Charts.donut($('#chSit'), {
      data:[{label:'Abertas', value:r.abertas, color:'var(--s1)', key:'abertas'},
            {label:'Fechadas', value:r.fechadas, color:'var(--good)', key:'fechadas'}],
      centerValue: r.pctFechadas+'%', centerLabel:'fechadas', height:190,
      onClick: k => { Filters.state.situacao = k; Filters.invalidate(); UI.ir('ncrs'); }
    });
    Charts.hbar($('#chStatus'), {
      data: Metrics.contar(list, n => n.status, 14), limit:14, mono:false,
      colorFn: d => { const o = Flow.ordemDe(d.label); return o == null ? 'var(--muted)' : Charts.SERIES[(o-1)%8]; },
      onClick: k => { Filters.state.campos = {}; Filters.state.statusRapido = k; Filters.invalidate(); UI.ir('ncrs'); }
    });
    Charts.line($('#chMes'), {categories: serie.categories, series:[{name:'NCRs criadas', values: serie.values, color:'var(--s1)'}], height:230});
    const fx = cfg.agingFaixas.map(f => f.lbl);
    const cA = {}; list.filter(n => !n.fechada).forEach(n => { const k = Metrics.derive(n).faixa; cA[k] = (cA[k]||0)+1; });
    const corFaixa = ['var(--good)','var(--s3)','var(--warning)','var(--serious)','var(--critical)'];
    Charts.column($('#chAging'), {
      data: fx.map((f,i) => ({label:f, value:cA[f]||0, key:f, color:corFaixa[Math.min(i,corFaixa.length-1)]})),
      height:220, barW:40,
      onClick: k => { Filters.state.aging = [k]; Filters.state.situacao = 'abertas'; Filters.invalidate(); UI.ir('ncrs'); }
    });
    [0,1].forEach(i => {
      const campo = dimCampo(i);
      const el = $('#chDim'+i);
      if(!campo || !el) return;
      Charts.hbar(el, {data: Metrics.contar(list, n => n.campos[campo], 10), limit:10, mono:true,
        onClick: k => { Filters.state.campos[campo] = [k]; Filters.invalidate(); UI.ir('ncrs'); }});
    });
    /* recortes: um grafico por dimensao reconhecida. Bigramas e multivalorado,
       entao a soma das barras passa do total de NCRs — a dica no cabecalho diz
       isso, para ninguem somar e achar que o numero esta errado. */
    Dim.disponiveis().forEach(d => {
      const el = $('#chDim_' + d.id);
      if(!el) return;
      const cont = new Map();
      list.forEach(n => Dim.tokensDe(n, d).forEach(t => cont.set(t, (cont.get(t)||0) + 1)));
      (d.fixos || []).forEach(f => { if(!cont.has(f)) cont.set(f, 0); });
      const dados = Array.from(cont.entries()).map(([label,value]) => ({label, value, key:label}))
        .sort((a,b) => b.value - a.value || Util.cmp(a.label, b.label)).slice(0,14);
      Charts.hbar(el, {data:dados, limit:14, mono:true, emptyMsg:'Sem valores nesta coluna',
        onClick: k => { Filters.state.dims[d.id] = [k]; Filters.invalidate(); UI.ir('ncrs'); }});
    });
    const respCampo = campoResponsavel();
    Charts.hbar($('#chResp'), {
      data: Metrics.contar(list.filter(n => !n.fechada), n => respCampo ? n.campos[respCampo] : '(sem responsável)', 12),
      limit:12, mono:true,
      onClick: k => { if(respCampo){ Filters.state.campos[respCampo] = [k]; Filters.state.situacao = 'abertas'; Filters.invalidate(); UI.ir('ncrs'); } }
    });
    const keys = new Set(list.map(n => n.key));
    const prodCount = new Map();
    Object.keys(DB.all().produtos).forEach(k => {
      const p = DB.all().produtos[k];
      if(p.ativo === false || !keys.has(p.ncr)) return;
      prodCount.set(p.produto, (prodCount.get(p.produto)||0)+1);
    });
    const topProd = Array.from(prodCount.entries()).map(([label,value]) => ({label, value, key:label}))
      .sort((a,b) => b.value-a.value).slice(0,12);
    Charts.hbar($('#chProd'), {data:topProd, limit:12, mono:true, emptyMsg:'Nenhum produto vinculado',
      onClick: k => { Filters.state.produto = k; Filters.invalidate(); UI.ir('ncrs'); }});

    /* --- listas --- */
    const evs = DB.all().historico.filter(e => Flow.isFluxoEvt(e) && e.cls !== 'INICIAL' && keys.has(e.ncr)).slice(-12).reverse();
    $('#dashRecentes').innerHTML = evs.length ? evs.map(e => {
      const rec = DB.all().ncrs[e.ncr];
      return `<div class="kv"><div style="min-width:0">
        ${rec?ncrLink(rec.id,e.ncr):esc(e.ncr)}
        <div class="small muted" style="white-space:normal">${esc(e.de||'—')} <span class="arrowto">→</span> ${esc(e.para||'—')}</div></div>
        <div style="text-align:right"><span class="mv mv-${esc(e.cls)}">${Flow.ICON[e.cls]||''} ${esc(Flow.LABEL[e.cls]||e.cls)}</span>
        <div class="small muted">${Util.fDate(e.data)}</div></div></div>`;
    }).join('') : semDados('Sem movimentações registradas ainda');
    const paradas = list.filter(n => !n.fechada).map(n => ({n, d: Util.days(n.ultimaAlteracao||n.primeiraVez)}))
      .filter(x => x.d != null).sort((a,b) => b.d-a.d).slice(0,10);
    $('#dashParadas').innerHTML = paradas.length ? paradas.map(x => `<div class="kv"><div style="min-width:0">
        ${ncrLink(x.n.id,x.n.key)}<div class="small muted">${esc(x.n.status||'—')}</div></div>
        <b class="${x.d>=60?'':''}" style="color:${x.d>=60?'var(--critical-ink)':x.d>=30?'var(--warning-ink)':'var(--text)'}">${x.d} d</b></div>`).join('')
      : semDados('Nenhuma NCR parada');
    const fech = list.filter(n => n.fechada).map(n => ({n, d: Util.days(n.ultimaAlteracao)}))
      .filter(x => x.d != null).sort((a,b) => a.d-b.d).slice(0,10);
    $('#dashFechadas').innerHTML = fech.length ? fech.map(x => `<div class="kv"><div style="min-width:0">
        ${ncrLink(x.n.id,x.n.key)}<div class="small muted">${esc(x.n.status||'—')}</div></div>
        <span class="small muted">${Util.fDate(x.n.ultimaAlteracao)}</span></div>`).join('')
      : semDados('Nenhum fechamento registrado');
    ligarLinks(host);
    $$('[data-tile]', host).forEach(t => t.onclick = () => {
      const k = t.dataset.tile;
      if(k === 'abertas'){ Filters.state.situacao = 'abertas'; }
      else if(k === 'fechadas'){ Filters.state.situacao = 'fechadas'; }
      else if(k === 'semMov'){ Filters.state.situacao = 'abertas'; Filters.state.semMovDias = DB.cfg().semMovimentacaoDias; }
      else if(k === 'retorno'){ Filters.state.comRetorno = true; }
      Filters.invalidate(); UI.ir('ncrs');
    });
  }
  /* uma linha de cards, so com as dimensoes que existem no export lido */
  function cardsRecorte(){
    const ds = Dim.disponiveis();
    if(!ds.length) return '';
    return '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr));align-items:start;margin-bottom:14px">'
      + ds.map(d => card(d.rot, d.multi ? 'uma NCR pode contar em vários' : 'coluna "' + d.col + '"',
          '<div class="chart-host" id="chDim_' + esc(d.id) + '"></div>')).join('')
      + '</div>';
  }
  function dimCampo(i){
    const prefer = [['tipo de produto','disciplina','categoria'],['tipo de anomalia','motivo da anomalia','nivel']];
    const cols = DB.campos();
    for(const alvo of prefer[i]||[]){
      const c = cols.find(x => Util.norm(x) === Util.norm(alvo));
      if(c) return c;
    }
    const f = Filters.facets().filter(f => f.distintos > 1 && f.distintos < 25);
    return f[i+2] ? f[i+2].campo : (f[i] ? f[i].campo : null);
  }
  const dimNome = i => dimCampo(i) || 'Dimensão '+(i+1);
  function campoResponsavel(){
    const cols = DB.campos();
    const alvos = ['especialista 2.1','responsavel','responsavel atual','especialista ta','autor'];
    for(const a of alvos){ const c = cols.find(x => Util.norm(x).indexOf(Util.norm(a)) === 0); if(c) return c; }
    return null;
  }
  function vazio(){
    const inf = Store.info();
    return `<div class="card"><div class="card-b" style="text-align:center;padding:50px 20px">
      <div style="font-size:42px">📊</div>
      <h2 style="margin:10px 0 6px">Banco de dados vazio</h2>
      <p class="muted" style="max-width:520px;margin:0 auto 18px">
        ${inf.mode === 'none' ? 'Conecte uma pasta de trabalho e importe suas exportações do Excel para começar.' :
          'Nenhuma NCR importada ainda. Clique em <b>Atualizar Banco de Dados</b> para ler os arquivos Excel da pasta <b>'+esc(inf.folder)+'</b>.'}
      </p>
      <div class="hstack" style="justify-content:center">
        <button class="btn primary" id="dashStart">${inf.mode==='none'?'Configurar sistema':'Atualizar Banco de Dados'}</button>
        <button class="btn" id="dashManual">Selecionar arquivos Excel</button>
      </div></div></div>`;
  }
  function ligarVazio(host){
    const a = $('#dashStart', host), b = $('#dashManual', host);
    if(a) a.onclick = () => Store.info().mode === 'none' ? UI.telaInicial() : UI.atualizarBanco();
    if(b) b.onclick = () => UI.importarManual();
  }
  return {render};
})();

/* ============================ Tabela de NCRs ============================ */
const Tabela = (() => {
  const CALC = [
    {id:'__id', label:'NCR', get:n => n.id, sort:n => n.id, w:'170px',
     render:n => ncrLink(n.id, n.key)},
    {id:'__status', label:'Status', get:n => n.status, sort:n => n.status, render:n => badgeStatus(n)},
    {id:'__ordem', label:'Ordem', get:n => n.ordem, sort:n => (n.ordem==null?99:n.ordem), num:true,
     render:n => '<span class="badge ord">'+(n.ordem==null?'—':n.ordem)+'</span>'},
    {id:'__etapa', label:'Etapa', get:n => Flow.etapa(n.ordem), sort:n => (n.ordem==null?99:n.ordem)},
    {id:'__situacao', label:'Situação', get:n => n.fechada?'Fechada':'Aberta', sort:n => n.fechada?1:0,
     render:n => '<span class="badge '+(n.fechada?'closed':'open')+'">'+(n.fechada?'Fechada':'Aberta')+'</span>'},
    {id:'__diasStatus', label:'Dias no status', num:true, get:n => Util.days(n.statusDesde||n.primeiraVez), sort:n => Util.days(n.statusDesde||n.primeiraVez)||0},
    {id:'__diasMov', label:'Sem movimento', num:true, get:n => Util.days(n.ultimaAlteracao||n.primeiraVez), sort:n => Util.days(n.ultimaAlteracao||n.primeiraVez)||0,
     render:n => { const d = Util.days(n.ultimaAlteracao||n.primeiraVez); const c = d>=60?'var(--critical-ink)':d>=30?'var(--warning-ink)':'inherit';
                   return '<span style="color:'+c+'">'+(d==null?'—':d+' d')+'</span>'; }},
    {id:'__aging', label:'Faixa aging', get:n => Metrics.derive(n).faixa, sort:n => Util.days(n.ultimaAlteracao||n.primeiraVez)||0},
    {id:'__mov', label:'Movimentos', num:true, get:n => (n.mov&&n.mov.total)||0, sort:n => (n.mov&&n.mov.total)||0},
    {id:'__ret', label:'Retornos', num:true, get:n => (n.mov&&n.mov.retornos)||0, sort:n => (n.mov&&n.mov.retornos)||0,
     render:n => { const r = (n.mov&&n.mov.retornos)||0; return r ? '<span class="mv mv-RETORNO">↩ '+r+'</span>' : '<span class="muted">0</span>'; }},
    {id:'__lat', label:'Laterais', num:true, get:n => (n.mov&&n.mov.laterais)||0, sort:n => (n.mov&&n.mov.laterais)||0},
    {id:'__reab', label:'Reaberturas', num:true, get:n => (n.mov&&n.mov.reaberturas)||0, sort:n => (n.mov&&n.mov.reaberturas)||0},
    {id:'__criado', label:'Data criação', get:n => n.criadoEm, sort:n => n.criadoEm||'', render:n => Util.fDate(n.criadoEm)},
    {id:'__idade', label:'Idade (dias)', num:true, get:n => Util.days(n.criadoEm||n.primeiraVez), sort:n => Util.days(n.criadoEm||n.primeiraVez)||0},
    {id:'__ultAlt', label:'Última alteração', get:n => n.ultimaAlteracao, sort:n => n.ultimaAlteracao||'', render:n => Util.fDate(n.ultimaAlteracao)},
    {id:'__primeira', label:'1ª observação', get:n => n.primeiraVez, sort:n => n.primeiraVez||'', render:n => Util.fDate(n.primeiraVez)},
    {id:'__ultima', label:'Última observação', get:n => n.ultimaVez, sort:n => n.ultimaVez||'', render:n => Util.fDate(n.ultimaVez)},
    {id:'__produtos', label:'Qtd. produtos', num:true, get:n => DB.produtosDe(n.key).filter(p => p.ativo !== false).length,
     sort:n => DB.produtosDe(n.key).filter(p => p.ativo !== false).length},
    {id:'__origem', label:'Arquivo origem', get:n => n.arquivoOrigem}
  ];
  const st = {sort:'__diasMov', dir:-1, pagina:1};

  function colunasDisponiveis(){
    return CALC.concat(DB.campos().sort(Util.cmp).map(c => ({id:'c:'+c, label:c, campo:c, get:n => n.campos[c], sort:n => n.campos[c]})));
  }
  function visiveis(){
    const cfg = DB.cfg();
    if(cfg.colunasNcr && cfg.colunasNcr.length){
      const disp = colunasDisponiveis();
      const out = cfg.colunasNcr.map(id => disp.find(c => c.id === id)).filter(Boolean);
      if(out.length) return out;
    }
    const pref = ['__id','__status','__etapa','__situacao','__diasStatus','__diasMov','__mov','__ret','__criado'];
    const base = pref.map(id => CALC.find(c => c.id === id));
    const extras = [];
    ['disciplina','tipo de produto','autor','especialista 2.1'].forEach(a => {
      const c = DB.campos().find(x => Util.norm(x) === Util.norm(a));
      if(c) extras.push({id:'c:'+c, label:c, campo:c, get:n => n.campos[c], sort:n => n.campos[c]});
    });
    return base.concat(extras);
  }
  function ordenar(list, cols){
    const col = cols.find(c => c.id === st.sort) || colunasDisponiveis().find(c => c.id === st.sort);
    if(!col) return list;
    const f = col.sort || col.get;
    return list.slice().sort((a,b) => Util.cmp(f(a), f(b)) * st.dir);
  }
  function render(host){
    if(!DB.contagem().ncrs){ host.innerHTML = semDados('Importe seus arquivos Excel para visualizar as NCRs.'); return; }
    host.innerHTML = '';
    UI.barraFiltros(host, {maxFacetas:5});
    const cols = visiveis();
    const list = ordenar(Filters.aplicar(), cols);
    const porPag = DB.cfg().porPagina || 50;
    const totalPag = Math.max(1, Math.ceil(list.length/porPag));
    if(st.pagina > totalPag) st.pagina = totalPag;
    const ini = (st.pagina-1)*porPag;
    const page = list.slice(ini, ini+porPag);
    const box = document.createElement('div');
    box.innerHTML = `
      <div class="hstack wrap" style="margin-bottom:10px">
        <b>${Util.fNum(list.length)}</b><span class="muted small">NCRs encontradas</span>
        <div class="right hstack">
          <button class="btn sm" id="btnCols">Colunas (${cols.length})</button>
          <button class="btn sm" id="btnCsv">Exportar CSV</button>
          <button class="btn sm" id="btnJson">Exportar JSON</button>
        </div>
      </div>
      <div class="tbl-wrap" style="max-height:calc(100vh - 340px)">
        <table class="tbl"><thead><tr>${cols.map(c =>
          `<th class="sortable ${st.sort===c.id?'sorted':''}" data-col="${esc(c.id)}">${esc(c.label)}<span class="arr">${st.sort===c.id?(st.dir>0?'▲':'▼'):'↕'}</span></th>`).join('')}</tr></thead>
        <tbody>${page.map(n => '<tr class="clickable" data-key="'+esc(n.key)+'">'+cols.map(c => {
            const v = c.render ? c.render(n) : esc(Util.strVal(c.get(n)));
            return '<td class="'+(c.num?'num':'')+'" title="'+esc(Util.strVal(c.get(n)))+'">'+v+'</td>';
          }).join('')+'</tr>').join('')}</tbody></table>
        ${!page.length ? semDados('Nenhuma NCR corresponde aos filtros aplicados') : ''}
      </div>
      <div class="pager">
        <button class="btn sm" id="pgFirst" ${st.pagina===1?'disabled':''}>« Primeira</button>
        <button class="btn sm" id="pgPrev" ${st.pagina===1?'disabled':''}>‹ Anterior</button>
        <span>Página <b>${st.pagina}</b> de <b>${totalPag}</b></span>
        <button class="btn sm" id="pgNext" ${st.pagina>=totalPag?'disabled':''}>Próxima ›</button>
        <button class="btn sm" id="pgLast" ${st.pagina>=totalPag?'disabled':''}>Última »</button>
        <span class="right hstack"><span class="muted small">Por página</span>
        <select id="pgSize" style="width:auto">${[25,50,100,200,500].map(v => '<option '+(v===porPag?'selected':'')+'>'+v+'</option>').join('')}</select></span>
      </div>`;
    host.appendChild(box);
    $$('th[data-col]', box).forEach(th => th.onclick = () => {
      const id = th.dataset.col;
      if(st.sort === id) st.dir = -st.dir; else { st.sort = id; st.dir = id === '__id' ? 1 : -1; }
      UI.render('ncrs');
    });
    $$('tr[data-key]', box).forEach(tr => tr.onclick = e => {
      if(e.target.closest('a')) return;
      Detalhe.abrir(tr.dataset.key);
    });
    ligarLinks(box);
    $('#pgFirst', box).onclick = () => { st.pagina = 1; UI.render('ncrs'); };
    $('#pgPrev', box).onclick = () => { st.pagina = Math.max(1, st.pagina-1); UI.render('ncrs'); };
    $('#pgNext', box).onclick = () => { st.pagina = Math.min(totalPag, st.pagina+1); UI.render('ncrs'); };
    $('#pgLast', box).onclick = () => { st.pagina = totalPag; UI.render('ncrs'); };
    $('#pgSize', box).onchange = e => { DB.cfg().porPagina = +e.target.value; st.pagina = 1; UI.render('ncrs'); salvarPrefs(); };
    $('#btnCols', box).onclick = () => escolherColunas();
    $('#btnCsv', box).onclick = () => exportar(list, cols, 'csv');
    $('#btnJson', box).onclick = () => exportar(list, cols, 'json');
  }
  function exportar(list, cols, tipo){
    const nome = 'NCR_export_' + Util.stamp();
    if(tipo === 'csv'){
      const rows = [cols.map(c => c.label)];
      list.forEach(n => rows.push(cols.map(c => Util.strVal(c.get(n)))));
      Util.download(nome+'.csv', Util.toCSV(rows), 'text/csv;charset=utf-8');
    } else {
      const out = list.map(n => {
        const o = {};
        cols.forEach(c => o[c.label] = c.get(n));
        o._produtos = DB.produtosDe(n.key).filter(p => p.ativo !== false).map(p => p.produto);
        return o;
      });
      Util.download(nome+'.json', JSON.stringify(out, null, 2));
    }
    Util.toast(Util.fNum(list.length)+' registros exportados.','ok');
  }
  function escolherColunas(){
    const disp = colunasDisponiveis();
    const vis = new Set(visiveis().map(c => c.id));
    const grupo = (titulo, lista) => '<div style="margin-bottom:12px"><b class="small">'+esc(titulo)+'</b><div class="grid g3" style="gap:2px;margin-top:6px">'
      + lista.map(c => `<label class="ms-opt"><input type="checkbox" value="${esc(c.id)}" ${vis.has(c.id)?'checked':''}><span>${esc(c.label)}</span></label>`).join('')+'</div></div>';
    UI.modal({size:'md', title:'Colunas visíveis', sub:'Escolha quais informações aparecem na tabela',
      body: grupo('Calculadas pelo sistema', disp.filter(c => c.id.indexOf('c:') !== 0))
          + grupo('Colunas dos arquivos Excel', disp.filter(c => c.id.indexOf('c:') === 0)),
      footer:'<button class="btn" id="colReset">Restaurar padrão</button><button class="btn" data-close>Cancelar</button><button class="btn primary" id="colOk">Aplicar</button>'});
    $('#colOk').onclick = () => {
      const ids = $$('#modalBody input:checked').map(i => i.value);
      if(!ids.length){ Util.toast('Selecione ao menos uma coluna.','warn'); return; }
      DB.cfg().colunasNcr = ids;
      salvarPrefs(); UI.fecharModal(); UI.render('ncrs');
    };
    $('#colReset').onclick = () => { DB.cfg().colunasNcr = null; salvarPrefs(); UI.fecharModal(); UI.render('ncrs'); };
  }
  const salvarPrefs = Util.debounce(() => { DB.save(['config']).catch(() => {}); }, 900);
  return {render, colunasDisponiveis, visiveis, st};
})();

/* ============================ Detalhe da NCR ============================ */
const Detalhe = (() => {
  /* a escolha entre trajetoria e mapa vale enquanto o usuario navega */
  let modoFluxo = 'traj';
  function sequencia(rec){
    const ev = DB.eventos(rec.key).filter(Flow.isFluxoEvt);
    const out = ev.map(e => ({status:e.para, data:e.data, cls:e.cls, de:e.de, estimado:e.estimado, obs:e.obs}));
    if(!out.length && rec.status) out.push({status:rec.status, data:rec.primeiraVez, cls:'INICIAL'});
    return out;
  }
  /* ----- grade comum as duas visoes -----
     As colunas sao as etapas do fluxo; dentro de cada uma ficam os status
     configurados. Status que so aparecem nas colunas datadas do export
     ("7.2 - TA") entram na coluna da ordem inferida, para o caminho nao
     ficar partido. */
  function grade(rec){
    const byOrd = Flow.statusPorOrdem();
    const ordens = Array.from(byOrd.keys()).sort((a,b) => a-b);
    const seq = sequencia(rec);
    const noFluxo = new Set();
    byOrd.forEach(lst => lst.forEach(st => noFluxo.add(Util.norm(st))));
    const fora = [], extras = new Map();
    seq.forEach(s => {
      if(!s.status || noFluxo.has(Util.norm(s.status))) return;
      const oi = Flow.ordemInferida(s.status);
      if(oi != null && byOrd.has(oi)){
        if(!extras.has(oi)) extras.set(oi, []);
        if(extras.get(oi).indexOf(s.status) < 0) extras.get(oi).push(s.status);
      } else if(fora.indexOf(s.status) < 0) fora.push(s.status);
    });
    const descobertos = new Set();
    extras.forEach(lst => lst.forEach(st => descobertos.add(st)));
    const colunas = ordens.map(o => ({ordem:o, titulo:Flow.etapa(o),
                                      status:byOrd.get(o).slice().concat(extras.get(o) || [])}));
    if(fora.length) colunas.push({ordem:null, titulo:'Fora do fluxo', status:fora});
    const colDe = new Map();
    colunas.forEach((c,i) => c.status.forEach(s => colDe.set(Util.strVal(s), i)));
    return {seq, colunas, colDe, descobertos};
  }
  const CORES = {AVANCO:'var(--good)', RETORNO:'var(--critical)', LATERAL:'var(--warning)',
                 FECHAMENTO:'var(--s7)', REABERTURA:'var(--serious)', INDEFINIDA:'var(--muted)',
                 INICIAL:'var(--s1)', PERMANENCIA:'var(--muted)'};
  function marcadores(){
    let d = '<defs>';
    Object.keys(CORES).forEach(k => {
      d += `<marker id="ar-${k}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" style="fill:${CORES[k]}"/></marker>`;
    });
    return d + '</defs>';
  }
  const svgWrap = (W,H,g) => `<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMinYMin meet"
      style="max-width:${W}px;height:auto;display:block">${g}</svg>`;
  /* polilinha ortogonal com cantos arredondados: as setas viram trilhos, e
     trilho e facil de seguir com o olho mesmo quando um cruza o outro */
  function ortho(pts, r){
    const p = [];
    pts.forEach(q => { const u = p[p.length-1]; if(!u || Math.hypot(u[0]-q[0], u[1]-q[1]) > 0.5) p.push(q); });
    if(p.length < 2) return '';
    let d = `M${p[0][0].toFixed(1)},${p[0][1].toFixed(1)}`;
    for(let i = 1; i < p.length-1; i++){
      const [px,py] = p[i-1], [cx,cy] = p[i], [nx,ny] = p[i+1];
      const d1 = Math.hypot(cx-px, cy-py), d2 = Math.hypot(nx-cx, ny-cy);
      const rr = Math.max(1, Math.min(r, d1/2, d2/2));
      d += ` L${(cx+(px-cx)/d1*rr).toFixed(1)},${(cy+(py-cy)/d1*rr).toFixed(1)}`
         + ` Q${cx.toFixed(1)},${cy.toFixed(1)} ${(cx+(nx-cx)/d2*rr).toFixed(1)},${(cy+(ny-cy)/d2*rr).toFixed(1)}`;
    }
    const z = p[p.length-1];
    return d + ` L${z[0].toFixed(1)},${z[1].toFixed(1)}`;
  }
  const dur = (a,b) => (a && b) ? Math.max(0, new Date(b) - new Date(a)) : null;

  /* ----- visao 1: trajetoria (ordem no eixo vertical) -----
     Uma linha por passo, na ordem em que aconteceu. Como toda seta liga
     linhas vizinhas, nenhuma pode cruzar outra nem passar por cima de uma
     caixa — o problema de leitura do mapa some por construcao. O eixo
     horizontal continua sendo a etapa do fluxo, entao ainda da para ver a
     NCR indo e voltando pelas fases. */
  function trajSVG(rec){
    const {seq, colunas, colDe, descobertos} = grade(rec);
    if(!seq.length) return semDados('Sem trajetória registrada para esta NCR');
    const NW = 158, NH = 30, HG = 14, RH = 66, GUT = 104, PY = 44, PB = 16;
    const W = GUT + colunas.length*NW + (colunas.length-1)*HG + 16;
    const H = PY + seq.length*RH + PB;
    const colX = i => GUT + i*(NW+HG);
    const vis = rec.visitas || {};
    const ocorrencia = new Map();      /* quantas vezes o status ja apareceu ate aqui */
    let g = marcadores();
    /* cabecalhos das etapas */
    colunas.forEach((c,i) => {
      const x = colX(i);
      g += `<rect x="${x}" y="12" width="${NW}" height="22" rx="6" style="fill:var(--surface-3)"/>`;
      const r = rotuloSVG(c.titulo, NW - 12, 10.5);
      g += `<text x="${x+NW/2}" y="27" text-anchor="middle"${r.aperta} style="fill:var(--text-2);font-size:10.5px;font-weight:600"><title>${esc(c.titulo)}</title>${esc(r.label)}</text>`;
    });
    g += `<text x="12" y="27" style="fill:var(--muted);font-size:10px;font-weight:600">PASSO</text>`;
    /* ligacoes: sempre de uma linha para a seguinte */
    for(let i = 1; i < seq.length; i++){
      const a = seq[i-1], b = seq[i];
      const ca = colDe.get(Util.strVal(a.status)), cb = colDe.get(Util.strVal(b.status));
      if(ca == null || cb == null) continue;
      const cls = b.cls || 'INDEFINIDA';
      const cor = CORES[cls] || 'var(--muted)';
      const x1 = colX(ca) + NW/2, x2 = colX(cb) + NW/2;
      const y1 = PY + (i-1)*RH + NH, y2 = PY + i*RH;
      const ym = (y1 + y2) / 2;
      const d = ortho([[x1,y1],[x1,ym],[x2,ym],[x2,y2]], 8);
      g += `<path d="${d}" fill="none" style="stroke:${cor};opacity:.9" stroke-width="2"`
         + `${b.estimado ? ' stroke-dasharray="5 4"' : ''} marker-end="url(#ar-${cls})"><title>`
         + `${esc(Flow.LABEL[cls]||cls)} — ${Util.fDate(b.data)}: ${esc(a.status)} → ${esc(b.status)}`
         + `${b.estimado ? '\n(data estimada: o export registra apenas a saída da etapa)' : ''}`
         + `${b.obs ? '\n'+esc(b.obs) : ''}</title></path>`;
      if(Math.abs(x2 - x1) > 40){
        const lbl = (Flow.ICON[cls]||'') + ' ' + (Flow.LABEL[cls]||cls);
        /* contorno na cor do fundo para o rotulo nao brigar com a faixa nem
           com a propria linha por baixo dele */
        g += `<text x="${(x1+x2)/2}" y="${ym-6}" text-anchor="middle" style="fill:${cor};font-size:9.5px;font-weight:700;`
           + `stroke:var(--surface);stroke-width:3;paint-order:stroke">${esc(lbl)}</text>`;
      }
    }
    /* linhas */
    seq.forEach((s,i) => {
      const ci = colDe.get(Util.strVal(s.status));
      const y = PY + i*RH;
      const cls = s.cls || 'INDEFINIDA';
      const cor = CORES[cls] || 'var(--muted)';
      const ehAtual = i === seq.length-1;
      const n = (ocorrencia.get(Util.strVal(s.status)) || 0) + 1;
      ocorrencia.set(Util.strVal(s.status), n);
      /* faixa da linha, para o olho nao perder o alinhamento na tela larga */
      if(i % 2 === 0) g += `<rect class="faixa" x="0" y="${y-((RH-NH)/2)}" width="${W}" height="${RH}" rx="6" style="fill:var(--surface-3);opacity:.6"/>`;
      g += `<circle class="passo" cx="20" cy="${y+NH/2}" r="10" style="fill:${cor}"/>`;
      g += `<text x="20" y="${y+NH/2+3.5}" text-anchor="middle" style="fill:#fff;font-size:10px;font-weight:700">${i+1}</text>`;
      g += `<text x="36" y="${y+NH/2-2}" style="fill:var(--text-2);font-size:10px">${Util.fDate(s.data)}</text>`;
      const espera = i < seq.length-1 ? dur(s.data, seq[i+1].data) : null;
      const parada = i === seq.length-1 && !rec.fechada ? Util.days(s.data) : null;
      const info = espera != null ? (espera >= Util.DAY ? Math.round(espera/Util.DAY)+' d aqui'
                                     : (seq[i+1].estimado ? 'sem intervalo' : 'no mesmo dia'))
                 : parada != null ? 'há '+parada+' d' : '';
      if(info) g += `<text x="36" y="${y+NH/2+9}" style="fill:var(--muted);font-size:9px">${esc(info)}</text>`;
      if(ci == null) return;
      const x = colX(ci);
      const desc = descobertos.has(s.status);
      const fill = ehAtual ? (rec.fechada ? 'rgba(12,163,12,.16)' : 'var(--accent-wash)') : 'var(--surface-3)';
      const stroke = ehAtual ? (rec.fechada ? 'var(--good)' : 'var(--accent)') : cor;
      const rl = rotuloSVG(s.status, NW - (n > 1 ? 40 : 18), 11), label = rl.label;
      const v = vis[s.status];
      g += `<g><title>${esc(s.status)} — passo ${i+1} de ${seq.length}, ${Util.fDateTime(s.data)}`
         + `${n > 1 ? '\n'+n+'ª passagem por esta etapa' : ''}`
         + `${v && v.n > 1 ? '\n'+v.n+' passagens no total' : ''}`
         + `${desc ? '\netapa registrada apenas nas colunas datadas do export (ordem inferida)' : ''}`
         + `${s.obs ? '\n'+esc(s.obs) : ''}</title>`;
      g += `<rect class="no" x="${x}" y="${y}" width="${NW}" height="${NH}" rx="7" style="fill:${fill};stroke:${stroke}"`
         + ` stroke-width="${ehAtual ? 2 : 1.4}"${desc ? ' stroke-dasharray="4 3"' : ''}/>`;
      g += `<text x="${x+10}" y="${y+NH/2+4}"${rl.aperta} style="fill:var(--text);font-size:11px${ehAtual?';font-weight:600':''}">${esc(label)}</text>`;
      if(n > 1)
        g += `<circle cx="${x+NW-14}" cy="${y+NH/2}" r="9" style="fill:var(--s4)"/>`
           + `<text x="${x+NW-14}" y="${y+NH/2+3.5}" text-anchor="middle" style="fill:#fff;font-size:9px;font-weight:700">${n}ª</text>`;
      g += '</g>';
    });
    return svgWrap(W, H, g);
  }

  /* ----- visao 2: mapa do fluxo -----
     Mostra tambem as etapas nao percorridas. Aqui as setas precisam
     atravessar a grade, entao cada uma recebe uma faixa exclusiva: um
     corredor vertical no vao entre duas colunas, ou uma faixa horizontal
     abaixo da grade. Duas setas nunca dividem a mesma faixa, e nenhuma
     corre por cima de uma caixa. */
  function flowSVG(rec){
    const {seq, colunas, colDe, descobertos} = grade(rec);
    const NW = 172, NH = 28, VG = 9, HG = 74, PX = 16, PY = 46;
    const maxRows = Math.max.apply(null, colunas.map(c => c.status.length));
    const W = PX*2 + colunas.length*NW + (colunas.length-1)*HG;
    const gridBot = PY + maxRows*(NH+VG);
    const pos = new Map();
    colunas.forEach((c,i) => c.status.forEach((s,j) => {
      pos.set(s, {x: PX + i*(NW+HG), y: PY + j*(NH+VG), col:i, row:j});
    }));
    const vis = rec.visitas || {};
    const atual = rec.status;
    /* ---- distribui as faixas antes de desenhar, para saber a altura ---- */
    const arestas = [];
    const usoCorredor = new Map();
    let faixasBaixo = 0;
    for(let i = 1; i < seq.length; i++){
      const pa = pos.get(seq[i-1].status), pb = pos.get(seq[i].status);
      if(!pa || !pb) continue;
      const dc = pb.col - pa.col;
      const e = {i, a:seq[i-1], b:seq[i], pa, pb, dc};
      if(dc === 1 || dc === 0 || dc === -1){
        /* cabe num corredor vertical: o vao a direita da coluna de origem
           (avanco e permanencia) ou o vao a esquerda dela (retorno curto) */
        const vao = dc === -1 ? pb.col : pa.col;
        const n = usoCorredor.get(vao) || 0;
        usoCorredor.set(vao, n+1);
        e.tipo = 'corredor'; e.vao = vao; e.faixa = n;
      } else {
        e.tipo = 'baixo'; e.faixa = faixasBaixo++;
      }
      arestas.push(e);
    }
    /* o vao a direita da ultima coluna so existe se alguma seta precisar dele */
    const usaBorda = arestas.some(e => e.tipo === 'corredor' && e.vao === colunas.length-1);
    const WT = W + (usaBorda ? 72 : 0);
    const H = gridBot + (faixasBaixo ? 24 + faixasBaixo*15 : 16);
    let g = marcadores();
    colunas.forEach((c,i) => {
      const x = PX + i*(NW+HG);
      g += `<rect x="${x}" y="14" width="${NW}" height="22" rx="6" style="fill:var(--surface-3)"/>`;
      const r = rotuloSVG(c.titulo, NW - 12, 10.5);
      g += `<text x="${x+NW/2}" y="29" text-anchor="middle"${r.aperta} style="fill:var(--text-2);font-size:10.5px;font-weight:600"><title>${esc(c.titulo)}</title>${esc(r.label)}</text>`;
    });
    colunas.forEach(c => c.status.forEach(s => {
      const p = pos.get(s), v = vis[s];
      const visitado = !!v, ehAtual = Util.strVal(s) === Util.strVal(atual);
      const fill = ehAtual ? (rec.fechada ? 'rgba(12,163,12,.16)' : 'var(--accent-wash)') : visitado ? 'var(--surface-3)' : 'var(--surface)';
      const stroke = ehAtual ? (rec.fechada ? 'var(--good)' : 'var(--accent)') : visitado ? 'var(--axis)' : 'var(--grid)';
      const ink = visitado || ehAtual ? 'var(--text)' : 'var(--muted)';
      const rl = rotuloSVG(s, NW - (visitado && v.n > 1 ? 38 : 18), 11), label = rl.label;
      const dias = v && v.ms ? Math.round(v.ms/Util.DAY) : 0;
      const desc = descobertos.has(s);
      g += `<g><title>${esc(s)}${visitado ? ' — '+v.n+' passagem(ns)'+(dias?', '+dias+' dia(s) acumulados':', tempo não informado pelo export') : ' — não percorrido'}`
         + `${desc ? ' · etapa registrada apenas nas colunas datadas do export (ordem inferida)' : ''}</title>`;
      g += `<rect class="no" x="${p.x}" y="${p.y}" width="${NW}" height="${NH}" rx="7" style="fill:${fill};stroke:${stroke}" stroke-width="${ehAtual?2:1}"${desc?' stroke-dasharray="4 3"':''}/>`;
      if(ehAtual) g += `<rect x="${p.x}" y="${p.y+4}" width="3" height="${NH-8}" rx="2" style="fill:${rec.fechada?'var(--good)':'var(--accent)'}"/>`;
      g += `<text x="${p.x+10}" y="${p.y+NH/2+4}"${rl.aperta} style="fill:${ink};font-size:11px${ehAtual?';font-weight:600':''}">${esc(label)}</text>`;
      if(visitado && v.n > 1)
        g += `<circle cx="${p.x+NW-13}" cy="${p.y+NH/2}" r="9" style="fill:var(--s4)"/><text x="${p.x+NW-13}" y="${p.y+NH/2+3.5}" text-anchor="middle" style="fill:#fff;font-size:9.5px;font-weight:700">${v.n}×</text>`;
      else if(dias > 0)
        g += `<text x="${p.x+NW-9}" y="${p.y+NH/2+4}" text-anchor="end" style="fill:var(--muted);font-size:9.5px">${dias}d</text>`;
      g += '</g>';
    }));
    /* x do vao a direita da coluna, na faixa pedida */
    const vaoDe = (col, faixa) => PX + col*(NW+HG) + NW + 14 + (faixa % 4)*15;
    /* numeros de passo colados uns nos outros nao dizem nada: depois de
       traçar, quem ficou por cima de outro desce ate caber */
    const badges = [];
    function acomodar(x, y){
      let yy = y;
      for(let k = 0; k < badges.length; k++){
        const b = badges[k];
        if(Math.abs(b.x - x) < 19 && Math.abs(b.y - yy) < 19){ yy = b.y + 19; k = -1; }
      }
      badges.push({x, y:yy});
      return yy;
    }
    arestas.forEach(e => {
      const cls = e.b.cls || 'INDEFINIDA';
      const cor = CORES[cls] || 'var(--muted)';
      const nVao = e.tipo === 'corredor' ? usoCorredor.get(e.vao) : 1;
      let d, mx, my;
      if(e.tipo === 'corredor'){
        const xc = vaoDe(e.vao, e.faixa);
        /* saidas escalonadas: duas setas deixando a mesma caixa nao podem
           sair do mesmo ponto, senao correm juntas no primeiro trecho */
        const off = nVao > 1 ? (e.faixa - (nVao-1)/2) * Math.min(7, (NH-8)/nVao) : 0;
        const y1 = e.pa.y + NH/2 + off, y2 = e.pb.y + NH/2 + off;
        const x1 = e.dc === -1 ? e.pa.x : e.pa.x + NW;
        const x2 = e.dc === 1 ? e.pb.x : e.pb.x + NW;
        d = ortho([[x1,y1],[xc,y1],[xc,y2],[x2,y2]], 7);
        mx = xc; my = Math.abs(y2-y1) < 14 ? y1 - 13 : (y1+y2)/2;
      } else {
        /* salto longo: sai pelo lado, desce por um vao (nunca por dentro de
           uma coluna, senao a linha passa por cima das caixas de baixo),
           corre numa faixa livre sob a grade e sobe pelo vao do destino */
        const yc = gridBot + 15 + e.faixa*15;
        const frente = e.dc > 0;
        const y1 = e.pa.y + NH/2, y2 = e.pb.y + NH/2;
        const x1 = frente ? e.pa.x + NW : e.pa.x;
        const x2 = frente ? e.pb.x : e.pb.x + NW;
        const g1 = vaoDe(frente ? e.pa.col : e.pa.col - 1, e.faixa);
        const g2 = vaoDe(frente ? e.pb.col - 1 : e.pb.col, e.faixa);
        d = ortho([[x1,y1],[g1,y1],[g1,yc],[g2,yc],[g2,y2],[x2,y2]], 9);
        const sx = g2 > g1 ? 1 : -1;
        mx = g1 + sx*Math.min(34 + e.faixa*30, Math.abs(g2-g1)/2);
        my = yc;
      }
      g += `<path d="${d}" fill="none" style="stroke:${cor};opacity:.9" stroke-width="2"`
         + `${e.b.estimado ? ' stroke-dasharray="5 4"' : ''} marker-end="url(#ar-${cls})"><title>`
         + `Passo ${e.i} — ${esc(Flow.LABEL[cls]||cls)}, ${Util.fDate(e.b.data)}: ${esc(e.a.status)} → ${esc(e.b.status)}`
         + `${e.b.estimado ? '\n(data estimada: o export registra apenas a saída da etapa)' : ''}`
         + `${e.b.obs ? '\n'+esc(e.b.obs) : ''}</title></path>`;
      const by = acomodar(mx, my);
      if(Math.abs(by - my) > 1)
        g += `<path d="M${mx},${my} L${mx},${by}" style="stroke:${cor};opacity:.45" stroke-width="1" stroke-dasharray="2 2"/>`;
      g += `<circle class="passo" cx="${mx}" cy="${by}" r="9" style="fill:${cor};stroke:var(--surface)" stroke-width="1.5"/>`;
      g += `<text x="${mx}" y="${by+3.5}" text-anchor="middle" style="fill:#fff;font-size:9.5px;font-weight:700">${e.i}</text>`;
    });
    return svgWrap(WT, H, g);
  }
  function legendaFluxo(){
    const it = [['AVANCO','var(--good)'],['RETORNO','var(--critical)'],['LATERAL','var(--warning)'],
                ['FECHAMENTO','var(--s7)'],['REABERTURA','var(--serious)']];
    return '<div class="flow-legend">'+it.map(([k,c]) => '<span><i style="background:'+c+'"></i>'+Flow.ICON[k]+' '+Flow.LABEL[k]+'</span>').join('')
      + '<span><i style="background:var(--axis)"></i>Etapa percorrida</span><span><i style="background:var(--grid)"></i>Não percorrida</span>'
      + '<span title="a chegada na etapa não é datada pelo export"><i style="background:repeating-linear-gradient(90deg,var(--text-2) 0 3px,transparent 3px 6px)"></i>Data estimada</span></div>';
  }
  /* ----- timeline ----- */
  function timeline(rec, limite){
    let ev = DB.eventos(rec.key).slice();
    if(!ev.length) return semDados('Sem histórico registrado para esta NCR');
    if(limite && ev.length > limite) ev = ev.slice(-limite);
    return '<div class="tl">' + ev.map(e => {
      const cls = e.cls || e.tipo;
      let main = '';
      if(e.tipo === 'INICIAL' || (e.tipo === 'MARCO' && e.cls === 'INICIAL')){
        main = '<b>'+esc(e.para||'—')+'</b> <span class="mv mv-INICIAL">• Abertura da NCR</span>';
      } else if(e.tipo === 'STATUS' || e.tipo === 'MARCO'){
        main = '<span>'+esc(e.de||'—')+'</span><span class="arrowto">→</span><b>'+esc(e.para||'—')+'</b>'
             + ' <span class="mv mv-'+esc(cls)+'">'+(Flow.ICON[cls]||'')+' '+esc(Flow.LABEL[cls]||cls)+'</span>'
             + (e.ordemDe != null || e.ordemPara != null ? '<span class="small muted">ordem '+(e.ordemDe==null?'—':e.ordemDe)+' → '+(e.ordemPara==null?'—':e.ordemPara)+'</span>' : '')
             + (e.estimado ? ' <span class="badge ord" title="a data exata da chegada nesta etapa não consta no export">data estimada</span>' : '');
      } else if(e.tipo === 'PRODUTO'){
        main = '<b>'+esc(e.campo||'Produto')+'</b> <span class="mv mv-CAMPO">▤ Produto</span>';
      } else {
        main = '<b>'+esc(e.campo)+'</b> <span class="mv mv-CAMPO">✎ Alteração de campo</span>';
      }
      const det = (e.tipo === 'CAMPO' || (e.tipo === 'PRODUTO' && e.de && e.para))
        ? '<div class="tl-detail"><span class="muted">de:</span> '+expansivel(e.de,180)+'<br><span class="muted">para:</span> '+expansivel(e.para,180)+'</div>'
        : ((e.obs && e.tipo !== 'INICIAL' && e.obs !== 'Estado inicial conhecido') ? '<div class="small muted" style="margin-top:3px">'+esc(e.obs)+'</div>' : '')
          + (e.tipo === 'PRODUTO' ? '<div class="small muted">'+esc(Util.strVal(e.para||e.de))+'</div>' : '');
      return `<div class="tl-item t-${esc(cls)}">
        <div class="tl-date">${Util.fDateTime(e.data)}${e.arquivo?' · <span title="Arquivo de origem">'+esc(e.arquivo)+'</span>':''}</div>
        <div class="tl-main">${main}</div>${det}</div>`;
    }).join('') + '</div>';
  }
  /* mostra o comeco e um "ver tudo" que abre o texto inteiro no lugar */
  function expansivel(v, n){
    const t = Util.strVal(v);
    if(!t) return '(vazio)';
    if(t.length <= n) return esc(t);
    return '<span class="xp"><span class="xp-c">' + esc(t.slice(0, n)) + '…</span>'
         + '<span class="xp-f" hidden style="white-space:pre-wrap">' + esc(t) + '</span>'
         + '<a href="#" class="xp-t">ver tudo</a></span>';
  }
  /* celulas cortadas nas tabelas do detalhe: um clique abre, outro fecha */
  function ligarExpansao(host){
    if(host.__xp) return;          /* o corpo do modal e reaproveitado: liga uma vez so */
    host.__xp = true;
    host.addEventListener('click', ev => {
      const a = ev.target.closest('.xp-t');
      if(a){
        ev.preventDefault();
        const box = a.closest('.xp'), aberto = !box.querySelector('.xp-f').hidden;
        box.querySelector('.xp-f').hidden = aberto;
        box.querySelector('.xp-c').hidden = !aberto;
        a.textContent = aberto ? 'ver tudo' : 'recolher';
        return;
      }
      const td = ev.target.closest('table.tbl td');
      if(!td || ev.target.closest('a,button')) return;
      if(td.classList.contains('td-aberta')){ td.classList.remove('td-aberta'); return; }
      if(td.scrollWidth > td.clientWidth + 1){ td.classList.add('td-aberta'); td.classList.remove('corta'); }
    });
    host.addEventListener('mouseover', ev => {
      const td = ev.target.closest('table.tbl td');
      if(!td || td.classList.contains('td-aberta')) return;
      if(td.scrollWidth > td.clientWidth + 1){ td.classList.add('corta'); if(!td.title) td.title = 'Clique para ver o texto completo'; }
    });
  }

  function abrir(key){
    const rec = DB.all().ncrs[key];
    if(!rec){ Util.toast('NCR não encontrada no banco.','err'); return; }
    const m = Metrics.derive(rec);
    const prods = DB.produtosDe(rec.key);
    const ativos = prods.filter(p => p.ativo !== false);
    const ev = DB.eventos(rec.key);
    const campos = rec.campos || {};
    const principais = ['status','disciplina','data criacao','nivel','critico','sbr','tipo de produto',
                        'tipo de anomalia','motivo da anomalia','retrabalho','regressao','autor','especialista 2.1',
                        'especialista ta','responsavel 7.2 ta','bigramas','cos','cte','saida de mar','ncr original'];
    const chaves = Object.keys(campos);
    const ordenadas = chaves.slice().sort((a,b) => {
      const ia = principais.indexOf(Util.norm(a)), ib = principais.indexOf(Util.norm(b));
      return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || Util.cmp(a,b);
    });
    const dl = ks => '<dl class="dl">' + ks.map(k => {
      let v = Util.strVal(campos[k]);
      if(/data|date/i.test(k) && /^\d{4}-\d{2}-\d{2}T/.test(v)) v = Util.fDateTime(v);
      return '<dt>'+esc(k)+'</dt><dd>'+(v ? esc(v) : '<span class="muted">—</span>')+'</dd>';
    }).join('') + '</dl>';
    const tabs = [
      ['resumo','Resumo'], ['fluxo','Fluxo gráfico'], ['hist','Histórico ('+ev.length+')'],
      ['prod','Produtos ('+ativos.length+')'], ['campos','Todos os campos ('+chaves.length+')']
    ];
    const body = `
      <div class="tabs">${tabs.map((t,i) => '<button class="tab'+(i===0?' active':'')+'" data-tab="'+t[0]+'">'+esc(t[1])+'</button>').join('')}</div>
      <div class="tabpane active" id="tp-resumo">
        <div class="grid g6" style="margin-bottom:14px">
          ${tileHtml('Dias no status', m.diasStatus==null?'—':m.diasStatus, 'desde '+Util.fDate(rec.statusDesde), 'var(--s1)')}
          ${tileHtml('Sem movimento', m.diasMov==null?'—':m.diasMov, m.faixa, m.diasMov>=60?'var(--critical)':m.diasMov>=30?'var(--warning)':'var(--good)')}
          ${tileHtml('Idade', m.idade==null?'—':m.idade, 'criada '+Util.fDate(rec.criadoEm), 'var(--s4)')}
          ${tileHtml('Movimentações', m.movimentos, (rec.mov.avancos||0)+'↑ '+(rec.mov.laterais||0)+'→', 'var(--s3)')}
          ${tileHtml('Retornos', m.retornos, (rec.mov.reaberturas||0)+' reaberturas', m.retornos?'var(--critical)':'var(--muted)')}
          ${tileHtml('Produtos', ativos.length, (prods.length-ativos.length)+' removidos', 'var(--s2)')}
        </div>
        <div class="grid g2">
          <div>${card('Situação atual', '', `
            <div class="kv"><span>Status</span><span>${badgeStatus(rec)}</span></div>
            <div class="kv"><span>Etapa</span><b>${esc(Flow.etapa(rec.ordem))}</b></div>
            <div class="kv"><span>Ordem no fluxo</span><b>${rec.ordem==null?'fora do fluxo':rec.ordem}</b></div>
            <div class="kv"><span>Acompanhada desde</span><b>${Util.fDate(rec.primeiraVez)}</b></div>
            <div class="kv"><span>Última observação</span><b>${Util.fDate(rec.ultimaVez)}</b></div>
            <div class="kv"><span>Última alteração</span><b>${Util.fDate(rec.ultimaAlteracao)}</b></div>
            <div class="kv"><span>Arquivo de origem</span><span class="small mono">${esc(rec.arquivoOrigem||'—')}</span></div>`)}</div>
          <div>${card('Informações gerais','', dl(ordenadas.slice(0,14)))}</div>
        </div>
        <div style="margin-top:14px">${card('Últimas movimentações','', timeline(rec, 6))}</div>
      </div>
      <div class="tabpane" id="tp-fluxo">
        <div class="hstack" style="gap:6px;margin-bottom:10px">
          <button class="btn sm${modoFluxo==='traj'?' primary':''}" data-fx="traj"
            title="Um passo por linha, na ordem em que aconteceram">Trajetória</button>
          <button class="btn sm${modoFluxo==='mapa'?' primary':''}" data-fx="mapa"
            title="Todas as etapas do fluxo, inclusive as não percorridas">Mapa do fluxo</button>
          <span class="muted small" id="fxHint"></span>
        </div>
        <div class="flowmap" id="fxHost"></div>
        ${legendaFluxo()}
        <div style="margin-top:14px">${card('Tempo por etapa percorrida','acumulado', tabelaVisitas(rec))}</div>
      </div>
      <div class="tabpane" id="tp-hist">${ev.length > 300 ? '<div class="note small" style="margin-bottom:10px">Exibindo os 300 eventos mais recentes de '+Util.fNum(ev.length)+'. O histórico completo está na tela <b>Histórico</b> e na exportação JSON.</div>' : ''}${timeline(rec, 300)}</div>
      <div class="tabpane" id="tp-prod">${tabelaProdutos(prods)}</div>
      <div class="tabpane" id="tp-campos">${dl(ordenadas)}</div>`;
    UI.modal({
      title: esc(rec.id),
      sub: badgeStatus(rec) + ' <span class="badge ord">' + esc(Flow.etapa(rec.ordem)) + '</span> '
         + (m.retornos ? '<span class="mv mv-RETORNO">↩ '+m.retornos+' retorno(s)</span> ' : '')
         + (!rec.fechada && m.diasMov >= (DB.cfg().semMovimentacaoDias||30) ? '<span class="badge warn">parada há '+m.diasMov+' dias</span>' : '')
         + (rec.sistema ? ' <span class="badge new" title="trajetória com as datas exatas da aba Histórico do NCR Integrada">histórico do sistema · capturado em '+Util.fDate(rec.sistema.capturadoEm)+'</span>' : '')
         + (rec.reconstruida ? ' <span class="badge new" title="trajetória lida das colunas datadas do próprio export, e não apenas de importações sucessivas">trajetória reconstruída de '+rec.reconstruida+' marcos</span>' : ''),
      body,
      footer: '<button class="btn" id="dtExp">Exportar NCR (JSON)</button><button class="btn" data-close>Fechar</button>'
    });
    function desenharFluxo(){
      const host = $('#fxHost');
      if(!host) return;
      host.innerHTML = modoFluxo === 'mapa' ? flowSVG(rec) : trajSVG(rec);
      $('#fxHint').textContent = modoFluxo === 'mapa'
        ? 'Cada seta corre numa faixa própria; o número é a ordem do passo.'
        : 'De cima para baixo, na ordem real; a coluna mostra em que etapa do fluxo cada passo caiu.';
      $$('#modalBody [data-fx]').forEach(b => b.classList.toggle('primary', b.dataset.fx === modoFluxo));
    }
    desenharFluxo();
    ligarExpansao($('#modalBody'));
    $$('#modalBody [data-fx]').forEach(b => b.onclick = () => { modoFluxo = b.dataset.fx; desenharFluxo(); });
    $$('#modalBody .tab').forEach(t => t.onclick = () => {
      $$('#modalBody .tab').forEach(x => x.classList.remove('active'));
      $$('#modalBody .tabpane').forEach(x => x.classList.remove('active'));
      t.classList.add('active');
      $('#tp-'+t.dataset.tab).classList.add('active');
    });
    $('#dtExp').onclick = () => Util.download('NCR_'+rec.id.replace(/[^\w-]/g,'_')+'.json',
      JSON.stringify({ncr:rec, produtos:prods, historico:ev}, null, 2));
  }
  function tabelaVisitas(rec){
    const v = rec.visitas || {};
    const ks = Object.keys(v);
    if(!ks.length) return semDados('Nenhuma etapa registrada');
    /* tempo 0 numa etapa cuja chegada nao foi datada pelo export nao e
       "zero dia": e ausencia de informacao, e precisa aparecer como tal */
    const est = new Set();
    DB.eventos(rec.key).forEach(e => { if(Flow.isFluxoEvt(e) && e.estimado && e.para) est.add(Util.strVal(e.para)); });
    const rows = ks.map(s => ({status:s, n:v[s].n, dias: v[s].ms/Util.DAY, ordem:Flow.ordemInferida(s),
                               semInfo: !v[s].ms && est.has(Util.strVal(s))}))
      .sort((a,b) => b.dias-a.dias);
    const max = Math.max.apply(null, rows.map(r => r.dias)) || 1;
    const algumSemInfo = rows.some(r => r.semInfo);
    return '<table class="tbl"><thead><tr><th>Status</th><th class="num">Passagens</th><th class="num">Dias acumulados</th><th style="width:130px"></th></tr></thead><tbody>'
      + rows.map(r => {
        const atual = Util.strVal(r.status) === Util.strVal(rec.status);
        const cor = r.ordem == null ? 'var(--muted)' : Charts.SERIES[(r.ordem-1)%8];
        return `<tr><td>${esc(r.status)} ${atual?'<span class="badge open">atual</span>':''}</td>
          <td class="num">${r.n}</td>
          <td class="num">${r.semInfo ? '<span class="muted" title="o export datou apenas a saída desta etapa, não a chegada">não informado</span>' : Util.fDec(r.dias,0)}</td>
          <td>${r.semInfo ? '' : '<div class="meter"><i style="width:'+Math.max(3,r.dias/max*100)+'%;background:'+cor+'"></i></div>'}</td></tr>`;
      }).join('') + '</tbody></table>'
      + (algumSemInfo ? '<div class="small muted" style="margin-top:8px">Etapas marcadas como <b>não informado</b> foram percorridas '
        + '(a passagem consta no export), mas a planilha registra apenas a data de saída — o tempo de permanência nelas é desconhecido '
        + 'e fica de fora das médias por etapa.</div>' : '');
  }
  function tabelaProdutos(prods){
    if(!prods.length) return semDados('Nenhum produto vinculado a esta NCR');
    const cols = new Set();
    prods.forEach(p => Object.keys(p.campos||{}).forEach(c => cols.add(c)));
    const lista = Array.from(cols).filter(c => Util.norm(c) !== 'numero ncr' && Util.norm(c) !== 'produto');
    return '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Produto</th>'
      + lista.map(c => '<th>'+esc(c)+'</th>').join('') + '<th>Situação</th></tr></thead><tbody>'
      + prods.map(p => '<tr><td><b class="mono">'+esc(p.produto)+'</b></td>'
        + lista.map(c => '<td title="'+esc(Util.strVal(p.campos[c]))+'">'+esc(Util.strVal(p.campos[c]))+'</td>').join('')
        + '<td>'+(p.ativo === false ? '<span class="badge crit">removido '+Util.fDate(p.removidoEm)+'</span>' : '<span class="badge new">ativo</span>')+'</td></tr>').join('')
      + '</tbody></table></div>';
  }
  return {abrir, flowSVG, trajSVG, timeline, sequencia, legendaFluxo};
})();

/* ============================ Produtos ============================ */
const Prod = (() => {
  const st = {busca:'', pagina:1, sort:'ncrs', dir:-1};
  function agregar(){
    const keys = new Set(Filters.aplicar().map(n => n.key));
    const map = new Map();
    const P = DB.all().produtos;
    for(const k in P){
      const p = P[k];
      if(!keys.has(p.ncr)) continue;
      if(!map.has(p.produto)) map.set(p.produto, {produto:p.produto, ncrs:0, abertas:0, fechadas:0, removidos:0,
        ultima:null, status:new Map(), lista:[]});
      const a = map.get(p.produto);
      const rec = DB.all().ncrs[p.ncr];
      if(p.ativo === false){ a.removidos++; }
      a.ncrs++;
      a.lista.push({ncr:p.ncr, id: rec ? rec.id : p.ncrId || p.ncr, ativo:p.ativo !== false});
      if(rec){
        if(rec.fechada) a.fechadas++; else a.abertas++;
        a.status.set(rec.status, (a.status.get(rec.status)||0)+1);
        if(!a.ultima || rec.ultimaAlteracao > a.ultima) a.ultima = rec.ultimaAlteracao;
      }
    }
    return Array.from(map.values());
  }
  function render(host){
    if(!Object.keys(DB.all().produtos).length){ host.innerHTML = semDados('Nenhum produto importado ainda. A aba de produtos do Excel é detectada automaticamente.'); return; }
    host.innerHTML = '';
    UI.barraFiltros(host, {maxFacetas:4});
    let lista = agregar();
    const totalProdutos = lista.length;
    const comMulti = lista.filter(p => p.ncrs > 1).length;
    const vincAtivos = lista.reduce((s,p) => s+p.ncrs-p.removidos, 0);
    const removidos = lista.reduce((s,p) => s+p.removidos, 0);
    /* vinculos cuja NCR nao veio na aba de NCRs (exportacao parcial) */
    const TP = DB.all().produtos;
    let orfaos = 0, orfaosNcr = new Set();
    for(const k in TP){ const p = TP[k]; if(!DB.all().ncrs[p.ncr]){ orfaos++; orfaosNcr.add(p.ncr); } }
    if(st.busca){ const q = st.busca.toLowerCase(); lista = lista.filter(p => p.produto.toLowerCase().indexOf(q) >= 0); }
    const campo = {ncrs:p => p.ncrs, abertas:p => p.abertas, fechadas:p => p.fechadas, produto:p => p.produto, ultima:p => p.ultima||''};
    lista.sort((a,b) => Util.cmp(campo[st.sort](a), campo[st.sort](b))*st.dir);
    const porPag = 40, totalPag = Math.max(1, Math.ceil(lista.length/porPag));
    if(st.pagina > totalPag) st.pagina = 1;
    const page = lista.slice((st.pagina-1)*porPag, st.pagina*porPag);
    const top = lista.slice().sort((a,b) => b.ncrs-a.ncrs).slice(0,12);
    const topAbertas = lista.slice().sort((a,b) => b.abertas-a.abertas).filter(p => p.abertas > 0).slice(0,12);
    const box = document.createElement('div');
    box.innerHTML = `
      <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-bottom:14px">
        ${tileHtml('Produtos distintos', Util.fNum(totalProdutos), 'no filtro atual', 'var(--s1)')}
        ${tileHtml('Vínculos ativos', Util.fNum(vincAtivos), 'NCR × produto', 'var(--s3)')}
        ${tileHtml('Produtos com >1 NCR', Util.fNum(comMulti), 'reincidência', 'var(--s4)')}
        ${tileHtml('Vínculos removidos', Util.fNum(removidos), 'retirados na origem', 'var(--muted)')}
        ${tileHtml('Vínculos órfãos', Util.fNum(orfaos), Util.fNum(orfaosNcr.size)+' NCRs ausentes', orfaos?'var(--warning)':'var(--muted)')}
      </div>
      ${orfaos ? '<div class="note warn" style="margin-bottom:14px"><b>'+Util.fNum(orfaos)+' vínculos de produto referenciam NCRs que não estão no banco</b> ('+Util.fNum(orfaosNcr.size)+' NCRs distintas). Isso acontece quando a aba de produtos do Excel cobre mais NCRs do que a aba de NCRs. Os vínculos foram preservados e passam a aparecer aqui assim que a NCR correspondente for importada.</div>' : ''}
      <div class="grid g2" style="margin-bottom:14px">
        ${card('Produtos com mais NCRs','top 12','<div class="chart-host" id="chP1"></div>')}
        ${card('Produtos com mais NCRs abertas','top 12','<div class="chart-host" id="chP2"></div>')}
      </div>
      <div class="hstack wrap" style="margin-bottom:10px">
        <div class="search" style="min-width:260px">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input type="search" id="pBusca" placeholder="Buscar produto..." value="${esc(st.busca)}">
        </div>
        <span class="muted small">${Util.fNum(lista.length)} produtos</span>
        <div class="right"><button class="btn sm" id="pCsv">Exportar CSV</button></div>
      </div>
      <div class="tbl-wrap"><table class="tbl"><thead><tr>
        ${[['produto','Produto'],['ncrs','NCRs'],['abertas','Abertas'],['fechadas','Fechadas'],['ultima','Última alteração']]
          .map(([k,l]) => '<th class="sortable '+(st.sort===k?'sorted':'')+'" data-s="'+k+'">'+l+'<span class="arr">'+(st.sort===k?(st.dir>0?'▲':'▼'):'↕')+'</span></th>').join('')}
        <th>Status predominante</th><th>NCRs vinculadas</th></tr></thead><tbody>
        ${page.map(p => {
          const stTop = Array.from(p.status.entries()).sort((a,b) => b[1]-a[1])[0];
          return `<tr><td><b class="mono">${esc(p.produto)}</b></td><td class="num">${p.ncrs}</td>
            <td class="num">${p.abertas}</td><td class="num">${p.fechadas}</td><td>${Util.fDate(p.ultima)}</td>
            <td>${stTop?'<span class="badge ord">'+esc(stTop[0])+' ('+stTop[1]+')</span>':'—'}</td>
            <td style="max-width:320px">${p.lista.slice(0,6).map(x => ncrLink(x.id,x.ncr)).join(', ')}${p.lista.length>6?' <span class="muted">+'+(p.lista.length-6)+'</span>':''}</td></tr>`;
        }).join('')}</tbody></table>${!page.length?semDados('Nenhum produto encontrado'):''}</div>
      <div class="pager"><button class="btn sm" id="pPrev" ${st.pagina===1?'disabled':''}>‹ Anterior</button>
        <span>Página <b>${st.pagina}</b> de <b>${totalPag}</b></span>
        <button class="btn sm" id="pNext" ${st.pagina>=totalPag?'disabled':''}>Próxima ›</button></div>`;
    host.appendChild(box);
    Charts.hbar($('#chP1'), {data: top.map(p => ({label:p.produto, value:p.ncrs, key:p.produto})), mono:true,
      onClick: k => { Filters.state.produto = k; Filters.invalidate(); UI.ir('ncrs'); }});
    Charts.hbar($('#chP2'), {data: topAbertas.map(p => ({label:p.produto, value:p.abertas, key:p.produto})),
      colorFn: () => 'var(--s2)', emptyMsg:'Nenhuma NCR aberta com produto vinculado',
      onClick: k => { Filters.state.produto = k; Filters.state.situacao = 'abertas'; Filters.invalidate(); UI.ir('ncrs'); }});
    ligarLinks(box);
    $('#pBusca', box).oninput = Util.debounce(e => { st.busca = e.target.value.trim(); st.pagina = 1; UI.render('produtos'); }, 300);
    $$('th[data-s]', box).forEach(th => th.onclick = () => {
      if(st.sort === th.dataset.s) st.dir = -st.dir; else { st.sort = th.dataset.s; st.dir = -1; }
      UI.render('produtos');
    });
    $('#pPrev', box).onclick = () => { st.pagina--; UI.render('produtos'); };
    $('#pNext', box).onclick = () => { st.pagina++; UI.render('produtos'); };
    $('#pCsv', box).onclick = () => {
      const rows = [['Produto','NCRs','Abertas','Fechadas','Removidos','Ultima alteracao','NCRs vinculadas']];
      lista.forEach(p => rows.push([p.produto,p.ncrs,p.abertas,p.fechadas,p.removidos,Util.fDate(p.ultima),p.lista.map(x => x.id).join(' | ')]));
      Util.download('produtos_'+Util.stamp()+'.csv', Util.toCSV(rows), 'text/csv;charset=utf-8');
    };
  }
  return {render};
})();

/* ============================ Aging ============================ */
const Aging = (() => {
  function render(host){
    if(!DB.contagem().ncrs){ host.innerHTML = semDados('Importe os arquivos Excel para analisar o aging.'); return; }
    host.innerHTML = '';
    UI.barraFiltros(host, {maxFacetas:4});
    const cfg = DB.cfg();
    const list = Filters.aplicar();
    const abertas = list.filter(n => !n.fechada);
    const comD = abertas.map(n => ({n, dMov: Util.days(n.ultimaAlteracao||n.primeiraVez), dSt: Util.days(n.statusDesde||n.primeiraVez), idade: Util.days(n.criadoEm||n.primeiraVez)}))
                        .filter(x => x.dMov != null);
    const media = comD.length ? comD.reduce((s,x) => s+x.dMov,0)/comD.length : null;
    const max = comD.length ? Math.max.apply(null, comD.map(x => x.dMov)) : null;
    const crit = comD.filter(x => x.dMov > 60).length;
    const faixas = cfg.agingFaixas.map(f => f.lbl);
    const cor = ['var(--good)','var(--s3)','var(--warning)','var(--serious)','var(--critical)'];
    const cMov = {}, cSt = {};
    comD.forEach(x => { const a = Metrics.faixa(x.dMov); cMov[a] = (cMov[a]||0)+1;
                        const b = Metrics.faixa(x.dSt); cSt[b] = (cSt[b]||0)+1; });
    /* aging medio por status */
    const porStatus = new Map();
    comD.forEach(x => {
      const s = x.n.status || '—';
      if(!porStatus.has(s)) porStatus.set(s, {soma:0, n:0, max:0});
      const a = porStatus.get(s);
      a.soma += x.dSt; a.n++; if(x.dSt > a.max) a.max = x.dSt;
    });
    const agingStatus = Array.from(porStatus.entries()).map(([s,a]) => ({label:s, value:Math.round(a.soma/a.n), n:a.n, max:a.max, key:s}))
      .sort((a,b) => b.value-a.value).slice(0,14);
    /* responsaveis com NCRs antigas */
    const campoResp = DB.campos().find(c => /especialista 2 1|responsavel|especialista ta|autor/.test(Util.norm(c)));
    const porResp = new Map();

        ${tileHtml('Média sem movimento', media==null?'—':Util.fDec(media,0)+' d', 'entre as abertas', 'var(--s4)')}
        ${tileHtml('Maior aging', max==null?'—':max+' d', 'NCR mais parada', 'var(--serious)')}
        ${tileHtml('Acima de 60 dias', Util.fNum(crit), 'atenção prioritária', 'var(--critical)', 'crit')}
      </div>
      <div class="grid g2" style="margin-bottom:14px">
        ${card('Distribuição por faixa — dias sem movimentação','clique para filtrar','<div class="chart-host" id="chAg1"></div>')}
        ${card('Distribuição por faixa — dias no status atual','','<div class="chart-host" id="chAg2"></div>')}
      </div>
      <div class="grid g2" style="margin-bottom:14px">
        ${card('Aging médio por status','dias no status · top 14','<div class="chart-host" id="chAg3"></div>')}
        ${card('Responsáveis com NCRs paradas','≥ '+(cfg.semMovimentacaoDias||30)+' dias · top 12','<div class="chart-host" id="chAg4"></div>')}
      </div>
      ${card('NCRs mais antigas sem movimentação','top 60','<div class="tbl-wrap" style="max-height:520px"><table class="tbl"><thead><tr>'
        + '<th>NCR</th><th>Status</th><th>Etapa</th><th class="num">Sem movimento</th><th class="num">No status</th><th class="num">Idade</th><th>Faixa</th><th>Responsável</th>'
        + '</tr></thead><tbody>' + antigas.map(x => {

            return `<tr class="clickable" data-key="${esc(x.n.key)}"><td>${ncrLink(x.n.id,x.n.key)}</td>
              <td>${esc(x.n.status||'—')}</td><td class="small">${esc(Flow.etapa(x.n.ordem))}</td>
              <td class="num" style="color:${c};font-weight:600">${x.dMov} d</td><td class="num">${x.dSt} d</td>
              <td class="num">${x.idade==null?'—':x.idade+' d'}</td><td><span class="badge ord">${esc(Metrics.faixa(x.dMov))}</span></td>
              <td class="small">${esc(campoResp?Util.strVal(x.n.campos[campoResp]):'—')}</td></tr>`;
          }).join('') + '</tbody></table></div>')}`;
    host.appendChild(box);
    Charts.column($('#chAg1'), {data: faixas.map((f,i) => ({label:f, value:cMov[f]||0, key:f, color:cor[Math.min(i,4)]})), height:230, barW:44,
      onClick: k => { Filters.state.aging = [k]; Filters.state.situacao = 'abertas'; Filters.invalidate(); UI.ir('ncrs'); }});
    Charts.column($('#chAg2'), {data: faixas.map((f,i) => ({label:f, value:cSt[f]||0, key:f, color:cor[Math.min(i,4)]})), height:230, barW:44});
    Charts.hbar($('#chAg3'), {data: agingStatus, unit:'dias em média', suffix:' d',

      onClick: k => { Filters.state.statusRapido = k; Filters.invalidate(); UI.ir('ncrs'); }});
    Charts.hbar($('#chAg4'), {data: respData, mono:true, emptyMsg:'Nenhuma NCR parada no filtro atual',
      onClick: k => { if(campoResp){ Filters.state.campos[campoResp] = [k]; Filters.state.situacao = 'abertas'; Filters.invalidate(); UI.ir('ncrs'); } }});
    ligarLinks(box);
    $$('tr[data-key]', box).forEach(tr => tr.onclick = e => { if(!e.target.closest('a')) Detalhe.abrir(tr.dataset.key); });
